<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GOB</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b1020;
      color: #f4f1ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    h1 {
      margin: 0;
      letter-spacing: 0.12em;
      font-weight: 600;
    }
    p {
      margin: 0;
      opacity: 0.75;
      max-width: 28rem;
      text-align: center;
      line-height: 1.4;
    }
    .pulse {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #e24a1b;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="pulse" aria-hidden="true"></div>
    <h1>GOB</h1>
    <p>Starting the local engine. The first launch can take a minute while scientific libraries load.</p>
  </div>
</body>
</html>
