<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Geeked-Out Basketball — engine stopped</title>
  <style>
    /* Same local tokens/fonts as splash.html. Electron cannot load FrontEnd/static here. */
    @font-face {
      font-family: 'Bebas Neue Pro';
      src: url('assets/BebasNeuePro-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Barlow';
      src: url('assets/Barlow-latin.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --bg: #0b0d14;
      --text-100: #ffffff;
      --text-87: rgba(255,255,255,.87);
      --text-60: rgba(255,255,255,.60);
      --surface-2: #141824;
      --line: rgba(255,255,255,.08);
      --radius-10: 10px;
      --font-display: 'Bebas Neue Pro', 'Bebas Neue', sans-serif;
      --font-body: 'Barlow', sans-serif;
      --fs-13: 13px;
      --fs-40: 40px;
      --lh-body: 1.35;
      --lh-85: .85;
      --tracking-1: .01em;
    }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text-100);
      font-family: var(--font-body);
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
    }
    .mark {
      width: min(280px, 56vw);
      height: auto;
    }
    h1 {
      margin: 0;
      font: 700 var(--fs-40)/var(--lh-85) var(--font-display);
      letter-spacing: var(--tracking-1);
      text-align: center;
    }
    p {
      margin: 0;
      max-width: 36rem;
      text-align: center;
      font-size: var(--fs-13);
      line-height: var(--lh-body);
      color: var(--text-60);
    }
    code {
      display: block;
      margin-top: 8px;
      max-width: 40rem;
      padding: 12px 14px;
      background: var(--surface-2);
      box-shadow: inset 0 0 0 1px var(--line);
      border-radius: var(--radius-10);
      white-space: pre-wrap;
      text-align: left;
      font-size: var(--fs-13);
      color: var(--text-87);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="mark" src="assets/geekedout_logo.png" alt="Geeked-Out Basketball">
    <h1>The game engine stopped</h1>
    <p>Geeked-Out Basketball cannot open a game without the local engine. Quit the app and open it again. If this keeps happening, the log is in your GOB Application Support folder.</p>
    <code id="message">Unknown error.</code>
  </div>
  <script>
    var message = '';
    try {
      var raw = window.location.search || '';
      var match = raw.match(/[?&]message=([^&]*)/);
      if (match) message = decodeURIComponent(match[1].replace(/\+/g, ' '));
    } catch (e) { message = ''; }
    if (message) document.getElementById('message').textContent = message;
  </script>
</body>
</html>
