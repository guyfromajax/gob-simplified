<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GOB — engine stopped</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b1020;
      color: #f4f1ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px;
    }
    h1 { margin: 0; }
    p {
      margin: 0;
      max-width: 36rem;
      text-align: center;
      line-height: 1.45;
      opacity: 0.85;
    }
    code {
      display: block;
      margin-top: 8px;
      padding: 12px 14px;
      background: #161b2e;
      border-radius: 8px;
      white-space: pre-wrap;
      text-align: left;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>The engine stopped</h1>
    <p>GOB cannot open a game without the local engine. Quit the app and open it again. If this keeps happening, the log is in your GOB Application Support folder.</p>
    <code id="message">Unknown error.</code>
  </div>
  <script>
    var params = new URLSearchParams(window.location.search);
    var message = params.get('message');
    if (message) document.getElementById('message').textContent = message;
  </script>
</body>
</html>
