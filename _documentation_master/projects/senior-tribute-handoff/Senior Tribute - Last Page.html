<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Senior Tribute — Last Page</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="senior-tribute-hifi.css">
</head>
<body>
<div id="app"></div>
<div class="dock" id="dock">
<h6>Review only<button data-toggle>Hide</button></h6>
<div class="dock-body">
<div class="dock-row"><span>Class size</span><div class="dock-btns">
<button class="b" data-k="count" data-v="1">1</button>
<button class="b on" data-k="count" data-v="5">5</button>
<button class="b" data-k="count" data-v="12">12</button>
</div></div>
<div class="dock-row"><span>Titles</span><div class="dock-btns">
<button class="b on" data-k="titles" data-v="0">None</button>
<button class="b" data-k="titles" data-v="1">All four</button>
</div></div>
<div class="dock-row"><span>Name length</span><div class="dock-btns">
<button class="b on" data-k="name" data-v="0">Typical</button>
<button class="b" data-k="name" data-v="1">Longest</button>
</div></div>
<div class="dock-row"><span>Portrait</span><div class="dock-btns">
<button class="b on" data-k="shot" data-v="0">Served</button>
<button class="b" data-k="shot" data-v="1">Missing</button>
</div></div>
<div class="dock-row"><span>Motion</span><div class="dock-btns">
<button class="b on" data-k="rm" data-v="0">Full</button>
<button class="b" data-k="rm" data-v="1">Reduced</button>
</div></div>
<div class="dock-row"><span>Jump</span><div class="dock-btns">
<button class="b" data-k="go" data-v="slides">Restart · R</button>
<button class="b" data-k="go" data-v="res">Resolution · E</button>
</div></div>
</div>
</div>
<script src="senior-tribute-hifi.js"></script>
</body>
</html>
