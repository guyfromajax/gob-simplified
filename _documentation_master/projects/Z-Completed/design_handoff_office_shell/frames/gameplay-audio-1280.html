<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GOB · Live game · no shell · sound popover open from the scoreboard strip speaker</title>
<!-- Live game · no shell · sound popover open from the scoreboard strip speaker — static reference. Sample data is illustrative. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body class="gob-preview">
<div class="gob gob-1280">
<div class="gp">
  <div class="gp-court">
    live game · court + existing overlays (unchanged)
  </div>
  <div class="sb">
    <div class="sb-t">
      <span class="logo" style="--tc:#A3243B;width:28px;height:28px;font-size:17px">L</span><b>LAW</b><strong>54</strong>
    </div>
    <div class="sb-c">
      <b>Q3 · 4:12</b><span>BONUS</span>

      <strong>49</strong><b>MOR</b><span class="logo" style="--tc:#5B3A8E;width:28px;height:28px;font-size:17px">M</span>

    <div class="sb-snd">
      <button class="open" title="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5h3l4.5-4v13l-4.5-4h-3Z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>

        <div class="snd-m">
          <span>Mute all</span><span class="tgl"></span>
        </div>
        <div class="snd-r">
          <span>Music</span>
          <div class="slider">
            <i style="width:45%"></i><b style="left:45%"></b>
          </div>
          <span>45</span>
        </div>
        <div class="snd-r">
          <span>SFX</span>
          <div class="slider">
            <i style="width:75%"></i><b style="left:75%"></b>
          </div>
          <span>75</span>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
