  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"013e2499-f51b-4ee3-9939-ba7a00fba800\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"c7dc3884-205a-44e6-a91c-924256ea9088\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e0b1657a-f45b-499e-9f77-856f56414977\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   GOB FTE Onboarding — Base layer\n   Tokens, typography, universal buttons, full modal system.\n   All values lifted from Styleguide_updated.md.\n   ============================================================ */\n\n@font-face {\n  font-family: 'Bebas Neue Pro';\n  src: url(\"1ecba56f-cb26-4ab5-aadd-1df80f8eab78\") format('opentype');\n  font-weight: 700; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: 'Bebas Neue Pro';\n  src: url(\"463afd1f-23ee-4fa2-8ce8-594132f77938\") format('opentype');\n  font-weight: 400; font-style: normal; font-display: swap;\n}\n@font-face {\n  font-family: 'Bebas Neue Pro';\n  src: url(\"9f7c22ec-ab74-412c-8cb6-5a8c60f11589\") format('opentype');\n  font-weight: 300; font-style: normal; font-display: swap;\n}\n\n:root {\n  --bg:        #0b0d14;\n  --blue:      #27408E;\n  --blue-lt:   #4A90D9;\n  --orange:    #F79420;\n  --green:     #34EC27;\n  --yellow:    #FFD700;\n  --red:       #ff6d6d;\n\n  --white:     #ffffff;\n  --w90:       rgba(255,255,255,0.90);\n  --w70:       rgba(255,255,255,0.70);\n  --w55:       rgba(255,255,255,0.55);\n  --w50:       rgba(255,255,255,0.50);\n  --w35:       rgba(255,255,255,0.35);\n  --w28:       rgba(255,255,255,0.28);\n  --w20:       rgba(255,255,255,0.20);\n  --w14:       rgba(255,255,255,0.14);\n  --w12:       rgba(255,255,255,0.12);\n  --w09:       rgba(255,255,255,0.09);\n  --w06:       rgba(255,255,255,0.06);\n\n  --bebas:     'Bebas Neue Pro', 'Bebas Neue', sans-serif;\n  --inter:     'Inter', system-ui, sans-serif;\n}\n\n*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\nhtml, body { height: 100%; }\nbody {\n  font-family: var(--inter);\n  background: var(--bg);\n  color: var(--w90);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* ============================================================\n   UNIVERSAL BUTTON  (Styleguide → Buttons)\n   min 138 × fixed 42, 18px h-pad, 10px radius, Bebas, tracked.\n   ============================================================ */\n.gob-btn {\n  font-family: var(--bebas);\n  font-weight: 700;\n  font-size: 19px;\n  letter-spacing: 1.5px;\n  line-height: 1;\n  min-width: 138px;\n  height: 42px;\n  padding: 0 18px;\n  border-radius: 10px;\n  border: 1px solid var(--w28);\n  box-shadow: inset 0 1px 0 rgba(255,255,255,0.18);\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  cursor: pointer;\n  transition: transform .12s ease, filter .12s ease, background .12s ease, border-color .12s ease;\n  user-select: none;\n  white-space: nowrap;\n}\n.gob-btn:hover  { transform: translateY(-1px); filter: brightness(1.07); }\n.gob-btn:active { transform: translateY(1px); filter: brightness(0.96); }\n\n/* Gating action — advances game state. GREEN. Use sparingly. */\n.gob-btn--gate {\n  background: var(--green);\n  color: #0b1a07;\n  border-color: rgba(255,255,255,0.32);\n}\n/* Non-gating primary — saves / configures / continues. ORANGE. */\n.gob-btn--action {\n  background: var(--orange);\n  color: #1b1206;\n  border-color: rgba(255,255,255,0.30);\n}\n/* Ghost / neutral — secondary, acknowledgements. */\n.gob-btn--ghost {\n  background: var(--w06);\n  color: var(--w90);\n  border-color: var(--w14);\n}\n.gob-btn--lg { height: 46px; font-size: 21px; padding: 0 26px; }\n\n.gob-btn:disabled,\n.gob-btn[aria-disabled=\"true\"] {\n  opacity: .4; cursor: not-allowed; transform: none; filter: none;\n}\n\n/* Back / return — low-weight text link, NOT a button. */\n.gob-back {\n  display: inline-flex; align-items: center; gap: 7px;\n  font-family: var(--inter); font-size: 13px; font-weight: 500;\n  color: var(--w50); background: none; border: 0; cursor: pointer;\n  letter-spacing: .2px; transition: color .12s ease;\n}\n.gob-back:hover { color: var(--w90); }\n.gob-back svg { width: 13px; height: 13px; }\n\n/* ============================================================\n   SHELL  (Page Background System → Type 1)\n   ============================================================ */\n.gob-shell {\n  position: relative;\n  border-radius: 24px;\n  border: 1px solid var(--w09);\n  background:\n    linear-gradient(160deg, rgba(255,255,255,0.028) 0%, rgba(255,255,255,0.014) 18%, transparent 40%),\n    rgba(14,16,24,0.96);\n  box-shadow: 0 20px 48px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.07);\n  overflow: hidden;\n}\n.gob-shell::after {\n  content: ''; position: absolute; inset: 0; border-radius: 24px; pointer-events: none;\n  background: repeating-linear-gradient(132deg,\n    transparent 0 102px, rgba(255,255,255,0.012) 102px 103px, transparent 103px 208px);\n}\n.gob-shell > * { position: relative; z-index: 1; }\n\n/* ============================================================\n   FUNCTIONAL MODAL  (Modal System → Functional)\n   surface 22,26,36/.98 · backdrop .72 · 3px accent · 420 max · r14\n   ============================================================ */\n.gob-modal-overlay {\n  position: absolute; inset: 0; z-index: 60;\n  display: flex; align-items: center; justify-content: center;\n  opacity: 0; pointer-events: none; transition: opacity .2s ease;\n}\n.gob-modal-overlay.is-visible { opacity: 1; pointer-events: auto; }\n.gob-modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.72); }\n\n.gob-modal-box {\n  position: relative;\n  width: min(420px, calc(100% - 48px));\n  background: rgba(22,26,36,0.98);\n  border: 1px solid var(--w12);\n  border-radius: 14px;\n  overflow: hidden;\n  box-shadow: 0 24px 60px rgba(0,0,0,0.5);\n  transform: scale(.96);\n  transition: transform .2s ease;\n}\n.gob-modal-overlay.is-visible .gob-modal-box { transform: scale(1); }\n.gob-modal-accent { height: 3px; width: 100%; background: var(--orange); }\n.gob-modal-accent.is-green { background: var(--green); }\n.gob-modal-accent.is-red   { background: var(--red); }\n.gob-modal-body { padding: 26px 28px 8px; text-align: center; }\n.gob-modal-title {\n  font-family: var(--bebas); font-weight: 700; font-size: 28px;\n  letter-spacing: .5px; color: var(--white); line-height: 1.04;\n}\n.gob-modal-subtitle {\n  font-family: var(--inter); font-size: 14px; line-height: 1.5;\n  color: var(--w55); margin-top: 10px; text-wrap: pretty;\n}\n.gob-modal-actions {\n  display: flex; flex-direction: row; gap: 10px; padding: 22px 28px 26px;\n}\n.gob-modal-actions .gob-btn-primary   { flex: 2; }\n.gob-modal-actions .gob-btn-secondary { flex: 1; }\n.gob-modal-actions .gob-btn-dismiss   { width: 100%; }\n\n/* ============================================================\n   MOMENT MODAL  (Modal System → Moment)\n   surface 13,17,36/.97 · full-bleed image + gradient · 560 max · r16\n   ============================================================ */\n.gob-moment-overlay {\n  position: absolute; inset: 0; z-index: 60;\n  display: flex; align-items: center; justify-content: center;\n  opacity: 0; pointer-events: none; transition: opacity .2s ease;\n}\n.gob-moment-overlay.is-visible { opacity: 1; pointer-events: auto; }\n.gob-moment-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.72); }\n.gob-moment-box {\n  position: relative;\n  width: min(560px, calc(100% - 48px));\n  background: rgba(13,17,36,0.97);\n  border: 1px solid var(--w12);\n  border-radius: 16px;\n  overflow: hidden;\n  box-shadow: 0 30px 80px rgba(0,0,0,0.6);\n  transform: scale(.96);\n  transition: transform .2s ease;\n}\n.gob-moment-overlay.is-visible .gob-moment-box { transform: scale(1); }\n\n/* ---- Full-bleed team logo as BACKGROUND TEXTURE (not content) ---- */\n.moment-logobg {\n  position: absolute; inset: 0; overflow: hidden; z-index: 0;\n  background: linear-gradient(160deg, #14463f 0%, #0c2c34 55%, #0a1830 100%);\n}\n.moment-logobg__mark {\n  position: absolute; top: 50%; left: 50%;\n  transform: translate(-50%, -54%) scale(1.7);\n  display: flex; flex-direction: column; align-items: center;\n  font-family: var(--bebas); color: #adebe4;\n  line-height: .82; white-space: nowrap;\n  /* THE KEY MOVES: desaturate, darken, soften → texture, not foreground */\n  opacity: .14;\n  filter: grayscale(.5) brightness(1.15) blur(.4px);\n}\n.moment-logobg__emblem { font-size: 96px; margin-bottom: 6px; }\n.moment-logobg__word   { font-size: 54px; letter-spacing: 3px; }\n.moment-logobg__word--lg { font-size: 82px; }\n\n/* The scrim: a calm dark column down the middle where copy lives */\n.moment-scrim {\n  position: absolute; inset: 0; z-index: 1; pointer-events: none;\n  background:\n    radial-gradient(120% 80% at 50% 42%, rgba(13,17,36,0.78) 0%, rgba(13,17,36,0.40) 45%, transparent 75%),\n    linear-gradient(180deg, rgba(13,17,36,0.55) 0%, rgba(13,17,36,0.30) 30%, rgba(13,17,36,0.72) 78%, rgba(13,17,36,0.96) 100%);\n}\n\n/* \"Raw logo\" comparison mode — what it looks like WITHOUT the treatment */\n.gob-moment-box.is-raw .moment-logobg { opacity: 1; }\n.gob-moment-box.is-raw .moment-logobg__mark { opacity: .85; filter: none; }\n.gob-moment-box.is-raw .moment-scrim { background: rgba(13,17,36,0.12); }\n\n/* ============================================================\n   COACH-MARK  (spotlight tooltip, NOT a modal)\n   ============================================================ */\n.gob-coachmark {\n  position: absolute; z-index: 70;\n  width: 300px;\n  background: rgba(22,26,36,0.99);\n  border: 1px solid var(--w14);\n  border-radius: 12px;\n  box-shadow: 0 18px 44px rgba(0,0,0,0.55);\n  padding: 16px 18px;\n}\n.gob-coachmark__eyebrow {\n  font-family: var(--bebas); font-size: 13px; letter-spacing: 1.4px;\n  color: var(--orange); margin-bottom: 6px;\n}\n.gob-coachmark__body { font-size: 13.5px; line-height: 1.5; color: var(--w90); text-wrap: pretty; }\n.gob-coachmark__foot {\n  display: flex; align-items: center; justify-content: space-between;\n  margin-top: 14px;\n}\n.gob-coachmark__count { font-size: 12px; color: var(--w50); }\n.gob-coachmark::after {\n  content: ''; position: absolute; width: 14px; height: 14px;\n  background: rgba(22,26,36,0.99);\n  border-left: 1px solid var(--w14); border-bottom: 1px solid var(--w14);\n}\n.gob-coachmark--up::after   { top: -7px; left: 36px; transform: rotate(135deg); border: 0; border-top: 1px solid var(--w14); border-right: 1px solid var(--w14); }\n.gob-coachmark--left::after { left: -7px; top: 28px; transform: rotate(45deg); }\n<\u002Fstyle>\n<style>\n  body { background: var(--bg); padding: 18px; }\n\n  #lineup-stage {\n    position: relative;\n    max-width: 1180px; margin: 0 auto;\n    border-radius: 20px; overflow: hidden;\n    border: 1px solid var(--w09);\n    background: rgba(13,16,24,0.97);\n  }\n\n  /* Banner */\n  .ln-banner {\n    height: 64px; position: relative; overflow: hidden;\n    background: linear-gradient(120deg, #c8551f 0%, #8a3a14 50%, #2a1408 100%);\n    display: flex; align-items: center; justify-content: center;\n  }\n  .ln-banner__word {\n    font-family: var(--bebas); font-size: 40px; letter-spacing: 10px;\n    color: rgba(255,255,255,0.9); text-shadow: 0 2px 10px rgba(0,0,0,0.5);\n  }\n  .ln-banner::after {\n    content: ''; position: absolute; inset: 0;\n    background: linear-gradient(to bottom, transparent, rgba(13,16,24,0.55));\n  }\n\n  /* Context bar */\n  .ln-ctx {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 12px 22px; border-bottom: 1px solid var(--w09);\n    background: rgba(14,17,28,0.98);\n  }\n  .sb-pill {\n    display: flex; align-items: center; gap: 11px;\n    padding: 8px 18px; background: var(--w06); border: 1px solid var(--w09);\n    border-radius: 999px; font-family: var(--bebas); letter-spacing: .6px;\n  }\n  .sb-pill .t { font-size: 13px; color: var(--w50); }\n  .sb-pill .n { font-size: 20px; color: var(--white); }\n  .sb-pill .q { color: var(--orange); font-size: 15px; }\n\n  /* Toggle */\n  .ln-toggle {\n    display: flex; gap: 4px; padding: 4px; margin: 16px 22px 0; width: max-content;\n    background: rgba(11,13,20,0.6); border: 1px solid var(--w09); border-radius: 999px;\n  }\n  .ln-toggle button {\n    font-family: var(--bebas); font-size: 15px; letter-spacing: 1px;\n    padding: 8px 22px; border-radius: 999px; border: 0; cursor: pointer;\n    background: transparent; color: var(--w50);\n  }\n  .ln-toggle button.is-active { background: var(--w12); color: var(--white); }\n\n  /* Table */\n  .ln-table-wrap { padding: 14px 22px 22px; }\n  table.attr-table { width: 100%; border-collapse: collapse; }\n  .attr-table th, .attr-table td {\n    text-align: center; padding: 11px 0; font-size: 13px;\n    font-variant-numeric: tabular-nums;\n  }\n  .attr-table thead th {\n    font-family: var(--bebas); font-size: 14px; letter-spacing: 1px;\n    color: var(--w50); border-bottom: 1px solid var(--w12);\n    position: relative;\n  }\n  .col-name { text-align: left !important; padding-left: 6px !important; min-width: 190px; }\n  .attr-table tbody td { color: var(--w70); border-bottom: 1px solid var(--w06); }\n  .attr-table tbody td.col-name { color: var(--w90); font-weight: 600; font-size: 14px; }\n  .pl-num { color: var(--w50); font-weight: 600; }\n  .attr-table td.rt { font-family: var(--bebas); font-size: 17px; }\n  .attr-table td.ng { color: var(--green); font-weight: 600; }\n  .ln-foot { font-size: 12px; color: var(--w35); font-style: italic; margin-top: 12px; padding-left: 6px; }\n\n  /* ============================================================\n     TOUR MECHANIC\n     ============================================================ */\n  /* Scrim dims everything; header row is lifted above it */\n  .tour-scrim {\n    position: absolute; inset: 0; z-index: 40;\n    background: rgba(7,9,14,0.66);\n    opacity: 0; pointer-events: none; transition: opacity .3s ease;\n  }\n  body.tour-on .tour-scrim { opacity: 1; }\n\n  /* Lift the header row out of the dim */\n  body.tour-on thead {\n    position: relative; z-index: 50;\n  }\n  body.tour-on thead tr {\n    background: rgba(20,24,34,0.98);\n    box-shadow: 0 0 0 1px rgba(247,148,32,0.5), 0 0 38px rgba(247,148,32,0.18);\n    outline: 1px solid rgba(247,148,32,0.35);\n    border-radius: 8px;\n  }\n  body.tour-on .attr-th { cursor: help; }\n\n  /* Interactive cue on each header cell */\n  body.tour-on .attr-th__abbr {\n    position: relative; display: inline-block;\n    color: var(--white); padding-bottom: 4px;\n  }\n  body.tour-on .attr-th__abbr::after {\n    content: ''; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);\n    width: 60%; height: 2px; border-radius: 2px;\n    background: linear-gradient(90deg, transparent, var(--orange), transparent);\n    opacity: .5; animation: shimmer 2.4s ease-in-out infinite;\n  }\n  @keyframes shimmer {\n    0%,100% { opacity: .28; width: 40%; }\n    50%     { opacity: .85; width: 72%; }\n  }\n  body.tour-on .attr-th:hover .attr-th__abbr { color: var(--orange); }\n  body.tour-on .attr-th.is-explored .attr-th__abbr { color: var(--green); }\n  body.tour-on .attr-th.is-explored .attr-th__abbr::after {\n    background: var(--green); opacity: .55; animation: none; width: 60%;\n  }\n\n  /* Sammy coach-mark anchored under the header */\n  .tour-coach {\n    position: absolute; z-index: 60; top: 232px; left: 50%; transform: translateX(-50%);\n    width: 430px; display: flex; gap: 14px; align-items: center;\n    background: rgba(22,26,36,0.99); border: 1px solid var(--w14);\n    border-radius: 12px; padding: 14px 16px;\n    box-shadow: 0 18px 44px rgba(0,0,0,0.55);\n    opacity: 0; pointer-events: none; transition: opacity .3s ease;\n  }\n  body.tour-on .tour-coach { opacity: 1; pointer-events: auto; }\n  .tour-coach::after {\n    content: ''; position: absolute; top: -7px; left: 60px; width: 14px; height: 14px;\n    background: rgba(22,26,36,0.99); border-left: 1px solid var(--w14); border-top: 1px solid var(--w14);\n    transform: rotate(45deg);\n  }\n  .tour-coach__face {\n    width: 52px; height: 52px; border-radius: 50%; flex: 0 0 auto;\n    border: 2px solid rgba(122,63,176,0.7);\n    background: radial-gradient(120% 120% at 30% 20%, rgba(122,63,176,0.4), transparent 62%),\n      repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 6px, rgba(255,255,255,0.02) 6px 12px), #161a24;\n    display: flex; align-items: center; justify-content: center;\n    font-family: var(--bebas); font-size: 9px; color: var(--w35); text-align: center;\n  }\n  .tour-coach__body { flex: 1; }\n  .tour-coach__eyebrow {\n    font-family: var(--bebas); font-size: 12px; letter-spacing: 1.4px; color: var(--orange); margin-bottom: 3px;\n  }\n  .tour-coach__text { font-size: 13px; line-height: 1.45; color: var(--w90); }\n  .tour-coach__foot { display: flex; align-items: center; justify-content: space-between; margin-top: 11px; }\n  #tour-count { font-size: 11.5px; color: var(--w50); font-variant-numeric: tabular-nums; }\n  #tour-done {\n    height: 32px; min-width: auto; font-size: 14px; padding: 0 16px;\n    opacity: .6; transition: opacity .2s ease, background .2s ease;\n  }\n  #tour-done.is-ready { opacity: 1; }\n\n  /* Hover tooltip */\n  .attr-tip {\n    position: absolute; z-index: 80; width: 248px; display: none;\n    background: rgba(13,16,24,0.99); border: 1px solid var(--w14);\n    border-radius: 10px; padding: 13px 15px; text-align: left;\n    box-shadow: 0 16px 40px rgba(0,0,0,0.6);\n  }\n  .attr-tip__arrow {\n    position: absolute; top: -7px; width: 13px; height: 13px;\n    background: rgba(13,16,24,0.99); border-left: 1px solid var(--w14); border-top: 1px solid var(--w14);\n    transform: translateX(-50%) rotate(45deg);\n  }\n  .attr-tip__abbr {\n    font-family: var(--bebas); font-size: 22px; letter-spacing: 1px; color: var(--orange);\n  }\n  .attr-tip__name {\n    font-family: var(--bebas); font-size: 15px; letter-spacing: .6px; color: var(--white);\n    margin: 2px 0 7px;\n  }\n  .attr-tip__desc { font-size: 12.5px; line-height: 1.5; color: var(--w70); }\n\n  .restart-btn {\n    position: fixed; bottom: 18px; right: 18px; z-index: 200;\n    font-family: var(--inter); font-size: 12px; font-weight: 600;\n    background: rgba(22,26,36,0.95); color: var(--w70);\n    border: 1px solid var(--w14); border-radius: 8px; padding: 8px 13px; cursor: pointer;\n  }\n  .restart-btn:hover { color: var(--white); border-color: var(--w28); }\n<\u002Fstyle>\n<\u002Fhead>\n\n<body class=\"tour-on\">\n\n<div id=\"lineup-stage\">\n  <div class=\"ln-banner\"><span class=\"ln-banner__word\">LANCASTER<\u002Fspan><\u002Fdiv>\n\n  <div class=\"ln-ctx\">\n    <div class=\"sb-pill\">\n      <span class=\"t\">LANCASTER<\u002Fspan><span class=\"n\">2<\u002Fspan>\n      <span style=\"color:var(--w35)\">—<\u002Fspan>\n      <span class=\"n\">0<\u002Fspan><span class=\"t\">BENTLEY-TRUMAN<\u002Fspan>\n      <span style=\"color:var(--w20)\">|<\u002Fspan><span class=\"q\">Q1<\u002Fspan><span class=\"t\">7:27<\u002Fspan>\n    <\u002Fdiv>\n    <button class=\"gob-btn gob-btn--gate\">RETURN TO GAME<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"ln-toggle\">\n    <button class=\"is-active\">ATTRIBUTES<\u002Fbutton>\n    <button>STATS<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div class=\"ln-table-wrap\">\n    <table class=\"attr-table\">\n      <thead id=\"attr-head\"><\u002Fthead>\n      <tbody id=\"attr-body\"><\u002Ftbody>\n    <\u002Ftable>\n    <div class=\"ln-foot\">*POS represents the player's highest rated position. Players can play any position.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Tour layers -->\n  <div class=\"tour-scrim\"><\u002Fdiv>\n\n  <div class=\"tour-coach\">\n    <div class=\"tour-coach__face\">SAMMY<\u002Fdiv>\n    <div class=\"tour-coach__body\">\n      <div class=\"tour-coach__eyebrow\">QUICK TOUR<\u002Fdiv>\n      <div class=\"tour-coach__text\">These are your player attributes. <b>Hover any column header<\u002Fb> to see what it tracks.<\u002Fdiv>\n      <div class=\"tour-coach__foot\">\n        <span id=\"tour-count\">0 of 17 explored<\u002Fspan>\n        <button id=\"tour-done\" class=\"gob-btn gob-btn--ghost\">GOT IT<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"attr-tip\">\n    <div class=\"attr-tip__arrow\"><\u002Fdiv>\n    <div class=\"attr-tip__abbr\">RT<\u002Fdiv>\n    <div class=\"attr-tip__name\">Overall Rating<\u002Fdiv>\n    <div class=\"attr-tip__desc\">—<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<button class=\"restart-btn\" id=\"tour-restart\">↻ Replay tour<\u002Fbutton>\n\n<script src=\"eb67e55a-491d-4c86-bb01-5fe06c7e1a90\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
