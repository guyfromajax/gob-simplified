name: Run Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
          npm ci
          npx playwright install --with-deps chromium
      - name: Run tests
        # Select in-memory Mongo explicitly. Missing or failed real Mongo config never
        # falls back to mongomock.
        env:
          GOB_DB_MODE: mongomock
          ENVIRONMENT: test
          MONGO_DB_NAME: gob-test
        run: pytest
      - name: Enforce environment and database boundaries
        run: python scripts/check_env_safety.py
