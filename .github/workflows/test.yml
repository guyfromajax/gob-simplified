name: Run Tests

on: [push, pull_request]

jobs:
  migration-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Check desktop-migration ratchets
        run: python scripts/ci/check_migration_gates.py

  ui-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Check UI token colour law
        run: python scripts/check_ui_tokens.py --strict --no-write

  engine-equiv:
    # Engine regression smoke: 16 games (seeds 8000-8003 x both footings x both arms)
    # compared field-for-field against the reference named in
    # scripts/sim_verify/CURRENT_REFERENCE. Fails on any fingerprint difference and
    # prints which metric moved. Never re-cut to make this green without Jamie
    # (CLAUDE.md, "Engine regression check").
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: equiv-v3 smoke against the current reference
        env:
          PYTHONHASHSEED: "0"
          GOB_DB_MODE: mongomock
          ENVIRONMENT: test
          MONGO_DB_NAME: gob-test
        run: python -m scripts.sim_verify.equiv --check --smoke

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        # Fully pinned (pip-compile). requirements-dev.txt = requirements.txt + pytest,
        # mongomock. See requirements.in / requirements-dev.in.
        run: pip install -r requirements-dev.txt
      - name: Run tests
        # Select in-memory Mongo explicitly. Missing or failed real Mongo config never
        # falls back to mongomock.
        env:
          GOB_DB_MODE: mongomock
          ENVIRONMENT: test
          MONGO_DB_NAME: gob-test
        run: pytest
      - name: Enforce environment and database boundaries
        run: python scripts/check_env_safety.py
