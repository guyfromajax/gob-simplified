# Netlify Configuration for GOB Simplified

[build]
  publish = "FrontEnd/static"
  # No build command needed (static site)

# Step 5.6: Security headers for frontend
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/images/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Redirect root to homepage.html
[[redirects]]
  from = "/tournament-select.html"
  to = "/mode-select.html"
  status = 302
  force = true

[[redirects]]
  from = "/tournament.html"
  to = "/mode-select.html"
  status = 302
  force = true

[[redirects]]
  from = "/"
  to = "/homepage.html"
  status = 200
  force = true
