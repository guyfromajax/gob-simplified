# Force Python + Node build so uvicorn is installed (Nixpacks was detecting only Node from package.json).
# See: https://nixpacks.com/docs/guides/configuring-builds

[phases.setup]
nixPkgs = ["python311", "nodejs_18"]
# numpy/scipy's compiled C-extensions dlopen libstdc++.so.6 at runtime; the base
# image doesn't provide it, so `import numpy` fails with
# "libstdc++.so.6: cannot open shared object file". nixLibs puts the gcc C++
# runtime on LD_LIBRARY_PATH so the recruit paint service (Pillow/numpy/scipy) loads.
nixLibs = ["stdenv.cc.cc.lib"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip && /opt/venv/bin/pip install -r requirements.txt",
  "npm i"
]

[start]
cmd = "LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH /opt/venv/bin/uvicorn BackEnd.api.api:app --host 0.0.0.0 --port ${PORT:-8000}"
