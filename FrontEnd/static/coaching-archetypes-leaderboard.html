<!DOCTYPE html>
<html lang="en" class="gob">
<head>
  <link rel="stylesheet" href="/css/gob-tokens.css">
  <link rel="stylesheet" href="/fonts/app-fonts.css">
  <script src="/js/shared/gtm-loader.js"></script>
  <script src="/js/shared/franchiseContext.js"></script>
  <script src="/js/shared/gobNav.js"></script>
  <script src="/js/shared/authGuard.js"></script>
  <script src="/js/shared/pageLoadOverlay.js"></script>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Coaching Archetypes Leaderboard - Geeked Out Basketball</title>
<link rel="stylesheet" href="/css/auth-bar.css">
  <link rel="stylesheet" href="/css/community.css">
  <link rel="stylesheet" href="/css/fonts.css">
</head>
<body class="has-auth-bar has-footer community-page alb-page">
  <!-- First paint: stay behind the shared loader until the data is drawn (the page
       script lifts it), so placeholder values and empty cards are never shown. -->
  <script>
    document.documentElement.classList.add('is-loading');
    if (window.PageLoadOverlay && window.PageLoadOverlay.show) window.PageLoadOverlay.show();
  </script>
  <div id="auth-bar" class="auth-bar"></div>

  <div class="alb">
    <a href="/mode-select.html" class="alb-back" id="alb-back">&larr; Back</a>
    <div class="alb-header-row">
      <h1 class="alb-title">Coaching Archetypes</h1>
      <a href="/coaching-archetypes.html" class="alb-ca-link">See Coaching Archetypes<span class="arrow" aria-hidden="true">&rarr;</span></a>
    </div>
    <div id="alb-grid" class="alb-grid"></div>
  </div>

  <footer id="site-footer" class="site-footer">
    <div class="site-footer-links">
      <a href="/faqs.html">FAQs</a>
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Use</a>
    </div>
  </footer>

  <script src="/js/config/api-config.js"></script>
  <script src="/js/shared/archetypeBadge.js"></script>
  <script>
    (function () {
      var bar = document.getElementById('auth-bar');
      if (bar && !bar.querySelector('.auth-bar-left')) {
        bar.innerHTML = '<div class="auth-bar-left"><a href="/homepage.html" class="logo-link"><img src="/images/geekedout_logo.png" alt="Geeked-Out Basketball logo" class="logo"></a></div><img id="alpha-badge" class="alpha-badge visible" src="/images/alpha_badge_gold.png" alt="Alpha"><div class="auth-bar-right"><a href="https://www.youtube.com/@geeked-outbasketball765" target="_blank" rel="noopener noreferrer" class="nav-icon nav-icon-yt" aria-label="GOB on YouTube"><img src="/images/yt_icon_red_digital.png" alt="" width="24" height="24"></a><a href="https://x.com/geekedoutbball" target="_blank" rel="noopener noreferrer" class="nav-icon" aria-label="GOB on X"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg></a></div>';
      }
      var logoLink = bar ? bar.querySelector('.logo-link') : null;
      if (logoLink) {
        var isLoggedIn = false;
        try { isLoggedIn = !!(localStorage.getItem('auth_token') && localStorage.getItem('auth_user')); } catch (e) {}
        logoLink.href = isLoggedIn ? '/mode-select.html' : '/homepage.html';
      }
    })();

    // Back returns to wherever the coach came from (mode-select, etc.).
    (function () {
      var back = document.getElementById('alb-back');
      if (!back) return;
      back.addEventListener('click', function (e) {
        e.preventDefault();
        var fallback = back.getAttribute('href') || '/mode-select.html';
        if (window.GOBNav) window.GOBNav.back(fallback);
        else window.location.replace(fallback);
      });
    })();

    // Fixed display order (6 rows × 3 cols) per spec.
    var ORDER = [
      'od_balance', 'pure_offense', 'pure_defense',
      'pure_athleticism', 'offensive_athleticism', 'defensive_athleticism',
      'rebounding_king', 'offensive_rebounding', 'defensive_rebounding',
      'mr_fundamentals', 'offensive_fundamentals', 'defensive_fundamentals',
      'pure_discipline', 'cerebral_offense', 'cerebral_defense',
      'the_intimidator', 'outrun_the_competition', 'mr_unconventional'
    ];

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; });
    }

    // First paint: lift the loader once the page holds real data (see is-loading in
    // css/community.css).
    function liftLoading() {
      document.documentElement.classList.remove('is-loading');
      if (window.PageLoadOverlay && window.PageLoadOverlay.hide) window.PageLoadOverlay.hide();
    }

    function render(boards) {
      boards = boards || {};
      var host = document.getElementById('alb-grid');
      host.innerHTML = ORDER.map(function (key) {
        var rows = boards[key] || [];
        var name = window.GOBArchetype ? window.GOBArchetype.nameFor(key) : key;
        var badge = window.GOBArchetype ? window.GOBArchetype.badgeHtml(key, 28) : '';
        var desc = window.GOBArchetype && window.GOBArchetype.descFor ? window.GOBArchetype.descFor(key) : '';
        var body = rows.length
          ? rows.map(function (r) {
              return '<div class="alb-row' + (r.is_current_user ? ' is-current' : '') + '">'
                + '<span class="alb-rank">' + r.rank + '</span>'
                + '<span class="alb-user">' + escapeHtml(r.username) + '</span>'
                + '<span class="alb-pct">' + r.pct + '%</span></div>';
            }).join('')
          : '<div class="alb-empty">No coaches yet.</div>';
        var headTip = desc
          ? '<span class="alb-tip" role="tooltip">' + escapeHtml(desc) + '</span>'
          : '';
        var headAttrs = desc
          ? ' class="alb-card-head has-tip" tabindex="0" aria-label="' + escapeHtml(name + ': ' + desc) + '"'
          : ' class="alb-card-head"';
        return '<div class="alb-card">'
          + '<div' + headAttrs + '><span class="alb-card-badge">' + badge + '</span>'
          + '<span class="alb-card-name">' + escapeHtml(name) + '</span>' + headTip + '</div>'
          + body + '</div>';
      }).join('');
      liftLoading();
    }

    window.GOBArchetype.ensureManifest().then(function () {
      var url = (typeof API_CONFIG !== 'undefined' && API_CONFIG.buildUrl) ? API_CONFIG.buildUrl('/api/leaderboard/by-archetype') : '/api/leaderboard/by-archetype';
      var headers = (typeof API_CONFIG !== 'undefined' && API_CONFIG.getAuthHeaders) ? API_CONFIG.getAuthHeaders() : {};
      fetch(url, { headers: headers })
        .then(function (r) { return r.ok ? r.json() : {}; })
        .then(render)
        .catch(function () { render({}); });
    }).catch(liftLoading);
  </script>
</body>
</html>
