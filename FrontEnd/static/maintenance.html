<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maintenance</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.14);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.72);
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        background: radial-gradient(1200px 600px at 20% 10%, rgba(255, 255, 255, 0.08), transparent 55%),
          radial-gradient(900px 500px at 90% 30%, rgba(255, 255, 255, 0.06), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .wrap {
        width: min(960px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }

      .image {
        width: 100%;
        display: block;
        background: rgba(0, 0, 0, 0.2);
      }

      .content {
        padding: 18px 18px 22px 18px;
      }

      h1 {
        margin: 0 0 8px 0;
        font-size: 20px;
        letter-spacing: 0.2px;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <main class="wrap" role="main" aria-label="Maintenance Mode">
      <img class="image" src="/images/maintenance-image.png" alt="Maintenance" />
      <div class="content">
        <h1>We&rsquo;ll be back soon</h1>
        <p>We&rsquo;re performing maintenance. Please refresh in a few minutes.</p>
      </div>
    </main>
  </body>
</html>
