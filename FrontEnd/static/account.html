<!DOCTYPE html>
<html lang="en" class="gob">
<head>
  <link rel="stylesheet" href="/css/gob-tokens.css">
  <link rel="stylesheet" href="/fonts/app-fonts.css">
  <script src="/js/shared/gtm-loader.js"></script>
  <script src="/js/shared/franchiseContext.js"></script>
  <script src="/js/shared/gobNav.js"></script>
  <script src="/js/shared/authGuard.js"></script>
  <script src="/js/shared/pageLoadOverlay.js"></script>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Account - Geeked Out Basketball</title>
<link rel="stylesheet" href="/css/auth-bar.css">
  <link rel="stylesheet" href="/css/community.css">
  <link rel="stylesheet" href="/css/fonts.css">
</head>
<body class="has-auth-bar has-footer community-page acct-page">
  <!-- First paint: stay behind the shared loader until the data is drawn (the page
       script lifts it), so placeholder values and empty cards are never shown. -->
  <script>
    document.documentElement.classList.add('is-loading');
    if (window.PageLoadOverlay && window.PageLoadOverlay.show) window.PageLoadOverlay.show();
  </script>
  <div id="auth-bar" class="auth-bar"></div>

  <div class="acct">
    <div class="card">
      <div class="acct-identity">
        <div id="acct-avatar" class="acct-avatar" aria-hidden="true"></div>
        <div class="acct-id-text">
          <div class="acct-name-row">
            <span id="acct-name" class="acct-name">Coach</span>
            <span id="acct-badge" class="arch-badge"></span>
          </div>
        </div>
        <span class="acct-status" id="acct-status">Alpha</span>
      </div>
    </div>

    <div class="acct-grid">
      <div class="card gp-card">
        <p class="card-label">Geek Points</p>
        <div class="gp-total"><span id="gp-total">0</span></div>
        <div id="gp-by-team" style="margin-top:14px;"></div>
      </div>
      <div class="card">
        <p class="card-label">Titles</p>
        <div id="titles"></div>
      </div>
    </div>

    <div class="card">
      <p class="card-label">Settings</p>
      <div class="set-row">
        <span class="set-label">In-Game Display</span>
        <div class="seg" aria-label="In-game player display (coming soon)" aria-disabled="true" title="Coming soon">
          <span class="on">Pos</span><span>#</span>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="card-label">Coaching Archetypes</p>
      <div id="arch-board"></div>
    </div>

    <div class="acct-links">
      <a class="acct-link" href="#" id="history-link" aria-disabled="true">Season History<span class="arrow" aria-hidden="true">&rarr;</span></a>
      <a class="acct-link" href="/coaching-archetypes.html">Coaching Archetypes<span class="arrow" aria-hidden="true">&rarr;</span></a>
    </div>
  </div>

  <footer id="site-footer" class="site-footer">
    <div class="site-footer-links">
      <a href="/faqs.html">FAQs</a>
      <a href="/privacy">Privacy Policy</a>
      <a href="/terms">Terms of Use</a>
    </div>
  </footer>

  <script src="/js/config/api-config.js"></script>
  <script src="/js/shared/archetypeBadge.js"></script>
  <script>
    (function () {
      var bar = document.getElementById('auth-bar');
      if (bar && !bar.querySelector('.auth-bar-left')) {
        bar.innerHTML = '<div class="auth-bar-left"><a href="/homepage.html" class="logo-link"><img src="/images/geekedout_logo.png" alt="Geeked-Out Basketball logo" class="logo"></a></div><img id="alpha-badge" class="alpha-badge visible" src="/images/alpha_badge_gold.png" alt="Alpha"><div class="auth-bar-right"><a href="https://www.youtube.com/@geeked-outbasketball765" target="_blank" rel="noopener noreferrer" class="nav-icon nav-icon-yt" aria-label="GOB on YouTube"><img src="/images/yt_icon_red_digital.png" alt="" width="24" height="24"></a><a href="https://x.com/geekedoutbball" target="_blank" rel="noopener noreferrer" class="nav-icon" aria-label="GOB on X"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg></a></div>';
      }
      var logoLink = bar ? bar.querySelector('.logo-link') : null;
      if (logoLink) {
        var isLoggedIn = false;
        try { isLoggedIn = !!(localStorage.getItem('auth_token') && localStorage.getItem('auth_user')); } catch (e) {}
        logoLink.href = isLoggedIn ? '/mode-select.html' : '/homepage.html';
      }
    })();

    var TITLE_LABELS = [
      ['national', 'National'], ['region', 'Region'],
      ['conf_t', 'Conference Tournament'], ['conf_rs', 'Conference (Reg. Season)']
    ];
    function cap(s) { s = String(s || ''); return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function gpRows(me, nameById) {
      nameById = nameById || {};
      if (Array.isArray(me.geek_points_teams) && me.geek_points_teams.length) {
        return me.geek_points_teams.filter(function (r) { return Number(r.points) > 0; })
          .sort(function (a, b) { return Number(b.points) - Number(a.points); });
      }
      var gbt = me.geek_points_by_team || {};
      return Object.keys(gbt).filter(function (k) { return Number(gbt[k]) > 0; })
        .sort(function (a, b) { return Number(gbt[b]) - Number(gbt[a]); })
        .map(function (k) {
          return { team_id: k, display_name: nameById[k] || k, points: Number(gbt[k]) };
        });
    }

    // First paint: lift the loader once the page holds real data (see is-loading in
    // css/community.css).
    function liftLoading() {
      document.documentElement.classList.remove('is-loading');
      if (window.PageLoadOverlay && window.PageLoadOverlay.hide) window.PageLoadOverlay.hide();
    }

    function render(me) {
      me = me || {};
      var name = me.username || (me.email ? me.email.split('@')[0] : 'Coach');
      document.getElementById('acct-name').textContent = name;
      document.getElementById('acct-avatar').textContent = name.charAt(0).toUpperCase();
      document.getElementById('acct-status').textContent = cap(me.subscription) || 'Alpha';

      // badge
      var badgeHost = document.getElementById('acct-badge');
      badgeHost.innerHTML = '';
      var lead = window.GOBArchetype ? window.GOBArchetype.leadFrom(me) : (me.lead_archetype || '');
      if (lead && window.GOBArchetype) {
        var b = window.GOBArchetype.createBadge(lead, 30);
        if (b) badgeHost.appendChild(b);
      }

      // geek points — stored / TB display names, never title-cased from the key
      document.getElementById('gp-total').textContent = Number(me.geek_points || 0).toLocaleString();
      var teams = gpRows(me, me._teamNameById);
      var gpHost = document.getElementById('gp-by-team');
      gpHost.innerHTML = teams.length
        ? teams.map(function (row) {
            return '<div class="gp-team-row"><span class="gp-team-name">' + escapeHtml(row.display_name) + '</span><span class="gp-team-pts">' + Number(row.points).toLocaleString() + '</span></div>';
          }).join('')
        : '<div class="muted-empty">No team points yet.</div>';

      // titles
      var champs = me.championships_total || {};
      document.getElementById('titles').innerHTML = TITLE_LABELS.map(function (t) {
        var n = Number(champs[t[0]] || 0);
        return '<div class="title-row"><span class="title-name">' + t[1] + '</span><span class="title-count' + (n ? '' : ' zero') + '">' + n + '</span></div>';
      }).join('');

      // archetype board: count>0, descending, ranked, percentages
      var arche = me.archetypes || {};
      var total = Number(arche.total || 0);
      var entries = Object.keys(arche).filter(function (k) { return k !== 'total' && Number(arche[k]) > 0; })
        .map(function (k) { return { key: k, count: Number(arche[k]) }; })
        .sort(function (a, b) { return b.count - a.count; });
      var boardHost = document.getElementById('arch-board');
      if (!entries.length || !total) {
        boardHost.innerHTML = '<div class="muted-empty">Play a franchise game to earn your first coaching archetype.</div>';
      } else {
        boardHost.innerHTML = '<div class="arch-board-grid" style="--arch-rows:' + Math.ceil(entries.length / 3) + '">' + entries.map(function (e, i) {
          var pct = Math.round((e.count / total) * 100);
          var nm = window.GOBArchetype ? window.GOBArchetype.nameFor(e.key) : e.key;
          var badge = window.GOBArchetype ? window.GOBArchetype.badgeHtml(e.key, 30) : '';
          return '<div class="arch-cell"><span class="arch-rank">#' + (i + 1) + '</span>'
            + '<span class="arch-badge">' + badge + '</span>'
            + '<span class="arch-meta"><span class="arch-aname">' + nm + '</span> <span class="arch-pct">' + pct + '%</span></span></div>';
        }).join('') + '</div>';
      }
      liftLoading();
    }

    function loadTeamNameMap() {
      var url = (typeof API_CONFIG !== 'undefined' && API_CONFIG.buildUrl) ? API_CONFIG.buildUrl('/teams') : '/teams';
      return fetch(url).then(function (r) { return r.ok ? r.json() : []; }).then(function (rows) {
        var map = {};
        (Array.isArray(rows) ? rows : []).forEach(function (t) {
          var id = t && (t.team_id || t.object_id);
          var name = (t && t.display_name) || (t && t.name);
          if (id && name) map[id] = name;
          if (t && t.object_id && name) map[t.object_id] = name;
        });
        return map;
      }).catch(function () { return {}; });
    }
    function start() {
      window.GOBArchetype.ensureManifest().then(function () {
        var url = (typeof API_CONFIG !== 'undefined' && API_CONFIG.buildUrl) ? API_CONFIG.buildUrl('/api/auth/me') : '/api/auth/me';
        var headers = (typeof API_CONFIG !== 'undefined' && API_CONFIG.getAuthHeaders) ? API_CONFIG.getAuthHeaders() : {};
        Promise.all([
          fetch(url, { headers: headers }).then(function (r) { return r.ok ? r.json() : (window.__gobAuthMeData || {}); }),
          loadTeamNameMap()
        ]).then(function (pair) {
          var me = pair[0] || {};
          me._teamNameById = pair[1] || {};
          render(me);
        }).catch(function () { render(window.__gobAuthMeData || {}); });
      }).catch(liftLoading);
    }
    start();
  </script>
</body>
</html>
