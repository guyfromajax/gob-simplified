<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/shared/gtm-loader.js"></script>
  <script src="/js/shared/authGuard.js"></script>
  <script src="/js/shared/sentryInit.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Player Attributes — Mastering GOB | Geeked Out Basketball</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/auth-bar.css">
  <link rel="stylesheet" href="/css/gob-buttons.css">
  <link rel="stylesheet" href="/css/gob-tutorial.css">
  <style>
  /* ===================== PLAYER ATTRIBUTES LESSON (page-specific) ===================== */

  /* breadcrumb + lesson hero */
  .crumb { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-2); margin-bottom: 14px; }
  .crumb a:hover { color: var(--text); }
  .crumb .sep { color: var(--muted-3); }
  .crumb .here { color: var(--orange); font-weight: 600; }

  .lesson-hero { padding: 4px 4px 0; margin-bottom: 30px; }
  .lesson-hero h1 { font-family: var(--display); font-weight: 400; font-size: clamp(48px, 7vw, 86px); line-height: .92; letter-spacing: .01em; margin: 0 0 14px; color: var(--text); }
  .lesson-hero .intro { font-size: 16px; color: var(--muted); max-width: 64ch; margin: 0; text-wrap: pretty; }
  .lesson-hero .intro strong { color: var(--text); font-weight: 600; }

  /* REFERENCE — category groups of attribute cards */
  .attr-group { margin-bottom: 22px; }
  .ag-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .attr-card { display: flex; gap: 13px; text-align: left; padding: 15px; border-radius: 12px; border: 1px solid var(--panel-border); border-left: 3px solid var(--ac); background: var(--panel-flat); }
  .attr-card--wide { grid-column: 1 / -1; }
  .ac-badge { width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 18px; letter-spacing: .02em; }
  .ac-main { min-width: 0; }
  .ac-name { font-weight: 700; font-size: 14.5px; color: var(--text); display: flex; align-items: center; gap: 7px; }
  .ac-zone { display: block; font-size: 11.5px; color: var(--ac); font-weight: 600; margin-top: 4px; }
  .ac-zone strong { color: var(--text); font-weight: 700; }
  .ac-desc { display: block; font-size: 12.5px; color: var(--muted-2); margin-top: 6px; line-height: 1.45; text-wrap: pretty; }

  /* meters (inside EM / MO cards) */
  .meter-wrap { margin-top: 12px; }
  .meter-cap { font-family: var(--body); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted-3); margin-bottom: 7px; }
  .emotion-meter { display: flex; gap: 6px; }
  .em-step { flex: 1; text-align: center; padding: 8px 4px; border-radius: 9px; background: rgba(255,255,255,0.04); border: 1px solid var(--hair); }
  .em-face { font-size: 22px; display: block; line-height: 1; }
  .em-lbl { display: block; font-size: 9.5px; color: var(--muted-2); margin-top: 5px; letter-spacing: .02em; }
  .mo-meter { display: flex; align-items: center; gap: 10px; }
  .mo-end { font-family: var(--display); font-size: 15px; letter-spacing: .04em; }
  .mo-end.cold { color: #4a90d9; }
  .mo-end.hot { color: #ff6d6d; }
  .mo-track { position: relative; flex: 1; height: 10px; border-radius: 999px; background: linear-gradient(90deg, #4a90d9, #2c3344 48%, #2c3344 52%, #ff6d6d); }
  .mo-zero { position: absolute; left: 50%; top: -18px; transform: translateX(-50%); font-size: 10px; color: var(--muted-2); }
  .mo-needle { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 4px; height: 18px; border-radius: 2px; background: #fff; box-shadow: 0 0 6px rgba(255,255,255,0.6); }

  /* RATING SCALE strip */
  .scale-card { padding: 22px 24px; }
  .scale-bar { display: flex; height: 16px; border-radius: 6px; overflow: hidden; border: 1px solid var(--hair); }
  .scale-bar > span { display: block; }
  .scale-ticks { display: flex; justify-content: space-between; font-family: var(--body); font-size: 11px; color: var(--muted-2); margin-top: 6px; }
  .scale-legend { display: flex; margin-top: 14px; }
  .scale-legend .sl { font-size: 12px; }
  .scale-legend .sl b { display: block; font-family: var(--display); font-size: 17px; letter-spacing: .02em; font-weight: 400; }
  .scale-legend .sl .rng { color: var(--muted-2); }

  /* footer handoff */
  .handoff { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 22px 26px; }
  .handoff .h-l .lbl { font-family: var(--body); font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--orange); }
  .handoff .h-l .nx { font-family: var(--display); font-size: 28px; letter-spacing: .02em; color: var(--text); margin-top: 3px; }
  .handoff .h-actions { display: flex; gap: 12px; flex-wrap: wrap; }

  @media (max-width: 900px) {
    .ag-cards { grid-template-columns: 1fr; }
    .handoff { flex-direction: column; align-items: flex-start; }
  }
  </style>
  <link rel="stylesheet" href="/css/fonts.css">
</head>
<body class="gob-tut has-auth-bar has-footer" data-gob-nav="players">

  <div class="gob-shell">

    <header class="gob-head">
      <button class="gob-back" data-gob-back type="button"><span class="chev">‹</span> Back To Tutorial Home</button>
      <span class="spacer"></span>
    </header>

    <!-- LESSON HERO -->
    <section class="lesson-hero">
      <nav class="crumb" aria-label="Breadcrumb">
        <a href="/tutorial.html">Tutorials</a>
        <span class="sep">›</span>
        <a href="/tutorial.html#cat-players">Players</a>
        <span class="sep">›</span>
        <span class="here">Player Attributes</span>
      </nav>
      <h1>PLAYER ATTRIBUTES</h1>
      <p class="intro">Every player has 14 attributes that determine his unique skill set.</p>
    </section>

    <!-- REFERENCE -->
    <section class="lsec" id="reference">
      <div id="attr-reference"></div>
    </section>

    <!-- RATING SCALE -->
    <section class="lsec">
      <div class="lsec-eyebrow-only">
        <span class="eyebrow"><span class="tick"></span> Attribute Scale</span>
      </div>
      <div class="scale-card panel">
        <div class="scale-bar">
          <span style="background:#ff6d6d;width:40%"></span>
          <span style="background:#ffd700;width:20%"></span>
          <span style="background:#34ec27;width:20%"></span>
          <span style="background:#4a90d9;width:20%"></span>
        </div>
        <div class="scale-ticks"><span>0</span><span>100+</span></div>
        <div class="scale-legend">
          <div class="sl" style="color:#ff6d6d;width:40%"><b>Below Average</b><span class="rng">0 – 40</span></div>
          <div class="sl" style="color:#ffd700;width:20%"><b>Average</b><span class="rng">41 – 60</span></div>
          <div class="sl" style="color:#34ec27;width:20%"><b>Solid</b><span class="rng">61 – 80</span></div>
          <div class="sl" style="color:#4a90d9;width:20%"><b>Elite</b><span class="rng">81 +</span></div>
        </div>
      </div>
    </section>

    <!-- HANDOFF -->
    <section class="handoff panel">
      <div class="h-l">
        <div class="lbl">Next up</div>
        <div class="nx">Training</div>
      </div>
      <div class="h-actions">
        <a class="gob-btn gob-btn--action gob-btn--lg" href="/tutorial-training.html">Start lesson</a>
        <a class="gob-btn gob-btn--ghost gob-btn--lg" href="/tutorial.html#topics">All topics</a>
      </div>
    </section>

  </div>

  <!-- BOTTOM NAV (intra-tutorial navigation) -->
  <nav class="gob-bottomnav" aria-label="Tutorial sections">
    <div class="navwrap" id="bottomnav"></div>
  </nav>

  <!-- TOAST -->
  <div class="gob-toast" id="toast" role="status" aria-live="polite">
    <span class="ti">✓</span>
    <span><span class="tt"></span><br><span class="ts"></span></span>
  </div>

  <!-- global auth-bar + footer (injected by authBarInit) -->
  <script src="/js/config/api-config.js"></script>
  <script src="/js/shared/archetypeBadge.js"></script>
  <script src="/js/shared/authBarInit.js"></script>
  <!-- tutorial behavior + lesson data -->
  <script src="/js/shared/gobTutorialNav.js"></script>
  <script src="/js/shared/gobPlayerAttributes.js"></script>
</body>
