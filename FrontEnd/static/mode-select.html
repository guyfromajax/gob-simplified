<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/shared/authGuard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Game Mode</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mode-select.css">
</head>
<body>
  <!-- Auth Status Bar -->
  <div id="auth-bar" class="auth-bar">
    <div class="auth-bar-spacer"></div>
    <div id="alpha-badge" class="alpha-badge">ALPHA</div>
    <div class="auth-bar-right">
      <div id="auth-logged-out" class="auth-status">
        <a href="/login.html" class="auth-link">Log In</a>
        <span class="auth-divider">|</span>
        <a href="/signup.html" class="auth-link">Sign Up</a>
      </div>
      <div id="auth-logged-in" class="auth-status" style="display: none;">
        <span id="auth-user-email" class="auth-email"></span>
        <button id="logout-btn" class="auth-logout-btn">Log Out</button>
      </div>
    </div>
  </div>
  
  <h1 id="page-title">CHOOSE YOUR GAME MODE</h1>
  
  <!-- Alpha Disclaimer (shown when IS_ALPHA=true) -->
  <div id="alpha-disclaimer" class="alpha-disclaimer">
    <div class="alpha-disclaimer-title">ALPHA RELEASE</div>
    <p class="alpha-disclaimer-text">
      <strong>Data may be wiped without notice.</strong> Gameplay balance and features may change.
      Thank you for helping us test!
    </p>
  </div>
  <div class="mode-wrapper">
  <!-- ⏸️ TABLED: Resume Last Game Section - Exact game state restoration -->
  <!-- TODO: Revisit after Phase 1.3+ and site go-live priorities complete -->
  <!-- See: docs/To Do/resume_last_game_exact_state.md -->

  <div id="resume-game-section" class="resume-game-section" style="display: none;">
    <h2>Continue Your Game</h2>
    <div class="resume-game-card">
      <div class="resume-game-info">
        <div class="resume-teams" id="resume-teams"></div>
        <div class="resume-score" id="resume-score"></div>
        <div class="resume-quarter" id="resume-quarter"></div>
      </div>
      <button id="resume-game-btn" class="resume-button">Resume Game</button>
    </div>
  </div>
  -->
  <div class="mode-container">
    <div class="mode-card">
      <h2>Scrimmage</h2>
      <button id="scrimmage-btn" class="play-button">PLAY NOW</button>
    </div>
    <div class="mode-card">
      <h2>Tournament</h2>
      <button id="tournament-btn" class="play-button">PLAY NOW</button>
    </div>
    <div class="mode-card">
      <h2>Franchise</h2>
      <button id="franchise-btn" class="play-button">PLAY NOW</button>
    </div>
  </div>
  <h2 id="scout-title">SCOUT TEAMS</h2>
  <div id="team-grid">
    <button class="team-button" data-team="Bentley-Truman">
      <img src="/images/homepage-logos/Bentley-Truman.png" alt="Bentley-Truman logo">
      <div class="team-tagline">Top-Shelf Talent</div>
    </button>
    <button class="team-button" data-team="Lancaster">
      <img src="/images/homepage-logos/Lancaster.png" alt="Lancaster logo">
      <div class="team-tagline">Muscle & Defense</div>
    </button>
    <button class="team-button" data-team="Four Corners">
      <img src="/images/homepage-logos/Four Corners.png" alt="Four Corners logo">
      <div class="team-tagline">Hustle & Attitude</div>
    </button>
    <button class="team-button" data-team="Ocean City">
      <img src="/images/homepage-logos/Ocean City.png" alt="Ocean City logo">
      <div class="team-tagline">Sharpshooters Galore</div>
    </button>
    <button class="team-button" data-team="Morristown">
      <img src="/images/homepage-logos/Morristown.png" alt="Morristown logo">
      <div class="team-tagline">Perfectly Balanced</div>
    </button>
    <button class="team-button" data-team="Little York">
      <img src="/images/homepage-logos/Little York.png" alt="Little York logo">
      <div class="team-tagline">Wicked Smart</div>
    </button>
    <button class="team-button" data-team="Xavien">
      <img src="/images/homepage-logos/Xavien.png" alt="Xavien logo">
      <div class="team-tagline">Youthful Exuberance</div>
    </button>
    <button class="team-button" data-team="South Lancaster">
      <img src="/images/homepage-logos/South Lancaster.png" alt="South Lancaster logo">
      <div class="team-tagline">Us vs The World</div>
    </button>
  </div>
  </div>
  <script src="/js/config/api-config.js"></script>
  <script src="./mode-select.js"></script>
</body>
</html>
