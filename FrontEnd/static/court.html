<!DOCTYPE html>
<html lang="en">
<head>
    <!-- <link rel="icon" type="image/x-icon" href="./images/favicon.ico" /> -->
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico" />
  <meta charset="UTF-8" />
  <title>GOB Court</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    :root {
      --scoreboard-height: 80px;
      --sidebar-border: 1px solid #444;
      --sidebar-bg: #111;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      font-family: 'Bebas Neue', sans-serif;
    }

    #scoreboard {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--scoreboard-height);
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      box-sizing: border-box;
      z-index: 1000;
    }

    #scoreboard .side {
      display: flex;
      align-items: center;
      height: 100%;
      gap: 10px;
    }

    #scoreboard .side.home {
      justify-content: flex-start;
    }

    #scoreboard .side.away {
      justify-content: flex-start;
      flex-direction: row-reverse;
    }

    #scoreboard .logo-container {
      height: 100%;
      width: var(--scoreboard-height);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #scoreboard img.team-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #scoreboard .score {
      font-size: 48px;
      line-height: 1;
      flex: 0 0 60px;
      text-align: center;
    }

    #scoreboard .tol {
      font-size: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #scoreboard .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      margin: 0 40px;
    }

    #scoreboard .center .clock {
      font-size: 48px;
      line-height: 1;
    }

    #scoreboard .center .quarter {
      font-size: 24px;
      line-height: 1;
    }

    #main-container {
      display: flex;
      width: 100%;
      height: calc(100vh - var(--scoreboard-height));
      margin-top: var(--scoreboard-height);
    }

    #phaser-container {
      flex: 1;
      position: relative;
    }

    #stats-sidebar {
      width: 260px;
      background: #222;
      color: #fff;
      box-sizing: border-box;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .stats-box {
      width: 100%;
    }

    .stats-box table {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
    }

    .stats-box th,
    .stats-box td {
      text-align: center;
      padding: 2px;
    }

    #text-scroll-panel {
      height: 35%;
      overflow-y: auto;
      border: var(--sidebar-border);
      background: var(--sidebar-bg);
      padding: 4px;
      scroll-behavior: smooth;
    }

    #text-scroll {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .turn-line {
      margin-bottom: var(--line-spacing, 1em);
    }

    .controls {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #pause-btn,
    #skip-btn {
      background-color: #ff6200;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Bebas Neue', sans-serif;
    }

    #skip-btn {
      background-color: #007bff;
    }

    .play-button,
    .back-button {
      background-color: #ff6200;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
      font-family: 'Bebas Neue', sans-serif;
    }

    .sim-full-game-button,
    .sim-to-fourth-button {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
      font-family: 'Bebas Neue', sans-serif;
    }

    .result-popup {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .popup-content {
      background: #222;
      color: #fff;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div style="background: red; color: white; padding: 10px; text-align: center; font-size: 20px; position: fixed; top: 0; left: 0; z-index: 9999;">
    🚨 TEST: If you see this red box, the HTML file is being served correctly!
  </div>
  <div id="scoreboard">
    <div class="side home">
      <div class="logo-container">
        <img id="home-logo" class="team-logo" alt="home logo" />
      </div>
      <div id="home-score" class="score">0</div>
      <div class="tol home">
        <div>TOL: 3</div>
        <div id="home-fouls">F: 0</div>
      </div>
    </div>
    <div class="center">
      <div id="game-clock" class="clock">8:00</div>
      <div id="quarter" class="quarter">Q:1</div>
    </div>
    <div class="side away">
      <div class="logo-container">
        <img id="away-logo" class="team-logo" alt="away logo" />
      </div>
      <div id="away-score" class="score">0</div>
      <div class="tol away">
        <div>TOL: 3</div>
        <div id="away-fouls">F: 0</div>
      </div>
    </div>
  </div>
  <div id="main-container">
    <div id="phaser-container">
      <button class="play-button">Play Quarter</button>
      <button class="sim-full-game-button">Sim Full Game</button>
      <button class="sim-to-fourth-button">Sim To 4th Quarter</button>
    </div>
    <div id="stats-sidebar">
      <div class="stats-box" id="home-stats-box">
        <table>
          <thead>
            <tr><th colspan="4">Home Team</th></tr>
            <tr><th>Name</th><th>PTS</th><th>REB</th><th>AST</th></tr>
          </thead>
          <tbody id="home-stats-body"></tbody>
        </table>
      </div>
      <div class="stats-box" id="away-stats-box">
        <table>
          <thead>
            <tr><th colspan="4">Away Team</th></tr>
            <tr><th>Name</th><th>PTS</th><th>REB</th><th>AST</th></tr>
          </thead>
          <tbody id="away-stats-body"></tbody>
        </table>
      </div>
      <div id="text-scroll-panel">
        <div id="text-scroll"></div>
      </div>
      <div class="controls">
        <button id="pause-btn">Pause</button>
        <button id="skip-btn">Skip To End</button>
      </div>
    </div>
  </div>

</body>
</html>
