<!DOCTYPE html>
<html lang="en">
<head>
    <!-- <link rel="icon" type="image/x-icon" href="./images/favicon.ico" /> -->
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico" />
  <meta charset="UTF-8" />
  <title>GOB Court</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    :root {
      --scoreboard-height: 80px;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      font-family: 'Bebas Neue', sans-serif;
    }

    #scoreboard {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--scoreboard-height);
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      box-sizing: border-box;
      z-index: 1000;
    }

    #scoreboard .side {
      display: flex;
      align-items: center;
      height: 100%;
      gap: 10px;
    }

    #scoreboard .side.home {
      justify-content: flex-start;
    }

    #scoreboard .side.away {
      justify-content: flex-start;
      flex-direction: row-reverse;
    }

    #scoreboard .logo-container {
      height: 100%;
      width: var(--scoreboard-height);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #scoreboard img.team-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    #scoreboard .score {
      font-size: 48px;
      line-height: 1;
      flex: 0 0 60px;
      text-align: center;
    }

    #scoreboard .tol {
      font-size: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #scoreboard .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      margin: 0 40px;
    }

    #scoreboard .center .clock {
      font-size: 48px;
      line-height: 1;
    }

    #scoreboard .center .quarter {
      font-size: 24px;
      line-height: 1;
    }

    #phaser-container {
      width: 100%;
      height: calc(100vh - var(--scoreboard-height));
      margin-top: var(--scoreboard-height);
      position: relative;
    }

    .play-button,
    .back-button {
      background-color: #ff6200;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
      font-family: 'Bebas Neue', sans-serif;
    }

    .results-button {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
      font-family: 'Bebas Neue', sans-serif;
    }

    .result-popup {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .popup-content {
      background: #222;
      color: #fff;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="scoreboard">
    <div class="side home">
      <div class="logo-container">
        <img id="home-logo" class="team-logo" alt="home logo" />
      </div>
      <div id="home-score" class="score">0</div>
      <div class="tol home">
        <div>TOL: 3</div>
        <div id="home-fouls">F: 0</div>
      </div>
    </div>
    <div class="center">
      <div id="game-clock" class="clock">8:00</div>
      <div id="quarter" class="quarter">Q:1</div>
    </div>
    <div class="side away">
      <div class="logo-container">
        <img id="away-logo" class="team-logo" alt="away logo" />
      </div>
      <div id="away-score" class="score">0</div>
      <div class="tol away">
        <div>TOL: 3</div>
        <div id="away-fouls">F: 0</div>
      </div>
    </div>
  </div>
  <div id="phaser-container">
    <button class="play-button">Play Game</button>
    <button class="results-button">See Results</button>
  </div>

  <!-- <script type="module" src="./js/phaser/bootGame.js"></script> -->
  <script type="module" src="/static/js/phaser/bootGame.js"></script>

</body>
</html>
