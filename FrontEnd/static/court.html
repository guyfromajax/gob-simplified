<!DOCTYPE html>
<html lang="en">
<head>
    <!-- <link rel="icon" type="image/x-icon" href="./images/favicon.ico" /> -->
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico" />
  <meta charset="UTF-8" />
  <title>GOB Court</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
    }

    #phaser-container {
      width: 100%;
      height: 100vh;
      position: relative;
    }

    .play-button,
    .back-button {
      background-color: #ff6200;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }

    .results-button {
      background-color: #007bff;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
    }

    .result-popup {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .popup-content {
      background: #222;
      color: #fff;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="phaser-container">
    <button class="play-button">Play Game</button>
    <button class="results-button">See Results</button>
  </div>

  <!-- <script type="module" src="./js/phaser/bootGame.js"></script> -->
  <script type="module" src="/static/js/phaser/bootGame.js"></script>

</body>
</html>
