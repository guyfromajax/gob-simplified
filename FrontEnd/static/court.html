<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico" />
  <meta charset="UTF-8" />
  <title>GOB Court</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
  <style>
    :root {
      --scoreboard-height: 100px;
      --player-stats-width: 280px;
      --pbp-height: 120px;
      --court-bg: #1e1e1e;
      --side-padding: 10px;
      --scoreboard-gap: 20px;
      --home-vibrant-color: #ff6200;
      --away-vibrant-color: #ff6200;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Bebas Neue', sans-serif;
      color: #fff;
    }

    /* ==================== SCOREBOARD TOP BAR ==================== */
    #scoreboard {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--scoreboard-height);
      background: #000;
      color: #fff;
      display: grid;
      grid-template-columns: 
        var(--side-padding)
        auto
        var(--scoreboard-gap)
        70px
        var(--scoreboard-gap)
        60px
        var(--scoreboard-gap)
        auto
        1fr
        auto
        1fr
        auto
        var(--scoreboard-gap)
        60px
        var(--scoreboard-gap)
        70px
        var(--scoreboard-gap)
        auto
        var(--side-padding);
      align-items: center;
      z-index: 1000;
      border-bottom: 2px solid var(--home-vibrant-color);
    }

    /* Grid layout breakdown:
       1. Left padding
       2. Away logo (auto width, fills height)
       3. Gap (20px)
       4. Away score (70px)
       5. Gap (20px)
       6. Away TOL/F (60px)
       7. Gap (20px)
       8. Away/Defensive Playcall (auto width)
       9. Flex space
       10. Center (clock/quarter)
       11. Flex space
       12. Home/Offensive Playcall (auto width)
       13. Gap (20px)
       14. Home TOL/F (60px)
       15. Gap (20px)
       16. Home score (70px)
       17. Gap (20px)
       18. Home logo (auto width, fills height)
       19. Right padding
    */

    /* Away Logo - Grid column 2 */
    #away-logo-container {
      grid-column: 2;
      height: 90px;
      width: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Away Score - Grid column 4 */
    #away-score {
      grid-column: 4;
      font-size: 56px;
      line-height: 1;
      text-align: center;
      font-weight: bold;
    }

    /* Away TOL/F - Grid column 6 */
    .tol-fouls.away {
      grid-column: 6;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 20px;
      line-height: 1.1;
      align-items: flex-start;
    }

    /* Defensive Playcall (away side) - Grid column 8 */
    #defensive-playcall {
      grid-column: 8;
      font-size: 28px;
      line-height: 1;
      color: #fff;
      text-align: center;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      min-width: 120px;
      font-weight: bold;
    }

    /* Center (Clock/Quarter) - Grid column 10 */
    #scoreboard .center {
      grid-column: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 0 20px;
    }

    /* Offensive Playcall (home side) - Grid column 12 */
    #offensive-playcall {
      grid-column: 12;
      font-size: 28px;
      line-height: 1;
      color: #fff;
      text-align: center;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      min-width: 120px;
      font-weight: bold;
    }

    #scoreboard .center .clock {
      font-size: 52px;
      line-height: 1;
      font-weight: bold;
      white-space: nowrap;
    }

    #scoreboard .center .quarter {
      font-size: 24px;
      line-height: 1;
      color: var(--home-vibrant-color);
    }

    /* Home TOL/F - Grid column 14 */
    .tol-fouls.home {
      grid-column: 14;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 20px;
      line-height: 1.1;
      align-items: flex-end;
    }

    /* Home Score - Grid column 16 */
    #home-score {
      grid-column: 16;
      font-size: 56px;
      line-height: 1;
      text-align: center;
      font-weight: bold;
    }

    /* Home Logo - Grid column 18 */
    #home-logo-container {
      grid-column: 18;
      height: 90px;
      width: auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #scoreboard img.team-logo {
      height: 100%;
      width: auto;
      object-fit: contain;
    }

    /* ==================== MAIN CONTAINER ==================== */
    #main-container {
      display: flex;
      width: 100%;
      height: calc(100vh - var(--scoreboard-height) - var(--pbp-height));
      margin-top: var(--scoreboard-height);
      padding: 0 var(--side-padding);
      gap: 0;
      overflow: hidden;
      box-sizing: border-box;
    }

    /* ==================== PLAYER STATS PANELS (LEFT & RIGHT) ==================== */
    .player-stats-panel {
      width: var(--player-stats-width);
      min-width: var(--player-stats-width);
      max-width: var(--player-stats-width);
      flex-shrink: 0;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      border: 1px solid #333;
      overflow: hidden;
    }

    .player-stats-panel.away {
      border-right: 2px solid var(--home-vibrant-color);
    }

    .player-stats-panel.home {
      border-left: 2px solid var(--home-vibrant-color);
    }

    /* Player Box Score Section */
    .player-box-score {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      border-bottom: 1px solid #333;
    }

    .player-box-score h3 {
      font-size: 22px;
      margin-bottom: 10px;
      text-align: center;
      border-bottom: 1px solid #444;
      padding-bottom: 6px;
    }
    
    .player-stats-panel.home .player-box-score h3 {
      color: var(--home-vibrant-color);
    }
    
    .player-stats-panel.away .player-box-score h3 {
      color: #fff;
      text-shadow: 
        -1px -1px 0 var(--away-vibrant-color),
        1px -1px 0 var(--away-vibrant-color),
        -1px 1px 0 var(--away-vibrant-color),
        1px 1px 0 var(--away-vibrant-color),
        -2px 0 0 var(--away-vibrant-color),
        2px 0 0 var(--away-vibrant-color),
        0 -2px 0 var(--away-vibrant-color),
        0 2px 0 var(--away-vibrant-color);
    }

    .player-box-score table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    .player-box-score th {
      background: #222;
      padding: 6px 4px;
      text-align: center;
      font-size: 14px;
      color: #aaa;
      border-bottom: 1px solid #444;
    }

    .player-box-score td {
      text-align: center;
      padding: 5px 4px;
      border-bottom: 1px solid #2a2a2a;
    }

    .player-box-score td:first-child {
      text-align: left;
      padding-left: 8px;
    }

    .player-box-score tbody tr:hover {
      background: #252525;
    }

    /* Team Box Score Section (Placeholder) */
    .team-box-score {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #151515;
      border-top: 1px solid #444;
      color: #888;
      font-size: 18px;
    }

    /* ==================== COURT CONTAINER ==================== */
    #phaser-container {
      flex: 1;
      position: relative;
      background: var(--court-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0;
      overflow: hidden;
      min-width: 0;
      max-width: 100%;
    }

    /* Ensure Phaser canvas respects container bounds */
    #phaser-container canvas {
      max-width: 100% !important;
      max-height: 100% !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain;
    }

    /* Pre-game button container */
    .pre-game-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border: 6px solid #c0c0c0;
      border-radius: 12px;
      padding: 40px 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .pre-game-container.hidden {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Game control buttons */
    .play-button,
    .sim-full-game-button,
    .sim-to-fourth-button,
    .back-button {
      background-color: #ff6200;
      color: #fff;
      border: none;
      padding: 14px 40px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      transition: background-color 0.2s, transform 0.1s;
      min-width: 240px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    .play-button:hover,
    .back-button:hover {
      background-color: #ff7a1a;
      transform: translateY(-2px);
    }

    .sim-full-game-button,
    .sim-to-fourth-button {
      background-color: #007bff;
    }

    .sim-full-game-button:hover,
    .sim-to-fourth-button:hover {
      background-color: #0056b3;
      transform: translateY(-2px);
    }

    .play-button:disabled,
    .sim-full-game-button:disabled,
    .sim-to-fourth-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .play-button:disabled:hover,
    .sim-full-game-button:disabled:hover,
    .sim-to-fourth-button:disabled:hover {
      transform: none;
    }

    /* ==================== PLAY-BY-PLAY TEXT SCROLL ==================== */
    #pbp-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: calc(var(--player-stats-width) + var(--side-padding) * 2);
      height: var(--pbp-height);
      background: #0a0a0a;
      border-top: 2px solid var(--home-vibrant-color);
      display: flex;
      flex-direction: column;
      z-index: 1000;
    }

    #pbp-header {
      background: #1a1a1a;
      padding: 4px 20px;
      font-size: 18px;
      color: var(--home-vibrant-color);
      border-bottom: 1px solid #333;
      line-height: 1.2;
    }

    #text-scroll-panel {
      flex: 1;
      overflow-y: auto;
      padding: 8px 20px;
      scroll-behavior: smooth;
    }

    #text-scroll {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .turn-line {
      font-size: 16px;
      line-height: 1.3;
      color: #ddd;
      margin-bottom: 4px;
    }

    /* Scrollbar styling */
    #text-scroll-panel::-webkit-scrollbar {
      width: 8px;
    }

    #text-scroll-panel::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    #text-scroll-panel::-webkit-scrollbar-thumb {
      background: #ff6200;
      border-radius: 4px;
    }

    #text-scroll-panel::-webkit-scrollbar-thumb:hover {
      background: #ff7a1a;
    }

    /* ==================== RESULT POPUP ==================== */
    .result-popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .popup-content {
      background: #222;
      color: #fff;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      border: 2px solid var(--home-vibrant-color);
      min-width: 400px;
    }

    .popup-content h2 {
      font-size: 36px;
      margin-bottom: 20px;
      color: var(--home-vibrant-color);
    }

    .popup-content p {
      font-size: 24px;
      margin: 10px 0;
    }

    /* ==================== GAME ANNOUNCEMENTS ==================== */
    .game-announcement {
      position: fixed;
      top: calc(var(--scoreboard-height) + 10px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 22px;
      font-weight: bold;
      z-index: 2000;
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-50%) scale(0.5);
      transition: none;
    }
    
    /* Home team announcements - use home vibrant color */
    .game-announcement.home-team {
      color: var(--home-vibrant-color);
      text-shadow: 
        -2px -2px 4px rgba(0, 0, 0, 0.9),
        2px -2px 4px rgba(0, 0, 0, 0.9),
        -2px 2px 4px rgba(0, 0, 0, 0.9),
        2px 2px 4px rgba(0, 0, 0, 0.9);
    }
    
    /* Away team announcements - white with away color outline (like Away Players heading) */
    .game-announcement.away-team {
      color: #fff;
      text-shadow: 
        -1px -1px 0 var(--away-vibrant-color),
        1px -1px 0 var(--away-vibrant-color),
        -1px 1px 0 var(--away-vibrant-color),
        1px 1px 0 var(--away-vibrant-color),
        -2px 0 0 var(--away-vibrant-color),
        2px 0 0 var(--away-vibrant-color),
        0 -2px 0 var(--away-vibrant-color),
        0 2px 0 var(--away-vibrant-color),
        -2px -2px 2px rgba(0, 0, 0, 0.9),
        2px -2px 2px rgba(0, 0, 0, 0.9),
        -2px 2px 2px rgba(0, 0, 0, 0.9),
        2px 2px 2px rgba(0, 0, 0, 0.9);
    }
    
    /* Defense team announcements - use away team style (since defense is usually away in context) */
    .game-announcement.defense-team {
      color: #fff;
      text-shadow: 
        -1px -1px 0 var(--away-vibrant-color),
        1px -1px 0 var(--away-vibrant-color),
        -1px 1px 0 var(--away-vibrant-color),
        1px 1px 0 var(--away-vibrant-color),
        -2px 0 0 var(--away-vibrant-color),
        2px 0 0 var(--away-vibrant-color),
        0 -2px 0 var(--away-vibrant-color),
        0 2px 0 var(--away-vibrant-color),
        -2px -2px 2px rgba(0, 0, 0, 0.9),
        2px -2px 2px rgba(0, 0, 0, 0.9),
        -2px 2px 2px rgba(0, 0, 0, 0.9),
        2px 2px 2px rgba(0, 0, 0, 0.9);
    }
    
    /* Neutral announcements - gold color (for non-team specific events) */
    .game-announcement.neutral {
      color: #FFD700;
      text-shadow: 
        -2px -2px 4px rgba(0, 0, 0, 0.9),
        2px -2px 4px rgba(0, 0, 0, 0.9),
        -2px 2px 4px rgba(0, 0, 0, 0.9),
        2px 2px 4px rgba(0, 0, 0, 0.9),
        0 0 12px rgba(255, 215, 0, 0.6);
    }

    .game-announcement.active {
      animation: announcement-pop 1000ms ease-out forwards;
    }

    @keyframes announcement-pop {
      0% {
        top: calc(var(--scoreboard-height) + 10px);
        opacity: 0;
        transform: translateX(-50%) scale(0.5);
      }
      30% {
        top: 50%;
        opacity: 1;
        transform: translateX(-50%) translateY(-50%) scale(1.2);
      }
      60% {
        top: 50%;
        opacity: 1;
        transform: translateX(-50%) translateY(-50%) scale(1);
      }
      100% {
        top: 50%;
        opacity: 0;
        transform: translateX(-50%) translateY(-50%) scale(0.8);
      }
    }

    /* ==================== PAUSE/SKIP CONTROLS ==================== */
    .game-controls {
      position: fixed;
      bottom: 0;
      right: var(--side-padding);
      width: var(--player-stats-width);
      height: var(--pbp-height);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      background: #0a0a0a;
      border-top: 2px solid var(--home-vibrant-color);
      border-left: 1px solid #333;
      z-index: 1100;
    }

    #pause-btn,
    #skip-btn {
      background-color: #ff6200;
      color: #fff;
      border: none;
      padding: 12px 0;
      width: 90%;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      transition: background-color 0.2s;
    }

    #skip-btn {
      background-color: #007bff;
    }

    #pause-btn:hover {
      background-color: #ff7a1a;
    }

    #skip-btn:hover {
      background-color: #0056b3;
    }

    #pause-btn:disabled,
    #skip-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <!-- ==================== SCOREBOARD TOP BAR ==================== -->
  <div id="scoreboard">
    <!-- Away Logo - Grid column 2 -->
    <div id="away-logo-container">
      <img id="away-logo" class="team-logo" alt="away logo" />
    </div>
    
    <!-- Away Score - Grid column 4 -->
    <div id="away-score">0</div>
    
    <!-- Away TOL/F - Grid column 6 -->
    <div class="tol-fouls away">
      <div id="away-tol">TOL: 3</div>
      <div id="away-fouls">F: 0</div>
    </div>
    
    <!-- Defensive Playcall - Grid column 8 -->
    <div id="defensive-playcall">-</div>
    
    <!-- Center Clock/Quarter - Grid column 10 -->
    <div class="center">
      <div id="game-clock" class="clock">8:00</div>
      <div id="quarter" class="quarter">Q1</div>
    </div>
    
    <!-- Offensive Playcall - Grid column 12 -->
    <div id="offensive-playcall">-</div>
    
    <!-- Home TOL/F - Grid column 14 -->
    <div class="tol-fouls home">
      <div id="home-tol">TOL: 3</div>
      <div id="home-fouls">F: 0</div>
    </div>
    
    <!-- Home Score - Grid column 12 -->
    <div id="home-score">0</div>
    
    <!-- Home Logo - Grid column 14 -->
    <div id="home-logo-container">
      <img id="home-logo" class="team-logo" alt="home logo" />
    </div>
  </div>

  <!-- ==================== MAIN CONTAINER ==================== -->
  <div id="main-container">
    <!-- AWAY PLAYER STATS PANEL (LEFT) -->
    <div class="player-stats-panel away">
      <div class="player-box-score">
        <h3>Away Players</h3>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>PTS</th>
              <th>REB</th>
              <th>AST</th>
            </tr>
          </thead>
          <tbody id="away-stats-body"></tbody>
        </table>
      </div>
      <div class="team-box-score">
        Team Stats
      </div>
    </div>

    <!-- COURT CONTAINER (CENTER) -->
    <div id="phaser-container">
      <div class="pre-game-container">
        <button class="play-button">Play Quarter</button>
        <button class="sim-full-game-button">Sim Full Game</button>
        <button class="sim-to-fourth-button">Sim To 4th Quarter</button>
      </div>
    </div>

    <!-- HOME PLAYER STATS PANEL (RIGHT) -->
    <div class="player-stats-panel home">
      <div class="player-box-score">
        <h3>Home Players</h3>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>PTS</th>
              <th>REB</th>
              <th>AST</th>
            </tr>
          </thead>
          <tbody id="home-stats-body"></tbody>
        </table>
      </div>
      <div class="team-box-score">
        Team Stats
      </div>
    </div>
  </div>

  <!-- ==================== PLAY-BY-PLAY SCROLL (BOTTOM) ==================== -->
  <div id="pbp-container">
    <div id="pbp-header">Play-by-Play</div>
    <div id="text-scroll-panel">
      <div id="text-scroll"></div>
    </div>
  </div>

  <!-- ==================== GAME CONTROLS ==================== -->
  <div class="game-controls">
    <button id="pause-btn">Pause</button>
    <button id="skip-btn">Skip To End</button>
  </div>

  <!-- ==================== SCRIPTS ==================== -->
  <script>
    console.log('🚨 HTML: Basic JavaScript is working!');
    console.log('🚨 HTML: About to load bootGame.js');
  </script>
  <script type="module">
    // Apply vibrant colors based on teams in URL
    import { applyVibrantColors } from '/static/js/phaser/utils/vibrantColors.js';
    
    const urlParams = new URLSearchParams(window.location.search);
    const homeTeam = urlParams.get('home');
    const awayTeam = urlParams.get('away');
    
    if (homeTeam && awayTeam) {
      applyVibrantColors(homeTeam, awayTeam);
    } else {
      console.warn('⚠️ No teams found in URL, using default vibrant colors');
    }
  </script>
  <script type="module" src="/static/js/phaser/bootGame.js"></script>
  <script>
    console.log('🚨 HTML: bootGame.js should be loaded now');
  </script>

</body>
</html>
