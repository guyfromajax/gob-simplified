<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Tag Manager (production only) -->
  <script src="/js/shared/gtm-loader.js"></script>
  <!-- End Google Tag Manager -->
  <script src="/js/shared/authGuard.js"></script>
  <script src="/js/shared/sentryInit.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Play Details - GOB</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 10px;
    }

    .play-name {
      font-size: 2.5rem;
      color: #FFD700;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
      margin-bottom: 5px;
    }

    .play-type {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.8);
      opacity: 0.8;
    }

    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background: #4a90e2;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s;
    }

    .back-button:hover {
      background: #357abd;
    }

    .content-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-top: 20px;
      min-height: calc(100vh - 200px);
    }

    .left-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: center;
    }

    .info-container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(255, 215, 0, 0.2);
      min-height: 100px;
    }

    .info-container h3 {
      color: #FFD700;
      margin-bottom: 10px;
      font-size: 1.1rem;
    }

    .info-container p {
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.6;
    }

    .right-column {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .court-container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 15px;
      border: 1px solid rgba(255, 215, 0, 0.2);
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 500px; /* Ensure container has minimum height */
    }

    .court-visualization {
      position: relative;
      max-width: 100%;
      width: 100%;
      min-height: 400px; /* Ensure visualization has minimum height */
    }

    .court-image {
      width: 100%;
      height: auto;
      border-radius: 8px;
      opacity: 0.8;
      display: block;
    }

    .player-icons-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .player-icon {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4a90e2, #357abd);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: left 0.5s ease, top 0.5s ease, background 0.3s ease;
      z-index: 10;
    }

    .ball-icon {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #FFD700;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      z-index: 20;
      transition: left 0.5s ease, top 0.5s ease;
    }

    .ball-icon.shooting {
      transition: none; /* Disable transition during shot animation */
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: rgba(255, 255, 255, 0.7);
    }

    .pause-resume-btn {
      margin-top: 15px;
      padding: 10px 24px;
      background: linear-gradient(135deg, #4a90e2, #357abd);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .pause-resume-btn:hover {
      background: linear-gradient(135deg, #357abd, #2a5a8a);
      transform: translateY(-1px);
    }

    .pause-resume-btn:active {
      transform: translateY(0);
    }

    .pause-resume-btn.paused {
      background: linear-gradient(135deg, #4CAF50, #45a049);
    }

    .pause-resume-btn.paused:hover {
      background: linear-gradient(135deg, #45a049, #3d8b40);
    }

    @media (max-width: 1024px) {
      .content-container {
        grid-template-columns: 1fr;
      }
      
      .right-column {
        order: -1;
      }
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K69GQK3D"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <button class="back-button" onclick="goBack()">← Back</button>
  
  <div class="container">
    <div class="header">
      <h1 class="play-name" id="play-name">Loading...</h1>
      <p class="play-type" id="play-type"></p>
    </div>

    <div class="content-container">
      <div class="left-column">
        <div class="info-container">
          <h3>Play Description</h3>
          <p>Copy Goes Here</p>
        </div>
        <div class="info-container">
          <h3>Key Concepts</h3>
          <p>Copy Goes Here</p>
        </div>
        <div class="info-container">
          <h3>Usage Tips</h3>
          <p>Copy Goes Here</p>
        </div>
      </div>

      <div class="right-column">
        <div class="court-container">
          <div class="court-visualization" id="court-visualization">
            <img id="court-image" src="/images/teams/general/general_court.jpg" alt="Basketball Court" class="court-image">
            <div id="player-icons-container" class="player-icons-container"></div>
          </div>
          <button id="pause-resume-btn" class="pause-resume-btn" onclick="togglePauseResume()">
            ⏸️ Pause
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Constants from backend
    const POSITIONS = ["PG", "SG", "SF", "PF", "C"];
    
    // Court coordinates (from HCO_STRING_SPOTS in constants.py)
    const HCO_STRING_SPOTS = {
      "key": {"x": 64, "y": 25},
      "upper midWing": {"x": 68, "y": 36},
      "lower midWing": {"x": 68, "y": 14},
      "upper wing": {"x": 73, "y": 40},
      "lower wing": {"x": 73, "y": 10},
      "upper midCorner": {"x": 81, "y": 43},
      "lower midCorner": {"x": 81, "y": 7},
      "upper corner": {"x": 88, "y": 44},
      "lower corner": {"x": 88, "y": 6},
      "upper highPost": {"x": 74, "y": 32},
      "lower highPost": {"x": 74, "y": 19},
      "upper midPost": {"x": 80, "y": 32},
      "lower midPost": {"x": 80, "y": 19},
      "upper lowPost": {"x": 86, "y": 32},
      "lower lowPost": {"x": 86, "y": 19},
      "topLane": {"x": 74, "y": 25},
      "midLane": {"x": 80, "y": 25},
      "upper apex": {"x": 80, "y": 36},
      "lower apex": {"x": 80, "y": 15},
      "upper midBaseline": {"x": 89, "y": 36},
      "lower midBaseline": {"x": 89, "y": 15},
      "deep key": {"x": 57, "y": 25},
      "deep lower wing": {"x": 57, "y": 15},
      "deep lower baseline": {"x": 57, "y": 5},
      "deep upper wing": {"x": 57, "y": 35},
      "deep upper baseline": {"x": 57, "y": 45}
    };

    // Offset positions for collision handling
    const OFFSET_SPOTS = {
      "deep key": {"x": 60, "y": 25},
      "key": {"x": 67, "y": 25},
      "topLane": {"x": 77, "y": 25},
      "midLane": {"x": 83, "y": 25},
      "deep upper wing": {"x": 60, "y": 32},
      "upper midWing": {"x": 71, "y": 33},
      "upper wing": {"x": 76, "y": 37},
      "upper apex": {"x": 83, "y": 33},
      "upper corner": {"x": 88, "y": 41},
      "upper midCorner": {"x": 81, "y": 40},
      "deep upper baseline": {"x": 57, "y": 42},
      "upper midBaseline": {"x": 89, "y": 33},
      "deep lower wing": {"x": 60, "y": 18},
      "lower midWing": {"x": 71, "y": 17},
      "lower wing": {"x": 76, "y": 13},
      "lower apex": {"x": 83, "y": 18},
      "lower corner": {"x": 88, "y": 9},
      "lower midCorner": {"x": 81, "y": 10},
      "deep lower baseline": {"x": 57, "y": 8},
      "lower midBaseline": {"x": 89, "y": 18},
      "upper lowPost": {"x": 83, "y": 35},
      "upper midPost": {"x": 77, "y": 35},
      "upper highPost": {"x": 71, "y": 35},
      "lower lowPost": {"x": 89, "y": 16},
      "lower midPost": {"x": 83, "y": 16},
      "lower highPost": {"x": 77, "y": 16}
    };

    // Ball-handling actions
    const BALL_HANDLING_ACTIONS = ["handle_ball", "receive", "shoot"];

    // Play state
    let playState = {
      name: "",
      type: "", // "Motion" or "Set Play"
      skeleton: null
    };

    // Animation state
    let animationIntervalId = null;
    let isAnimating = false;
    let isPaused = false;
    let animationStepIndex = 0;
    let currentStepAssignments = {};
    let previousStepAssignments = {};
    let positionOffsets = {};
    let currentBallHandler = null;
    let isShotAnimating = false; // Track if shot animation is in progress

    function getAssignmentSpot(posAction) {
      if (!posAction) return null;
      return posAction.spot || posAction.location || null;
    }

    function getSetPlayAliasMap(targetShooter) {
      if (!targetShooter || !POSITIONS.includes(targetShooter)) {
        return null;
      }

      const remainingPositions = POSITIONS.filter(pos => pos !== targetShooter);
      return {
        target_shooter: targetShooter,
        pos1: remainingPositions[0],
        pos2: remainingPositions[1],
        pos3: remainingPositions[2],
        pos4: remainingPositions[3]
      };
    }

    function normalizeSkeletonSteps(rawSteps, playData, playType) {
      if (!Array.isArray(rawSteps)) {
        return [];
      }

      if (playType !== 'Set Play') {
        return rawSteps;
      }

      const aliasMap = getSetPlayAliasMap(playData?.target_shooter);
      if (!aliasMap) {
        return rawSteps;
      }

      return rawSteps.map(step => {
        if (!step || !step.pos_actions) {
          return step;
        }

        const remappedPosActions = {};
        let hasAliasKeys = false;

        Object.entries(step.pos_actions).forEach(([key, value]) => {
          const mappedKey = aliasMap[key] || key;
          if (mappedKey !== key) {
            hasAliasKeys = true;
          }
          remappedPosActions[mappedKey] = value;
        });

        if (!hasAliasKeys) {
          return step;
        }

        return {
          ...step,
          pos_actions: remappedPosActions
        };
      });
    }

    // Get play name and team info from URL
    const urlParams = new URLSearchParams(window.location.search);
    const playName = urlParams.get('play_name');
    const playId = urlParams.get('play_id');
    const teamId = urlParams.get('team_id') || urlParams.get('user_team_id') || urlParams.get('home_id') || urlParams.get('away_id');
    
    // Team name to court image mapping (normalize team name)
    function normalizeTeamName(name) {
      if (!name) return 'bentley_truman'; // Default
      return name.toLowerCase().replace(/[\s\-]/g, '_');
    }
    
    // Set court image based on team
    function setCourtImage(teamName) {
      const courtImage = document.getElementById('court-image');
      if (courtImage && teamName) {
        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const staticPrefix = isLocalhost ? '/static' : '';
        courtImage.src = typeof getTeamAssetPath === 'function' ? staticPrefix + getTeamAssetPath(teamName, 'court') : staticPrefix + '/images/teams/general/general_court.jpg';
        courtImage.alt = `${teamName} Basketball Court`;
        courtImage.onerror = function() {
          this.src = typeof getTeamAssetPath === 'function' ? staticPrefix + getTeamAssetPath(null, 'court') : staticPrefix + '/images/teams/general/general_court.jpg';
          this.onerror = null;
        };
      }
    }
    
    // Get vibrant color for team
    const VIBRANT_COLORS = {
      "Bentley-Truman": "#5080ff",
      "Four Corners": "#ffcc66",
      "Lancaster": "#ff6200",
      "Little York": "#9945ff",
      "Morristown": "#ff2233",
      "Ocean City": "#4444ff",
      "South Lancaster": "#cc3322",
      "Xavien": "#00cc44"
    };
    
    function getVibrantColor(teamName) {
      return VIBRANT_COLORS[teamName] || "#4a90e2"; // Default blue
    }
    
    // Apply team color to player icons
    let teamColor = "#4a90e2"; // Default blue
    function setTeamColor(teamName) {
      if (teamName) {
        teamColor = getVibrantColor(teamName);
        // Update CSS variable for player icons
        document.documentElement.style.setProperty('--team-vibrant-color', teamColor);
      }
    }

    // Back navigation
    function goBack() {
      // ✅ SS&S: Stop animation before navigation to prevent conflicts
      stopAnimation();
      
      // ✅ SS&S: Use unified Timeout Navigation Helper for consistent parameter building
      const helper = window.TimeoutNavigationHelper;
      if (!helper) {
        console.error('❌ [PLAY-DETAILS] TimeoutNavigationHelper not loaded!');
        return;
      }
      
      const urlParams = new URLSearchParams(window.location.search);
      const currentGameId = helper.getGameId(urlParams);
      const resumeFromTimeout = helper.getResumeFromTimeout(urlParams);
      const currentQuarter = parseInt(urlParams.get('quarter'), 10) || 1;
      const myTeamSide = urlParams.get('my_team');
      
      // Build lineup object from URL params
      const lineup = {};
      if (myTeamSide) {
        ['pg', 'sg', 'sf', 'pf', 'c'].forEach(pos => {
          const paramKey = `${myTeamSide}_${pos}`;
          const playerId = urlParams.get(paramKey);
          if (playerId) {
            lineup[pos.toUpperCase()] = playerId;
          }
        });
      }
      
      // ✅ SS&S: Use TimeoutNavigationHelper to preserve all game context (including resume_from_timeout and clock)
      const params = helper.buildGameNavigationParams({
        sourceParams: urlParams,
        targetQuarter: currentQuarter,
        gameId: currentGameId,
        resumeFromTimeout: resumeFromTimeout,
        lineup: lineup,
        myTeamSide: myTeamSide,
        // ✅ SS&S: Don't pass computerTimeout params if not needed (prevents warning)
        computerTimeout: false,
        computerTeamName: null
      });
      
      // ✅ SS&S: Dynamic back navigation - check backTo parameter to determine where to go
      // This makes the back button truly dynamic and future-proof for any entry point
      const backTo = urlParams.get('backTo');
      let targetPage = 'playbooks.html'; // Default fallback for backward compatibility
      
      if (backTo) {
        // Use the explicitly set backTo parameter (e.g., 'playbooks.html', 'game-plan.html', etc.)
        targetPage = backTo;
      }
      
      // Preserve 'from' parameter so the target page knows where to navigate back to
      const from = urlParams.get('from');
      if (from) {
        params.set('from', from);
      }
      
      // Use environment-aware path
      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const staticPrefix = isLocalhost ? '/static' : '';
      window.location.href = `${staticPrefix}/${targetPage}?${params.toString()}`;
    }

    // Helper function to adjust color brightness
    function adjustColorBrightness(hex, percent) {
      const num = parseInt(hex.replace("#", ""), 16);
      const r = Math.max(0, Math.min(255, (num >> 16) + percent));
      const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + percent));
      const b = Math.max(0, Math.min(255, (num & 0x0000FF) + percent));
      return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }
    
    // Load team info and set court/colors
    async function loadTeamInfo() {
      if (!teamId) {
        // Try to get team name from URL params (home/away)
        const homeTeam = urlParams.get('home');
        const awayTeam = urlParams.get('away');
        const userTeamSide = urlParams.get('my_team'); // "home" or "away"
        
        let teamName = null;
        if (userTeamSide === 'home' && homeTeam) {
          teamName = homeTeam;
        } else if (userTeamSide === 'away' && awayTeam) {
          teamName = awayTeam;
        } else if (homeTeam) {
          // Default to home team if no user team side specified
          teamName = homeTeam;
        }
        
        if (teamName) {
          setCourtImage(teamName);
          setTeamColor(teamName);
        }
        return;
      }
      
      // Try to fetch team info from API
      try {
        // For now, use teamId as team name (it might be a name already)
        // In the future, we could fetch team details from API
        setCourtImage(teamId);
        setTeamColor(teamId);
      } catch (error) {
        console.warn('Could not load team info, using defaults:', error);
      }
    }
    
    // Load play data from API
    async function loadPlayData() {
      if (!playName && !playId) {
        document.getElementById('play-name').textContent = 'Play Not Found';
        return;
      }

      try {
        const playUrl = playId
          ? API_CONFIG.buildUrl(`/api/plays/${encodeURIComponent(playId)}`)
          : API_CONFIG.buildUrl(`/api/play/${encodeURIComponent(playName)}`);
        const response = await fetch(playUrl);
        
        if (!response.ok) {
          throw new Error(`Failed to load play: ${response.status}`);
        }

        const playData = await response.json();
        
        // Update header
        document.getElementById('play-name').textContent = playData.name || playName;
        const playType = playData.play_type === 'motion' ? 'Motion' : 'Set Play';
        document.getElementById('play-type').textContent = playType;
        
        // Store play state
        playState.name = playData.name;
        playState.type = playType;
        
        // Get skeleton based on play type
        if (playState.type === 'Motion') {
          // Motion plays: base_loop can have versions array (new format) or direct steps (old format)
          const baseLoop = playData.skeletons?.base_loop;
          if (baseLoop) {
            // Check for new format: versions array
            if (baseLoop.versions && Array.isArray(baseLoop.versions) && baseLoop.versions.length > 0) {
              // Use first version with steps (or v0 if available)
              const v0Version = baseLoop.versions.find(v => v.version === 'v0' && v.steps && v.steps.length > 0);
              const firstVersion = baseLoop.versions.find(v => v.steps && v.steps.length > 0);
              const selectedVersion = v0Version || firstVersion;
              if (selectedVersion && selectedVersion.steps) {
                playState.skeleton = { steps: normalizeSkeletonSteps(selectedVersion.steps, playData, playType) };
              } else {
                console.error('Motion play base_loop has versions but none have steps');
              }
            } 
            // Check for old format: direct steps array
            else if (baseLoop.steps && Array.isArray(baseLoop.steps)) {
              playState.skeleton = { ...baseLoop, steps: normalizeSkeletonSteps(baseLoop.steps, playData, playType) };
            } 
            // Check if base_loop is an array of steps directly (unlikely but possible)
            else if (Array.isArray(baseLoop)) {
              playState.skeleton = { steps: normalizeSkeletonSteps(baseLoop, playData, playType) };
            } 
            else {
              console.error('Motion play base_loop structure not recognized:', baseLoop);
            }
          } else {
            console.error('Motion play has no base_loop skeleton');
          }
        } else {
          // Set Play: Access successful skeleton v0 from versions array
          const successfulVariant = playData.skeletons?.successful;
          if (successfulVariant) {
            // Check if it has versions array structure (new format)
            if (successfulVariant.versions && Array.isArray(successfulVariant.versions) && successfulVariant.versions.length > 0) {
              // Find v0 version
              const v0Version = successfulVariant.versions.find(v => v.version === 'v0');
              if (v0Version && v0Version.steps) {
                playState.skeleton = { steps: normalizeSkeletonSteps(v0Version.steps, playData, playType) };
              } else {
                // Fallback to first version if v0 not found
                const firstVersion = successfulVariant.versions.find(v => v.steps && v.steps.length > 0);
                if (firstVersion) {
                  playState.skeleton = { steps: normalizeSkeletonSteps(firstVersion.steps, playData, playType) };
                }
              }
            } else if (successfulVariant.steps) {
              // Old format: direct steps array
              playState.skeleton = { steps: normalizeSkeletonSteps(successfulVariant.steps, playData, playType) };
            }
          }
        }

        if (!playState.skeleton || !playState.skeleton.steps || playState.skeleton.steps.length === 0) {
          console.error('No skeleton data found for play. playState.skeleton:', playState.skeleton);
          console.error('playData.skeletons:', playData.skeletons);
          document.getElementById('play-name').textContent = 'Error: No animation data available';
          return;
        }
        
        console.log('✅ Loaded skeleton with', playState.skeleton.steps.length, 'steps');

        // Load and display copy if it exists (works for both motion and set plays)
        console.log('🔍 Checking for copy data:', playData.copy);
        if (playData.copy) {
          const copyContainers = document.querySelectorAll('.info-container p');
          if (copyContainers.length >= 3) {
            // Handle both object format (copy_1, copy_2, copy_3) and array format
            if (typeof playData.copy === 'object' && !Array.isArray(playData.copy)) {
              const copy1 = playData.copy.copy_1 || playData.copy[0] || '';
              const copy2 = playData.copy.copy_2 || playData.copy[1] || '';
              const copy3 = playData.copy.copy_3 || playData.copy[2] || '';
              
              if (copy1) copyContainers[0].textContent = copy1;
              if (copy2) copyContainers[1].textContent = copy2;
              if (copy3) copyContainers[2].textContent = copy3;
              
              console.log('✅ Loaded copy:', { copy1, copy2, copy3 });
            } else if (Array.isArray(playData.copy)) {
              if (playData.copy[0]) copyContainers[0].textContent = playData.copy[0];
              if (playData.copy[1]) copyContainers[1].textContent = playData.copy[1];
              if (playData.copy[2]) copyContainers[2].textContent = playData.copy[2];
              
              console.log('✅ Loaded copy from array:', playData.copy);
            }
          }
        } else {
          console.warn('⚠️ No copy data found for play:', playData.name);
        }

        // Start animation
        startAnimation();
        
      } catch (error) {
        console.error('Error loading play:', error);
        document.getElementById('play-name').textContent = 'Error Loading Play';
      }
    }

    // Start animation
    function startAnimation() {
      if (!playState.skeleton || playState.skeleton.steps.length === 0) {
        console.error('No steps to animate');
        return;
      }

      // Stop any existing animation
      stopAnimation();

      // Setup animation
      isAnimating = true;
      animationStepIndex = 0;
      currentStepAssignments = {};
      previousStepAssignments = {};
      positionOffsets = {};
      currentBallHandler = null;

      // Start animation loop
      animateNextStep();
    }

    // Toggle pause/resume
    function togglePauseResume() {
      const btn = document.getElementById('pause-resume-btn');
      if (!btn) return;

      if (isPaused) {
        // Resume
        isPaused = false;
        btn.textContent = '⏸️ Pause';
        btn.classList.remove('paused');
        // Continue animation
        animateNextStep();
      } else {
        // Pause
        isPaused = true;
        btn.textContent = '▶️ Resume';
        btn.classList.add('paused');
        // Animation will stop at next check
      }
    }

    // Animate next step
    async function animateNextStep() {
      if (!isAnimating || isPaused) {
        return;
      }

      const steps = playState.skeleton.steps;

      // Check if we've reached the end
      if (animationStepIndex >= steps.length) {
        if (playState.type === 'Motion') {
          // Motion: Loop back to step 0
          animationStepIndex = 0;
        } else {
          // Set Play: Pause 2 seconds, then restart
          setTimeout(() => {
            animationStepIndex = 0;
            animateNextStep();
          }, 2000);
          return;
        }
      }

      const step = steps[animationStepIndex];

      // Update step assignments
      previousStepAssignments = {...currentStepAssignments};
      currentStepAssignments = {};
      positionOffsets = {};

      // Process step data
      POSITIONS.forEach(pos => {
        if (step.pos_actions && step.pos_actions[pos]) {
          const assignmentSpot = getAssignmentSpot(step.pos_actions[pos]);
          currentStepAssignments[pos] = {
            location: assignmentSpot,
            spot: assignmentSpot,
            action: step.pos_actions[pos].action
          };

          // Track ball handler
          if (BALL_HANDLING_ACTIONS.includes(step.pos_actions[pos].action)) {
            currentBallHandler = pos;
          }
        }
      });

      // Check for position collisions and apply offsets
      POSITIONS.forEach(pos => {
        const assignment = currentStepAssignments[pos];
        if (!assignment) return;

        for (const otherPos of POSITIONS) {
          if (otherPos === pos) continue;
          const otherAssignment = currentStepAssignments[otherPos];
          if (otherAssignment && otherAssignment.location === assignment.location) {
            if (assignment.action === 'screen') {
              positionOffsets[pos] = true;
            } else if (otherAssignment.action === 'screen') {
              positionOffsets[otherPos] = true;
            }
            break;
          }
        }
      });

      // ✅ SS&S: For set plays, the final step is always the shot step
      // Leverage this structural guarantee instead of searching for "shoot" action
      const isFinalStep = animationStepIndex === steps.length - 1;
      const isSetPlayFinalStep = playState.type === 'Set Play' && isFinalStep;
      
      if (isSetPlayFinalStep && !isShotAnimating) {
        // Find the shooter's position (player with ball-handling action in final step)
        // In set plays, the final step always has one player with a ball-handling action (shooter)
        const shooterEntry = Object.entries(currentStepAssignments).find(
          ([pos, assignment]) => BALL_HANDLING_ACTIONS.includes(assignment.action)
        );
        
        if (shooterEntry) {
          const [shooterPos, shooterAssignment] = shooterEntry;
          const shooterCoords = positionOffsets[shooterPos] 
            ? OFFSET_SPOTS[shooterAssignment.location] 
            : HCO_STRING_SPOTS[shooterAssignment.location];
          
          if (shooterCoords) {
            // Render the step first to show players in position
            renderCourtVisualization();
            
            // Animate the shot
            await animateShotAttempt(shooterCoords);
            
            // Move to next step after shot animation completes
            animationStepIndex++;
            animationIntervalId = setTimeout(() => animateNextStep(), 500);
            return;
          }
        }
      }

      // Render the step
      renderCourtVisualization();

      // Move to next step after delay
      animationStepIndex++;
      animationIntervalId = setTimeout(() => animateNextStep(), 1000);
    }

    // Stop animation
    function stopAnimation() {
      isAnimating = false;
      if (animationIntervalId) {
        clearTimeout(animationIntervalId);
        animationIntervalId = null;
      }
    }

    // Render court visualization
    function renderCourtVisualization() {
      const container = document.getElementById('player-icons-container');

      // Get existing icons to reuse for animation
      const existingIcons = {};
      container.querySelectorAll('.player-icon').forEach(icon => {
        const pos = icon.textContent;
        existingIcons[pos] = icon;
      });

      // Find ball handler
      let ballHandlerPos = null;
      let ballHandlerCoords = null;
      let ballLocation = null;

      // Update or create player icons
      POSITIONS.forEach(pos => {
        const assignment = currentStepAssignments[pos];
        const prevAssignment = previousStepAssignments[pos];

        if (assignment && assignment.location) {
          const coords = HCO_STRING_SPOTS[assignment.location];
          if (!coords) return;

          // Apply offset if exists
          const isOffset = positionOffsets[pos];
          let targetLeft, targetTop;

          if (isOffset) {
            const offsetCoords = OFFSET_SPOTS[assignment.location];
            if (offsetCoords) {
              targetLeft = `${offsetCoords.x}%`;
              targetTop = `${(50 - offsetCoords.y) * 2}%`;
            } else {
              targetLeft = `${coords.x}%`;
              targetTop = `${(50 - coords.y) * 2}%`;
            }
          } else {
            targetLeft = `${coords.x}%`;
            targetTop = `${(50 - coords.y) * 2}%`;
          }

          let icon = existingIcons[pos];

          if (!icon) {
            // Create new icon
            icon = document.createElement('div');
            icon.className = `player-icon ${pos}`;
            icon.textContent = pos;
            icon.dataset.position = pos;
            // Apply team color
            icon.style.background = `linear-gradient(135deg, ${teamColor}, ${adjustColorBrightness(teamColor, -20)})`;

            // Start from previous position if exists
            if (prevAssignment && prevAssignment.location) {
              const prevCoords = HCO_STRING_SPOTS[prevAssignment.location];
              if (prevCoords) {
                icon.style.left = `${prevCoords.x}%`;
                icon.style.top = `${(50 - prevCoords.y) * 2}%`;
              }
            } else {
              icon.style.left = targetLeft;
              icon.style.top = targetTop;
            }

            container.appendChild(icon);

            // Animate to target position
            if (prevAssignment && prevAssignment.location) {
              requestAnimationFrame(() => {
                icon.style.left = targetLeft;
                icon.style.top = targetTop;
              });
            }
          } else {
            // Update existing icon position and color
            icon.style.left = targetLeft;
            icon.style.top = targetTop;
            icon.style.background = `linear-gradient(135deg, ${teamColor}, ${adjustColorBrightness(teamColor, -20)})`;
            delete existingIcons[pos];
          }

          // Check if this player has the ball
          if (assignment.action) {
            if (BALL_HANDLING_ACTIONS.includes(assignment.action)) {
              ballHandlerPos = pos;
              ballHandlerCoords = { left: targetLeft, top: targetTop };
              currentBallHandler = pos;
              ballLocation = 'player';
            } else if (assignment.action === 'pass') {
              ballLocation = 'in_transit_pass';
            } else if (assignment.action === 'shoot') {
              ballLocation = 'basket';
            }
          }
        } else if (existingIcons[pos]) {
          delete existingIcons[pos];
        }
      });

      // Remove icons for positions that no longer exist
      Object.values(existingIcons).forEach(icon => icon.remove());

      // Handle ball sprite
      let ballIcon = container.querySelector('.ball-icon');

      let finalBallLeft = null;
      let finalBallTop = null;

      if (ballLocation === 'player' && ballHandlerPos && ballHandlerCoords) {
        finalBallLeft = ballHandlerCoords.left;
        finalBallTop = ballHandlerCoords.top;
      } else if (ballLocation === 'in_transit_pass') {
        const receiver = Object.entries(currentStepAssignments).find(([pos, assignment]) =>
          assignment && assignment.action === 'receive'
        );
        if (receiver) {
          const [receiverPos, receiverAssignment] = receiver;
          const receiverCoords = HCO_STRING_SPOTS[receiverAssignment.location];
          const receiverOffset = positionOffsets[receiverPos];
          const receiverActualCoords = receiverOffset ? OFFSET_SPOTS[receiverAssignment.location] : receiverCoords;

          if (receiverActualCoords) {
            finalBallLeft = `${receiverActualCoords.x}%`;
            finalBallTop = `${(50 - receiverActualCoords.y) * 2}%`;
            currentBallHandler = receiverPos;
          }
        }
      } else if (ballLocation === 'basket' && !isShotAnimating) {
        // Only set to basket if not currently animating a shot
        finalBallLeft = '91%';
        finalBallTop = '50%';
      } else if (currentBallHandler) {
        const handlerAssignment = currentStepAssignments[currentBallHandler] || previousStepAssignments[currentBallHandler];
        if (handlerAssignment && handlerAssignment.location) {
          const handlerCoords = HCO_STRING_SPOTS[handlerAssignment.location];
          if (handlerCoords) {
            finalBallLeft = `${handlerCoords.x}%`;
            finalBallTop = `${(50 - handlerCoords.y) * 2}%`;
          }
        }
      }

      if (finalBallLeft !== null && finalBallTop !== null && !isShotAnimating) {
        // Only position ball if not currently animating a shot
        if (!ballIcon) {
          ballIcon = document.createElement('div');
          ballIcon.className = 'ball-icon';
          container.appendChild(ballIcon);
        }
        ballIcon.style.left = finalBallLeft;
        ballIcon.style.top = finalBallTop;
        ballIcon.style.display = 'block';
      } else if (ballIcon && !isShotAnimating) {
        // Don't remove ball icon during shot animation
        ballIcon.style.display = 'none';
      }
    }

    /**
     * Animate shot attempt from shooter position to rim with parabolic arc
     * @param {Object} shooterCoords - {x, y} coordinates of shooter in grid system (0-100)
     */
    async function animateShotAttempt(shooterCoords) {
      if (isShotAnimating) return; // Prevent multiple simultaneous shots
      
      isShotAnimating = true;
      const container = document.getElementById('player-icons-container');
      let ballIcon = container.querySelector('.ball-icon');
      
      if (!ballIcon) {
        ballIcon = document.createElement('div');
        ballIcon.className = 'ball-icon shooting';
        container.appendChild(ballIcon);
      } else {
        ballIcon.classList.add('shooting');
      }
      
      // Convert shooter grid coordinates to percentage
      const startX = shooterCoords.x;
      const startY = (50 - shooterCoords.y) * 2; // Convert grid Y to percentage
      
      // Rim coordinates (home rim - right side of court)
      const rimX = 91; // From HOME_RIM_COORDS
      const rimY = 50; // (50 - 25) * 2 = 50%
      
      // Animation parameters
      const duration = 600; // 600ms for shot animation (straight path is faster)
      const startTime = performance.now();
      
      return new Promise((resolve) => {
        function animate(currentTime) {
          const elapsed = currentTime - startTime;
          const progress = Math.min(elapsed / duration, 1);
          
          // Linear interpolation (straight line from shooter to rim)
          const currentX = startX + (rimX - startX) * progress;
          const currentY = startY + (rimY - startY) * progress;
          
          // Update ball position
          ballIcon.style.left = `${currentX}%`;
          ballIcon.style.top = `${currentY}%`;
          ballIcon.style.display = 'block';
          
          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            // Animation complete
            ballIcon.classList.remove('shooting');
            isShotAnimating = false;
            resolve();
          }
        }
        
        requestAnimationFrame(animate);
      });
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', async () => {
      await loadTeamInfo();
      loadPlayData();
    });

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
      stopAnimation();
    });
  </script>

  <script src="/common.js"></script>
  <script src="/js/shared/timeoutNavigationHelper.js"></script>
