<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/shared/gtm-loader.js"></script>
  <script src="/js/shared/authGuard.js"></script>
  <script src="/js/shared/sentryInit.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Mastering GOB — Tutorials | Geeked Out Basketball</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/auth-bar.css">
  <link rel="stylesheet" href="/css/gob-buttons.css">
  <link rel="stylesheet" href="/css/gob-tutorial.css">
  <style>
  /* ===================== HUB (page-specific) ===================== */

  .tut-top { margin-top: 4px; }
  .tm-title { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1; letter-spacing: .01em; margin: 6px 0 14px; color: var(--text); }
  .continue-link { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--orange-soft); text-decoration: none; }
  .continue-link:hover { color: var(--orange); }

  /* PROGRESS STRIP */
  .progress-strip { display: flex; align-items: center; gap: 20px; padding: 16px 20px; margin-top: 4px; }
  .progress-strip .pct { font-family: var(--display); font-size: 40px; line-height: .8; color: var(--text); min-width: 78px; }
  .progress-strip .meta { flex: 1; }
  .progress-strip .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 12px; }
  .progress-strip .lbl { font-family: var(--display); font-size: 19px; letter-spacing: .03em; color: var(--text); }
  .progress-strip .sub { font-size: 12px; color: var(--muted-2); }
  .bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--orange), #ffc06b); border-radius: 999px; transition: width .55s cubic-bezier(.2,.9,.3,1); }
  .reset-link { background: none; border: none; cursor: pointer; font-family: var(--body); font-size: 12px; color: var(--muted-3); text-decoration: underline; text-underline-offset: 2px; }
  .reset-link:hover { color: var(--muted); }

  /* SECTION HEADER */
  .section { margin-top: 40px; }
  .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .section-head h2 { font-family: var(--display); font-weight: 400; font-size: 36px; line-height: 1; letter-spacing: .01em; margin: 7px 0 0; color: var(--text); }
  .section-head .hint { font-size: 12.5px; color: var(--muted-2); max-width: 40ch; text-align: right; }

  /* CATEGORY GRID */
  .cats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .cat { overflow: hidden; }
  .cat-head { display: flex; align-items: center; gap: 12px; padding: 15px 18px; border-bottom: 1px solid var(--hair); }
  .cat-chip { width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.07); border: 1px solid var(--hair); color: var(--text); }
  .cat-chip svg { width: 21px; height: 21px; }
  .cat-name { font-family: var(--display); font-size: 26px; line-height: 1; letter-spacing: .02em; color: var(--text); flex: 1; }
  .cat-body { padding: 8px; display: flex; flex-direction: column; gap: 2px; }

  .tile { display: flex; align-items: center; gap: 14px; padding: 13px 12px; border-radius: 11px; text-decoration: none; color: inherit; position: relative; border: 1px solid transparent; transition: background .14s, border-color .14s; }
  .tile:hover { background: rgba(255,255,255,0.04); }
  .tile .order-circle { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: transparent; border: 2px solid var(--orange); color: var(--orange); font-family: var(--display); font-size: 17px; line-height: 1; letter-spacing: .02em; }
  .tile .t-main { flex: 1; min-width: 0; }
  .tile .t-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tile .t-name { font-weight: 700; font-size: 15px; color: var(--text); letter-spacing: -.01em; }
  .tile .t-go { color: var(--muted-3); font-size: 16px; transition: transform .14s, color .14s; }
  .tile:hover .t-go { transform: translateX(3px); color: var(--text); }

  /* tbd + seen states */
  .tile--tbd { opacity: .68; }

  .seen-check { width: 19px; height: 19px; border-radius: 50%; flex-shrink: 0; background: var(--green); color: #07210a; font-size: 12px; font-weight: 800; display: none; align-items: center; justify-content: center; }
  .tile.is-seen .seen-check { display: flex; }
  .tile.is-seen .t-go { display: none; }
  .tile.pulse { animation: tilePulse 1.6s ease; }
  @keyframes tilePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(247,148,32,0); }
    15% { box-shadow: 0 0 0 3px rgba(247,148,32,0.5); background: rgba(247,148,32,0.12); }
    60% { box-shadow: 0 0 0 2px rgba(247,148,32,0.28); }
  }

  /* ADVANCED TOPICS */
  .advanced-section {
    margin-top: 48px;
    padding-top: 34px;
    border-top: 1px solid var(--hair);
  }
  .advanced-progress {
    padding: 14px 18px;
    margin-bottom: 18px;
  }
  .advanced-progress .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
  }
  .advanced-progress .lbl {
    font-family: var(--display);
    font-size: 18px;
    letter-spacing: .03em;
    color: var(--text);
  }
  .advanced-progress .sub {
    font-size: 12px;
    color: var(--muted-2);
  }
  .advanced-list {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .advanced-topic {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 18px;
    border: 1px solid var(--hair);
    border-radius: 12px;
    background: rgba(255,255,255,0.035);
    opacity: .58;
  }
  .advanced-topic__name {
    font-weight: 800;
    font-size: 15px;
    color: var(--text);
    letter-spacing: -.01em;
  }
  .coming-soon {
    flex-shrink: 0;
    pointer-events: none;
    cursor: default;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    padding: 7px 11px;
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    font-family: var(--display);
    font-size: 14px;
    letter-spacing: .05em;
    line-height: 1;
  }

  /* live advanced topics (sub-page exists) */
  .advanced-topic--live {
    opacity: 1;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: background .14s, border-color .14s;
  }
  .advanced-topic--live:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.2);
  }
  .advanced-topic__go {
    flex-shrink: 0;
    color: var(--muted-3);
    font-size: 18px;
    line-height: 1;
    transition: transform .14s, color .14s;
  }
  .advanced-topic--live:hover .advanced-topic__go { transform: translateX(3px); color: var(--text); }
  .advanced-topic .seen-check { display: none; }
  .advanced-topic.is-seen .seen-check { display: flex; }
  .advanced-topic.is-seen .advanced-topic__go { display: none; }


  @media (max-width: 920px) {
    .cats { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .progress-strip { flex-wrap: wrap; }
    .section-head { flex-direction: column; align-items: flex-start; }
    .section-head .hint { text-align: left; }
  }
  </style>
</head>
<body class="gob-tut has-auth-bar has-footer" data-gob-nav="home">

  <div class="gob-shell">

    <header class="gob-head">
      <button class="gob-back" data-gob-back type="button"><span class="chev">‹</span> Back</button>
      <span class="spacer"></span>
    </header>

    <!-- TOP: calm identity + progress -->
    <div class="tut-top">
      <span class="eyebrow"><span class="tick"></span> Tutorials</span>
      <h1 class="tm-title">Learn GOB</h1>
      <div class="progress-strip panel">
        <div class="pct" id="pct">0%</div>
        <div class="meta">
          <div class="top">
            <span class="lbl">Your Coaching Knowledge</span>
            <span class="sub">
              <span id="seen-n">0</span> of <span id="total-n">7</span> lessons explored
              <span id="continue-wrap" hidden> · <a class="continue-link" id="continue-link" href="#">Continue → <span id="continue-name"></span></a></span>
            </span>
          </div>
          <div class="bar"><i id="bar"></i></div>
        </div>
        <button class="reset-link" id="reset" type="button">Reset</button>
      </div>
    </div>

    <!-- TOPICS -->
    <section class="section" id="topics">
      <div class="section-head">
        <div>
          <h2>Core Topics</h2>
        </div>
        <p class="hint">Start anywhere — each core lesson is built to stand on its own.</p>
      </div>
      <div class="cats" id="cats"></div>
    </section>

    <section class="section advanced-section" id="advanced-topics">
      <div class="section-head">
        <div>
          <h2>Advanced Topics</h2>
        </div>
      </div>
      <div class="advanced-progress panel" aria-label="Advanced topics progress">
        <div class="top">
          <span class="lbl">Advanced Progress</span>
          <span class="sub"><span id="advanced-seen-n">0</span> of <span id="advanced-total-n">3</span> topics complete</span>
        </div>
        <div class="bar"><i id="advanced-bar"></i></div>
      </div>
      <div class="advanced-list" id="advanced-topics-list"></div>
    </section>

  </div>

  <!-- BOTTOM NAV (intra-tutorial navigation) -->
  <nav class="gob-bottomnav" aria-label="Tutorial sections">
    <div class="navwrap" id="bottomnav"></div>
  </nav>

  <!-- TOAST -->
  <div class="gob-toast" id="toast" role="status" aria-live="polite">
    <span class="ti">✓</span>
    <span><span class="tt"></span><br><span class="ts"></span></span>
  </div>

  <!-- global auth-bar + footer (injected by authBarInit) -->
  <script src="/js/config/api-config.js"></script>
  <script src="/js/shared/archetypeBadge.js"></script>
  <script src="/js/shared/authBarInit.js"></script>
  <!-- tutorial hub behavior -->
  <script src="/js/shared/gobTutorialNav.js"></script>
  <script src="/js/shared/gobTutorialHub.js"></script>
</body>
</html>
