<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/shared/authGuard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/franchise-command-center.css">
  <link rel="stylesheet" href="/resource-pages.css">
  <style>
    .schedule-page-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-bottom: 16px;
    }

    .schedule-page-header .schedule-back-link {
      justify-self: start;
    }

    .schedule-back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      height: auto;
      padding: 0;
      background: none;
      color: rgba(255, 255, 255, 0.76);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.01em;
      text-decoration: none;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
      transition: color 0.18s ease, transform 0.18s ease;
    }

    .schedule-back-link:hover {
      background: none;
      color: #ffffff;
      transform: translateX(-1px);
    }

    .schedule-back-link::before {
      content: "←";
      font-size: 16px;
      line-height: 1;
    }

    .schedule-page-title {
      margin: 0 !important;
      text-align: center;
    }

    .schedule-weeks-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px 16px;
      align-items: start;
    }

    .schedule-week-card {
      min-width: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 18%),
        linear-gradient(180deg, rgba(42, 48, 58, 0.92), rgba(30, 35, 44, 0.95));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 14px 28px rgba(7, 10, 16, 0.28);
      overflow: hidden;
    }

    .schedule-week-title {
      padding: 10px 12px 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 0.03em;
      color: #f7f9ff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
    }

    .schedule-week-card--tournament {
      border-color: rgba(247, 148, 32, 0.32);
      background:
        linear-gradient(180deg, rgba(247, 148, 32, 0.10), transparent 22%),
        linear-gradient(180deg, rgba(42, 48, 58, 0.92), rgba(30, 35, 44, 0.95));
    }

    .schedule-week-card--tournament .schedule-week-title {
      color: #ffd29b;
      border-bottom-color: rgba(247, 148, 32, 0.18);
    }

    .schedule-week-body {
      padding: 4px 10px 6px;
    }

    .schedule-game-row {
      display: block;
      min-height: 28px;
      padding: 6px 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      line-height: 1.35;
      color: rgba(255, 255, 255, 0.9);
    }

    .schedule-game-row:last-child {
      border-bottom: 0;
    }

    .schedule-expand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 30px;
      padding: 8px 2px 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
    }

    .schedule-expand-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      background: none;
      border: 0;
      color: rgba(255, 255, 255, 0.78);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.18s ease;
    }

    .schedule-expand-btn:hover {
      color: #ffffff;
    }

    .schedule-expand-caret {
      font-size: 12px;
      line-height: 1;
      transition: transform 0.18s ease;
    }

    .schedule-expand-btn[aria-expanded="true"] .schedule-expand-caret {
      transform: rotate(180deg);
    }

    .schedule-game-row a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
    }

    .schedule-game-row a:hover {
      text-decoration: underline;
    }

    .schedule-game-row .schedule-team-winner {
      font-weight: 800;
    }

    .schedule-game-row .schedule-box-link {
      margin-left: 6px;
      color: #ffffff;
      font-weight: 700;
    }

    .schedule-game-context {
      display: inline-block;
      margin-right: 6px;
      color: rgba(255, 210, 155, 0.86);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .schedule-loading,
    .schedule-error {
      padding: 28px 14px;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.78);
    }

    @media (max-width: 980px) {
      .schedule-weeks-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="/css/fonts.css">
</head>
<body>
  <div class="resource-page-container fcc-brand-page-shell">
    <div class="schedule-page-header">
      <a id="back-btn" class="back-to-locker-room schedule-back-link" href="#">Back to Locker Room</a>
      <h1 class="schedule-page-title">National Schedule</h1>
      <div></div>
    </div>
    <div id="schedule-container" class="schedule-weeks-grid"></div>
  </div>
  <script src="/js/config/api-config.js"></script>
  <script src="/common.js"></script>
  <script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const franchiseId = params.get('franchise_id');
  const teamId = params.get('team_id');
  const backBtn = document.getElementById('back-btn');
  const scheduleContainer = document.getElementById('schedule-container');

  if (backBtn && franchiseId && teamId) {
    backBtn.href = resolveFranchiseLockerRoomUrl({ params, franchiseId, teamId });
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  async function fetchJSON(url) {
    const res = await fetch(url, { headers: window.API_CONFIG ? API_CONFIG.getAuthHeaders() : {} });
    if (!res.ok) throw new Error('Request failed');
    return res.json();
  }

  function getConferenceShortLabel(conference) {
    const numericConference = Number(conference);
    if (!Number.isInteger(numericConference) || numericConference < 1 || numericConference > 16) return `C${conference}`;
    const letter = String.fromCharCode(65 + Math.floor((numericConference - 1) / 2));
    const number = ((numericConference - 1) % 2) + 1;
    return `${letter}${number}`;
  }

  function getSisterConference(conference) {
    const c = Number(conference);
    if (!Number.isInteger(c) || c < 1 || c > 16) return null;
    return c % 2 === 0 ? c - 1 : c + 1;
  }

  function buildTeamLink(teamId, displayName, rawName, returnUrl) {
    return `<a href="/team-roster-view.html?mode=franchise&franchise_id=${encodeURIComponent(franchiseId)}&team_id=${encodeURIComponent(teamId || rawName)}&team_name=${encodeURIComponent(rawName)}&return_url=${encodeURIComponent(returnUrl)}">${escapeHtml(displayName)}</a>`;
  }

  function sortGamesForWeek(games, userConference) {
    const sisterConference = getSisterConference(userConference);
    function primaryConference(game) {
      const away = Number(game.away_conference);
      const home = Number(game.home_conference);
      if (Number.isFinite(away) && away === home) return away;
      if (Number.isFinite(away) && away === Number(userConference)) return away;
      if (Number.isFinite(home) && home === Number(userConference)) return home;
      if (Number.isFinite(away) && away === Number(sisterConference)) return away;
      if (Number.isFinite(home) && home === Number(sisterConference)) return home;
      if (Number.isFinite(away) && Number.isFinite(home)) return Math.min(away, home);
      return Number.isFinite(away) ? away : home;
    }

    function priority(game) {
      const conf = primaryConference(game);
      if (Number(conf) === Number(userConference)) return 0;
      if (Number(conf) === Number(sisterConference)) return 1;
      return 2;
    }

    return [...games].sort((a, b) => {
      const priorityDiff = priority(a) - priority(b);
      if (priorityDiff !== 0) return priorityDiff;
      const confDiff = (primaryConference(a) || 999) - (primaryConference(b) || 999);
      if (confDiff !== 0) return confDiff;
      const awayNameDiff = String(a.away_display_name || a.away_name || '').localeCompare(String(b.away_display_name || b.away_name || ''));
      if (awayNameDiff !== 0) return awayNameDiff;
      return String(a.home_display_name || a.home_name || '').localeCompare(String(b.home_display_name || b.home_name || ''));
    });
  }

  function buildGameRow(game, returnUrl) {
    const awayDisplay = game.away_display_name || game.away_name || game.away_team_id;
    const homeDisplay = game.home_display_name || game.home_name || game.home_team_id;
    const awayRaw = game.away_name || awayDisplay;
    const homeRaw = game.home_name || homeDisplay;
    const awayConf = getConferenceShortLabel(game.away_conference);
    const homeConf = getConferenceShortLabel(game.home_conference);
    const awayLink = buildTeamLink(game.away_team_id, awayDisplay, awayRaw, returnUrl);
    const homeLink = buildTeamLink(game.home_team_id, homeDisplay, homeRaw, returnUrl);
    const hasAwayConference = Number.isFinite(Number(game.away_conference));
    const hasHomeConference = Number.isFinite(Number(game.home_conference));
    const contextMarkup = game.tournament_context
      ? `<span class="schedule-game-context">${escapeHtml(game.tournament_context)}</span>`
      : '';
    const awayScore = game.away_score;
    const homeScore = game.home_score;
    const isComplete = game.status === 'complete' || (
      awayScore !== null && awayScore !== undefined &&
      homeScore !== null && homeScore !== undefined &&
      (Number(awayScore) > 0 || Number(homeScore) > 0)
    );

    let awayMarkup = `${awayLink}${hasAwayConference ? ` <span class="schedule-game-conf">(${escapeHtml(awayConf)})</span>` : ''}`;
    let homeMarkup = `${homeLink}${hasHomeConference ? ` <span class="schedule-game-conf">(${escapeHtml(homeConf)})</span>` : ''}`;

    if (isComplete) {
      awayMarkup += ` (${escapeHtml(awayScore)})`;
      homeMarkup += ` (${escapeHtml(homeScore)})`;
      if (Number(awayScore) > Number(homeScore)) {
        awayMarkup = `<span class="schedule-team-winner">${awayMarkup}</span>`;
      } else if (Number(homeScore) > Number(awayScore)) {
        homeMarkup = `<span class="schedule-team-winner">${homeMarkup}</span>`;
      }
    }

    const boxScore = (game.game_id && isComplete)
      ? ` <a class="schedule-box-link" href="/box-score.html?game_id=${encodeURIComponent(game.game_id)}&mode=franchise&franchise_id=${encodeURIComponent(franchiseId)}&team_id=${encodeURIComponent(teamId)}&return_url=${encodeURIComponent(returnUrl)}">Box Score</a>`
      : '';

    return `<div class="schedule-game-row">${contextMarkup}${awayMarkup} at ${homeMarkup}${boxScore}</div>`;
  }

  function buildWeekRowsMarkup(weekGames, returnUrl, weekNumber, emptyText = 'No games scheduled.', initialVisible = 8) {
    if (!weekGames.length) {
      return `<div class="schedule-game-row">${escapeHtml(emptyText)}</div>`;
    }
    const cap = Math.max(1, Number(initialVisible) || 8);
    const initialRows = weekGames.slice(0, cap).map((game) => buildGameRow(game, returnUrl)).join('');
    if (weekGames.length <= cap) {
      return initialRows;
    }
    const extraRows = weekGames.slice(cap).map((game) => buildGameRow(game, returnUrl)).join('');
    return `
      ${initialRows}
      <div class="schedule-expand-row">
        <button
          class="schedule-expand-btn"
          type="button"
          data-week-expand="${weekNumber}"
          aria-expanded="false"
          aria-controls="schedule-week-extra-${weekNumber}"
        >
          <span>See all games</span>
          <span class="schedule-expand-caret">▾</span>
        </button>
      </div>
      <div id="schedule-week-extra-${weekNumber}" hidden>${extraRows}</div>
    `;
  }

  function renderNationalSchedule(allGamesByWeek, userConference) {
    if (!scheduleContainer) return;
    const returnUrl = getCurrentRelativeUrl();
    const weekCards = [];
    for (let week = 1; week <= 26; week += 1) {
      const weekGames = sortGamesForWeek(allGamesByWeek[week] || [], userConference);
      const rows = buildWeekRowsMarkup(weekGames, returnUrl, week);
      weekCards.push(`
        <section class="schedule-week-card">
          <div class="schedule-week-title">Week ${week}</div>
          <div class="schedule-week-body">${rows}</div>
        </section>
      `);
    }
    scheduleContainer.innerHTML = weekCards.join('');
  }

  const tournamentWeekLabels = {
    27: 'Conference Tourney - R1',
    28: 'Conference Tourney - R2',
    29: 'Conference Tourney - Championships',
    30: 'Region Tourney - R1',
    31: 'Region Tourney - Championships',
    32: 'National Tourney - R1',
    33: 'National Tourney - R2',
    34: 'National Championship'
  };

  function renderFullSchedule(allGamesByWeek, tournamentGamesByWeek, userConference) {
    if (!scheduleContainer) return;
    const returnUrl = getCurrentRelativeUrl();
    const weekCards = [];
    for (let week = 1; week <= 26; week += 1) {
      const weekGames = sortGamesForWeek(allGamesByWeek[week] || [], userConference);
      const rows = buildWeekRowsMarkup(weekGames, returnUrl, week);
      weekCards.push(`
        <section class="schedule-week-card">
          <div class="schedule-week-title">Week ${week}</div>
          <div class="schedule-week-body">${rows}</div>
        </section>
      `);
    }
    for (let week = 27; week <= 34; week += 1) {
      const weekGames = sortGamesForWeek(tournamentGamesByWeek[week] || [], userConference);
      const rows = buildWeekRowsMarkup(weekGames, returnUrl, week, 'No tournament matchups available yet.', 16);
      weekCards.push(`
        <section class="schedule-week-card schedule-week-card--tournament">
          <div class="schedule-week-title">Week ${week}: ${escapeHtml(tournamentWeekLabels[week])}</div>
          <div class="schedule-week-body">${rows}</div>
        </section>
      `);
    }
    scheduleContainer.innerHTML = weekCards.join('');
  }

  if (!franchiseId) {
    if (scheduleContainer) scheduleContainer.innerHTML = '<div class="schedule-error">Missing franchise_id in URL.</div>';
    return;
  }

  if (scheduleContainer) {
    scheduleContainer.innerHTML = '<div class="schedule-loading">Loading schedule...</div>';
    scheduleContainer.addEventListener('click', (event) => {
      const button = event.target.closest('[data-week-expand]');
      if (!button) return;
      const week = button.getAttribute('data-week-expand');
      const extra = document.getElementById(`schedule-week-extra-${week}`);
      if (!extra) return;
      const expanded = button.getAttribute('aria-expanded') === 'true';
      button.setAttribute('aria-expanded', expanded ? 'false' : 'true');
      extra.hidden = expanded;
    });
  }

  Promise.all([
    fetchJSON(API_CONFIG.buildUrl('/franchise/command-center/data') + '?franchise_id=' + encodeURIComponent(franchiseId)),
    fetchJSON(API_CONFIG.buildUrl('/franchise/schedule/national') + '?franchise_id=' + encodeURIComponent(franchiseId))
  ]).then(([cc, payload]) => {
    const allGamesByWeek = {};
    const tournamentGamesByWeek = {};
    const schedule = payload?.schedule || [];
    const tournamentSchedule = payload?.tournament_schedule || {};
    const teamNameMap = payload?.team_name_map || {};
    const teamDisplayMap = payload?.team_display_name_map || {};

    function hydrateGame(game) {
      let awayConf = Number(game.away_conference);
      let homeConf = Number(game.home_conference);
      if (!Number.isFinite(awayConf) || !Number.isFinite(homeConf)) {
        const ctx = game.tournament_context;
        const m = typeof ctx === 'string' ? ctx.match(/Conference\s+(\d+)/i) : null;
        if (m) {
          const n = Number(m[1]);
          if (Number.isFinite(n)) {
            if (!Number.isFinite(awayConf)) awayConf = n;
            if (!Number.isFinite(homeConf)) homeConf = n;
          }
        }
      }
      return {
        ...game,
        away_name: teamNameMap[game.away_team_id] || game.away_team_id,
        home_name: teamNameMap[game.home_team_id] || game.home_team_id,
        away_display_name: teamDisplayMap[game.away_team_id] || teamNameMap[game.away_team_id] || game.away_team_id,
        home_display_name: teamDisplayMap[game.home_team_id] || teamNameMap[game.home_team_id] || game.home_team_id,
        away_conference: awayConf,
        home_conference: homeConf
      };
    }

    schedule.forEach((weekGames, weekIndex) => {
      const weekNumber = weekIndex + 1;
      if (!Array.isArray(weekGames)) return;
      allGamesByWeek[weekNumber] = weekGames.map(hydrateGame);
    });

    Object.entries(tournamentSchedule).forEach(([weekNumber, weekGames]) => {
      if (!Array.isArray(weekGames)) return;
      tournamentGamesByWeek[Number(weekNumber)] = weekGames.map(hydrateGame);
    });

    renderFullSchedule(allGamesByWeek, tournamentGamesByWeek, Number(cc.user_conference));
  }).catch((err) => {
    if (scheduleContainer) scheduleContainer.innerHTML = '<div class="schedule-error">Failed to load schedule.</div>';
    console.error(err);
  });
})();
  </script>
</body>
</html>
