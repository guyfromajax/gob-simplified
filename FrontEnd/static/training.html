<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Training - GOB</title>
  <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico" />
  <link rel="stylesheet" href="training.css">
</head>
<body>
  <div class="training-container">
    <!-- Header -->
    <header class="training-header">
      <button id="back-btn" class="back-button">Back</button>
      <div class="header-center">
        <h1 class="page-title">TEAM TRAINING</h1>
        <div class="points-display">POINTS REMAINING: <span id="points-remaining">24</span></div>
      </div>
      <button id="submit-btn" class="submit-button" disabled>Submit Training</button>
    </header>

    <!-- Main Content: Two Panels Side-by-Side -->
    <div class="main-content">
      <!-- LEFT PANEL: Player Drills -->
      <div class="panel player-drills-panel">
        <h2 class="panel-title">Player Drills</h2>
        
        <!-- Offense Drills Section -->
        <div class="section">
          <h3 class="section-title">Offense Drills</h3>
          <div class="slider-group">
            <label class="slider-label">
              <span class="label-text">Inside Offense</span>
              <div class="slider-container">
                <input type="range" min="0" max="6" step="1" value="0" class="slider" id="offense-inside" data-category="player-drills">
                <span class="slider-value">0</span>
              </div>
            </label>
            <label class="slider-label">
              <span class="label-text">Outside Offense</span>
              <div class="slider-container">
                <input type="range" min="0" max="6" step="1" value="0" class="slider" id="offense-outside" data-category="player-drills">
                <span class="slider-value">0</span>
              </div>
            </label>
          </div>
        </div>

        <!-- Defense Drills Section -->
        <div class="section">
          <h3 class="section-title">Defense Drills</h3>
          <div class="slider-group">
            <label class="slider-label">
              <span class="label-text">Inside Defense</span>
              <div class="slider-container">
                <input type="range" min="0" max="6" step="1" value="0" class="slider" id="defense-inside" data-category="player-drills">
                <span class="slider-value">0</span>
              </div>
      </label>
            <label class="slider-label">
              <span class="label-text">Outside Defense</span>
              <div class="slider-container">
                <input type="range" min="0" max="6" step="1" value="0" class="slider" id="defense-outside" data-category="player-drills">
                <span class="slider-value">0</span>
              </div>
      </label>
    </div>
        </div>

        <!-- Technical Drills Section -->
        <div class="section">
          <h3 class="section-title">Technical Drills</h3>
          <div class="slider-group">
            <label class="slider-label">
              <span class="label-text">Passing</span>
              <div class="slider-container">
                <input type="range" min="0" max="6" step="1" value="0" class="slider" id="technical-passing" data-category="player-drills">
                <span class="slider-value">0</span>
              </div>
            </label>
            <label class="slider-label">
              <span class="label-text">Ball Handling</span>
              <div class="slider-container">
                <input type="range" min="0" max="6" step="1" value="0" class="slider" id="technical-ball-handling" data-category="player-drills">
                <span class="slider-value">0</span>
              </div>
      </label>
            <label class="slider-label">
              <span class="label-text">Rebounding</span>
              <div class="slider-container">
                <input type="range" min="0" max="6" step="1" value="0" class="slider" id="technical-rebounding" data-category="player-drills">
                <span class="slider-value">0</span>
              </div>
      </label>
    </div>
        </div>

        <!-- Weight Room Section -->
        <div class="section">
          <h3 class="section-title">Weight Room</h3>
          <div class="slider-group">
            <label class="slider-label">
              <span class="label-text">Strength</span>
              <div class="slider-container">
                <input type="range" min="0" max="6" step="1" value="0" class="slider" id="weight-strength" data-category="player-drills">
                <span class="slider-value">0</span>
              </div>
      </label>
            <label class="slider-label">
              <span class="label-text">Agility</span>
              <div class="slider-container">
                <input type="range" min="0" max="6" step="1" value="0" class="slider" id="weight-agility" data-category="player-drills">
                <span class="slider-value">0</span>
              </div>
      </label>
          </div>
        </div>
      </div>

      <!-- RIGHT PANEL: Team Drills -->
      <div class="panel team-drills-panel">
        <h2 class="panel-title">Team Drills</h2>
        
        <!-- Team Offense Section -->
        <div class="section">
          <h3 class="section-title">Team Offense</h3>
          <div class="slider-group">
            <label class="slider-label">
              <span class="label-text">Offense Install</span>
              <div class="slider-container">
                <input type="range" min="0" max="6" step="1" value="0" class="slider" id="team-offense-install" data-category="team-drills">
                <span class="slider-value">0</span>
              </div>
      </label>
    </div>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="offense-plays" value="current-playbook" checked>
              <span>Current Playbook</span>
      </label>
            <label class="radio-label">
              <input type="radio" name="offense-plays" value="custom">
              <span>Custom</span>
      </label>
    </div>
        </div>

        <!-- Team Defense Section -->
        <div class="section">
          <h3 class="section-title">Team Defense</h3>
          <div class="slider-group">
            <label class="slider-label">
              <span class="label-text">Defense Install</span>
              <div class="slider-container">
                <input type="range" min="0" max="6" step="1" value="0" class="slider" id="team-defense-install" data-category="team-drills">
                <span class="slider-value">0</span>
              </div>
      </label>
    </div>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="defense-plays" value="current-playbook" checked>
              <span>Current Playbook</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="defense-plays" value="custom">
              <span>Custom</span>
      </label>
    </div>
        </div>

        <!-- Fast Breaks Section -->
        <div class="section">
          <h3 class="section-title">Fast Breaks</h3>
          <div class="slider-group">
            <label class="slider-label">
              <span class="label-text">Offense Install</span>
              <div class="slider-container">
                <input type="range" min="0" max="6" step="1" value="0" class="slider" id="fast-break-offense-install" data-category="team-drills">
                <span class="slider-value">0</span>
              </div>
            </label>
            <label class="slider-label">
              <span class="label-text">Defense Install</span>
              <div class="slider-container">
                <input type="range" min="0" max="6" step="1" value="0" class="slider" id="fast-break-defense-install" data-category="team-drills">
                <span class="slider-value">0</span>
              </div>
      </label>
    </div>
        </div>

        <!-- Presses / Traps Section -->
        <div class="section">
          <h3 class="section-title">Presses / Traps</h3>
          <div class="slider-group">
            <label class="slider-label">
              <span class="label-text">Defense Install</span>
              <div class="slider-container">
                <input type="range" min="0" max="6" step="1" value="0" class="slider" id="press-defense-install" data-category="team-drills">
                <span class="slider-value">0</span>
              </div>
            </label>
            <label class="slider-label">
              <span class="label-text">Offense Install</span>
              <div class="slider-container">
                <input type="range" min="0" max="6" step="1" value="0" class="slider" id="press-offense-install" data-category="team-drills">
                <span class="slider-value">0</span>
              </div>
      </label>
          </div>
        </div>
      </div>
    </div>

    <!-- General Section (Full Width) -->
    <div class="general-section">
      <h2 class="panel-title">General</h2>
      <div class="general-grid">
        <label class="slider-label">
          <span class="label-text">Conditioning</span>
          <div class="slider-container">
            <input type="range" min="0" max="6" step="1" value="0" class="slider" id="general-conditioning" data-category="general">
            <span class="slider-value">0</span>
          </div>
        </label>
        <label class="slider-label">
          <span class="label-text">Free Throws</span>
          <div class="slider-container">
            <input type="range" min="0" max="6" step="1" value="0" class="slider" id="general-free-throws" data-category="general">
            <span class="slider-value">0</span>
          </div>
        </label>
        <label class="slider-label">
          <span class="label-text">Film Study</span>
          <div class="slider-container">
            <input type="range" min="0" max="6" step="1" value="0" class="slider" id="general-film-study" data-category="general">
            <span class="slider-value">0</span>
          </div>
        </label>
        <label class="slider-label">
          <span class="label-text">Breaks</span>
          <div class="slider-container">
            <input type="range" min="0" max="6" step="1" value="0" class="slider" id="general-breaks" data-category="general">
            <span class="slider-value">0</span>
          </div>
      </label>
      </div>
    </div>

    <!-- Coaching Style / Focus Section -->
    <div class="coaching-section">
      <h2 class="coaching-title">Coaching Style / Focus (choose one)</h2>
      <div class="archetypes-grid">
        <!-- Authoritarian -->
        <div class="archetype-block" data-archetype="authoritarian">
          <div class="archetype-header">
            <label class="archetype-radio-label">
              <input type="radio" name="coaching-focus" value="authoritarian" class="archetype-radio">
              <span class="archetype-name">Authoritarian</span>
            </label>
          </div>
          <div class="archetype-options">
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="authoritarian-discipline" class="archetype-radio">
              <span>Discipline</span>
            </label>
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="authoritarian-rebounding" class="archetype-radio">
              <span>Rebounding</span>
            </label>
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="authoritarian-execution" class="archetype-radio">
              <span>Execution</span>
            </label>
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="authoritarian-teamwork" class="archetype-radio">
              <span>Teamwork</span>
            </label>
          </div>
        </div>

        <!-- Systems Coach -->
        <div class="archetype-block" data-archetype="systems-coach">
          <div class="archetype-header">
            <label class="archetype-radio-label">
              <input type="radio" name="coaching-focus" value="systems-coach" class="archetype-radio">
              <span class="archetype-name">Systems Coach</span>
            </label>
          </div>
          <div class="archetype-options">
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="systems-coach-offense" class="archetype-radio">
              <span>Offense</span>
            </label>
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="systems-coach-defense" class="archetype-radio">
              <span>Defense</span>
            </label>
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="systems-coach-fast-breaks" class="archetype-radio">
              <span>Fast Breaks</span>
            </label>
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="systems-coach-press-trap" class="archetype-radio">
              <span>Press / Trap</span>
      </label>
    </div>
  </div>

        <!-- Player Maximizer -->
        <div class="archetype-block" data-archetype="player-maximizer">
          <div class="archetype-header">
            <label class="archetype-radio-label">
              <input type="radio" name="coaching-focus" value="player-maximizer" class="archetype-radio">
              <span class="archetype-name">Player Maximizer</span>
            </label>
          </div>
          <div class="archetype-options">
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="player-maximizer-top-3" class="archetype-radio">
              <span>Top 3 Attributes</span>
            </label>
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="player-maximizer-attributes-4-6" class="archetype-radio">
              <span>Attributes 4–6</span>
            </label>
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="player-maximizer-custom" class="archetype-radio">
              <span>Custom Attributes</span>
            </label>
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="player-maximizer-opportunity" class="archetype-radio">
              <span>Opportunity</span>
            </label>
          </div>
  </div>

        <!-- Culture Builder -->
        <div class="archetype-block" data-archetype="culture-builder">
          <div class="archetype-header">
            <label class="archetype-radio-label">
              <input type="radio" name="coaching-focus" value="culture-builder" class="archetype-radio">
              <span class="archetype-name">Culture Builder</span>
            </label>
          </div>
          <div class="archetype-options">
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="culture-builder-inspire" class="archetype-radio">
              <span>Inspire</span>
            </label>
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="culture-builder-confidence" class="archetype-radio">
              <span>Confidence</span>
            </label>
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="culture-builder-community" class="archetype-radio">
              <span>Community Engagement</span>
            </label>
            <label class="archetype-option">
              <input type="radio" name="coaching-focus" value="culture-builder-teamwork" class="archetype-radio">
              <span>Teamwork</span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="training.js"></script>
</body>
</html>
