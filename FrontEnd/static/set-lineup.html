<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Tag Manager (production only) -->
  <script src="/js/shared/gtm-loader.js"></script>
  <!-- End Google Tag Manager -->
  <script src="/js/shared/authGuard.js"></script>
  <script src="/js/shared/sentryInit.js"></script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Set Lineup</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/tournament.css" />
  <link rel="stylesheet" href="/set-lineup.css" />
  <script src="/js/shared/pageLoadOverlay.js"></script>
</head>
<body>
  <!-- Page load overlay: hides stale/incomplete lineup until data and UI are ready -->
  <div id="page-load-overlay" role="status" aria-live="polite" aria-busy="true" style="position:fixed;inset:0;z-index:999999;background:rgba(0,0,0,0.92);display:flex;align-items:center;justify-content:center;margin:0;padding:0;">
    <img src="/images/loader1.gif" alt="Loading…" style="width:240px;height:auto;max-width:90vw;">
  </div>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K69GQK3D"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div id="team-header">
    <img id="team-logo" alt="team logo" hidden>
    <h1 id="team-title" style="font-family: 'Bebas Neue', sans-serif;"></h1>
    
    <!-- View Toggle -->
    <div class="view-toggle">
      <button class="view-toggle-btn active" data-view="grid">Grid View</button>
      <button class="view-toggle-btn" data-view="player">Player View</button>
    </div>
  </div>
  
  <div id="lineup-container">
    <div id="lineup-main">
      <!-- Header Row -->
      <div class="lineup-header">
        <div class="header-pos">POS</div>
        <div class="header-image"></div>
        <div class="header-name">NAME</div>
        <div class="header-rating">POS RATING</div>
        <div class="header-points">POINTS</div>
        <div class="header-rebounds">REBOUNDS</div>
        <div class="header-assists">ASSISTS</div>
        <div class="header-def-pct">DEF %</div>
        <div class="header-emotion">EMOTION</div>
        <div class="header-momentum">MOMENTUM</div>
        <div class="header-fouls">FOULS</div>
        <div class="header-energy">ENERGY</div>
      </div>
      
      <!-- Lineup Slots -->
      <div class="rim-runner-picker" style="margin:10px 0;padding:8px 12px;background:rgba(0,0,0,0.2);border-radius:8px;max-width:520px;">
        <label for="rim-runner-select" style="display:block;font-weight:600;margin-bottom:6px;">Rim Runner <span style="font-weight:400;opacity:0.85;">(optional — default: closest to basket)</span></label>
        <select id="rim-runner-select" style="min-width:280px;padding:6px 8px;">
          <option value="">Auto (closest to basket)</option>
        </select>
      </div>
      <ul id="slots">
        <li class="slot" data-pos="PG">
          <div class="slot-pos">PG</div>
          <div class="slot-content"></div>
          <button class="remove" hidden>✕</button>
        </li>
        <li class="slot" data-pos="SG">
          <div class="slot-pos">SG</div>
          <div class="slot-content"></div>
          <button class="remove" hidden>✕</button>
        </li>
        <li class="slot" data-pos="SF">
          <div class="slot-pos">SF</div>
          <div class="slot-content"></div>
          <button class="remove" hidden>✕</button>
        </li>
        <li class="slot" data-pos="PF">
          <div class="slot-pos">PF</div>
          <div class="slot-content"></div>
          <button class="remove" hidden>✕</button>
        </li>
        <li class="slot" data-pos="C">
          <div class="slot-pos">C</div>
          <div class="slot-content"></div>
          <button class="remove" hidden>✕</button>
        </li>
      </ul>
    </div>
    
    <!-- Buttons (Vertically Stacked) -->
    <div id="lineup-buttons">
      <button id="play-now" class="lineup-btn disabled">PLAY GAME</button>
      <button id="autoset-lineup" class="lineup-btn">AUTOSET LINEUP</button>
      <button id="gameplan-optional" class="lineup-btn">GAME PLAN</button>
      <button id="playbooks-button" class="lineup-btn">PLAYBOOKS</button>
      <button id="box-score-button" class="lineup-btn">BOX SCORE</button>
    </div>
  </div>
  <!-- Grid View -->
  <div id="roster-table-container" class="view-content active">
    <table class="roster-table">
      <thead>
        <tr>
          <th>Player Name</th>
          <th>Pos</th>
          <th>HT</th>
          <th>WT</th>
          <th>SC</th>
          <th>SH</th>
          <th>ID</th>
          <th>OD</th>
          <th>PS</th>
          <th>BH</th>
          <th>RB</th>
          <th>ST</th>
          <th>AG</th>
          <th>ND</th>
          <th>IQ</th>
          <th>FT</th>
          <th>NG</th>
          <th class="rt">RT</th>
        </tr>
      </thead>
      <tbody id="roster-body"></tbody>
    </table>
    <p class="pos-note"><em>*Pos represents the player's highest rated position. Players can play any position.</em></p>
  </div>

  <!-- Player View -->
  <div id="player-view-container" class="view-content">
    <div class="players-grid"></div>
  </div>

  <div id="toast" hidden></div>
  <script src="/common.js"></script>
  <script src="/js/shared/timeoutNavigationHelper.js"></script>
  <script src="/js/shared/attributeTooltips.js"></script>
  <script src="/js/config/api-config.js"></script>
  <script src="/js/shared/accessDenied.js"></script>
  <!-- ✅ PHASE 1.3: Load state telemetry before set-lineup.js -->
  <script src="/js/shared/stateTelemetry.js"></script>
  <!-- ✅ PHASE 2: Load pointer validation before set-lineup.js -->
  <script src="/js/shared/pointerValidation.js"></script>
  <script src="/set-lineup.js?v=__BUILD_TS__"></script>
</body>
</html>
