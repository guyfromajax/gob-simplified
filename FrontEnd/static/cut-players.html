<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/shared/authGuard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Cut Players</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/franchise-command-center.css">
  <link rel="stylesheet" href="/resource-pages.css">
  <link rel="stylesheet" href="/cut-players.css">
</head>
<body>
  <div class="resource-page-container cut-players-page">
    <div class="cut-players-header">
      <button id="back-btn" class="recruiting-back-btn" type="button">Back To Locker Room</button>
      <button id="submit-btn" class="recruiting-btn is-dead" type="button" disabled>Submit Cuts</button>
    </div>

    <div class="recruiting-section">
      <h1>Cut Players</h1>
      <p id="cut-status" class="recruiting-status-text"></p>
      <div class="scroll-x">
        <table class="roster-table" id="cut-players-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>POS</th>
              <th>Year</th>
              <th>Height</th>
              <th>Weight</th>
              <th>SC</th>
              <th>SH</th>
              <th>ID</th>
              <th>OD</th>
              <th>PS</th>
              <th>BH</th>
              <th>RB</th>
              <th>AG</th>
              <th>ST</th>
              <th>ND</th>
              <th>IQ</th>
              <th>FT</th>
              <th>RT</th>
              <th>Players To Cut</th>
            </tr>
          </thead>
          <tbody id="cut-players-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="cut-modal-backdrop" class="fcc-modal-overlay" style="display:none;">
    <div class="fcc-modal-card" role="dialog" aria-modal="true" aria-labelledby="cut-modal-title">
      <h3 id="cut-modal-title" class="fcc-modal-title">Cut Players</h3>
      <p id="cut-modal-message" class="fcc-modal-copy"></p>
      <div id="cut-modal-actions" class="fcc-modal-actions"></div>
    </div>
  </div>

  <script src="/js/config/api-config.js"></script>
  <script src="/common.js"></script>
  <script src="/cut-players.js"></script>
</body>
</html>
