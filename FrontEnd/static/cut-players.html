<!DOCTYPE html>
<html lang="en" class="gob">
<head>
  <link rel="stylesheet" href="/fonts/app-fonts.css">
  <script src="/js/shared/franchiseContext.js"></script>
  <script src="/js/shared/gobNav.js"></script>
  <script src="/js/shared/authGuard.js"></script>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Assign Practice Squad</title>
  <link rel="stylesheet" href="/css/gob-tokens.css">
  <link rel="stylesheet" href="/css/gob-buttons.css">
  <link rel="stylesheet" href="/resource-pages.css">
  <link rel="stylesheet" href="/cut-players.css">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/rt-buckets.css">
</head>
<body class="cut-players-page">
  <div id="cut-players-view">
  <div class="resource-page-container cut-players-shell">
    <div class="gob-page-header cut-players-header">
      <button id="back-btn" class="brand-back-link" type="button">Back To Locker Room</button>
      <h1>Assign Practice Squad</h1>
      <div class="gob-page-header-actions">
        <p id="cut-submit-reason" class="gob-page-status cut-submit-reason" hidden></p>
        <button id="submit-btn" class="gob-btn gob-btn--action is-dead" type="button" data-sfx="SFX_COMMIT" disabled>Assign Practice Squad</button>
      </div>
    </div>

    <section class="gob-page-panel cut-players-section">
      <p id="cut-status" class="gob-page-status"></p>
      <div class="gob-data-grid-shell">
        <div class="gob-data-grid-scroll scroll-x">
        <table class="gob-data-grid" id="cut-players-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>POS</th>
              <th>Year</th>
              <th>Height</th>
              <th class="wt">Weight</th>
              <!-- Six attribute pairs, the roster's order (Styleguide, Tables). -->
              <th class="gstart"><span class="ak">SC</span></th>
              <th class="gend"><span class="ak">SH</span></th>
              <th class="gstart"><span class="ak">ID</span></th>
              <th class="gend"><span class="ak">OD</span></th>
              <th class="gstart"><span class="ak">PS</span></th>
              <th class="gend"><span class="ak">BH</span></th>
              <th class="gstart"><span class="ak">RB</span></th>
              <th class="gend"><span class="ak">ST</span></th>
              <th class="gstart"><span class="ak">AG</span></th>
              <th class="gend"><span class="ak">ND</span></th>
              <th class="gstart"><span class="ak">IQ</span></th>
              <th class="gend"><span class="ak">FT</span></th>
              <th>RT</th>
              <th>To Practice Squad</th>
            </tr>
          </thead>
          <tbody id="cut-players-body"></tbody>
        </table>
      </div>
      </div>
    </section>
  </div>
  </div>

  <div id="cut-modal-backdrop" class="gob-modal-overlay" aria-hidden="true">
    <div class="gob-modal-backdrop"></div>
    <div class="gob-modal-box" role="dialog" aria-modal="true" aria-labelledby="cut-modal-title">
      <div id="cut-modal-accent" class="gob-modal-accent is-neutral"></div>
      <div class="gob-modal-body">
        <h3 id="cut-modal-title" class="gob-modal-title">Assign Practice Squad</h3>
        <p id="cut-modal-message" class="gob-modal-subtitle"></p>
      </div>
      <div id="cut-modal-pulse" class="cut-modal-pulse" aria-hidden="true" hidden>
        <div class="cut-modal-pulse-indicator" aria-hidden="true"><span></span></div>
      </div>
      <div id="cut-modal-actions" class="gob-modal-actions"></div>
    </div>
  </div>

  <script src="/js/config/api-config.js"></script>
  <script src="/js/shared/rtBucket.js"></script>
  <script src="/common.js"></script>
  <script src="/js/shared/attributeTooltips.js"></script>
  <script src="/js/shared/playerYear.js"></script>
  <script src="/js/utils/attributeDisplay.js"></script>
  <script src="/cut-players.js"></script>
</body>
</html>
