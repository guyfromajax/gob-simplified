<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-K69GQK3D');</script>
  <!-- End Google Tag Manager -->
  <script src="/js/shared/authGuard.js"></script>
  <script src="/js/shared/sentryInit.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coaching Grid - GOB</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
  <link rel="stylesheet" href="coaching-grid.css">
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K69GQK3D"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="coaching-grid-container">
    <h1 class="page-title">Coaching Grid</h1>
    
    <div class="grid-wrapper">
      <!-- Axis Labels -->
      <div class="axis-label axis-label-top">Embedded</div>
      <div class="axis-label axis-label-bottom">Fragile</div>
      <div class="axis-label axis-label-left">Stagnant</div>
      <div class="axis-label axis-label-right">Compounding</div>
      
      <!-- Grid Container -->
      <div class="grid-container" id="grid-container">
        <!-- Crosshair lines -->
        <div class="axis-line axis-vertical"></div>
        <div class="axis-line axis-horizontal"></div>
        
        <!-- Archetype Dots -->
        <div class="archetype-dot" 
             data-archetype="authoritarian" 
             data-effectiveness="24" 
             data-momentum="0"
             style="--dot-color: var(--color-authoritarian);">
          <span class="dot-label">Authoritarian</span>
        </div>
        
        <div class="archetype-dot" 
             data-archetype="systems" 
             data-effectiveness="92" 
             data-momentum="5"
             style="--dot-color: var(--color-systems-coach);">
          <span class="dot-label">Systems</span>
        </div>
        
        <div class="archetype-dot" 
             data-archetype="player-maximizer" 
             data-effectiveness="35" 
             data-momentum="9"
             style="--dot-color: var(--color-player-maximizer);">
          <span class="dot-label">Player Maximizer</span>
        </div>
        
        <div class="archetype-dot" 
             data-archetype="culture" 
             data-effectiveness="50" 
             data-momentum="3"
             style="--dot-color: var(--color-culture-builder);">
          <span class="dot-label">Culture</span>
        </div>
      </div>
    </div>
  </div>

  <script src="coaching-grid.js"></script>
</body>
</html>
