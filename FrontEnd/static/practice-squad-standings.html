<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/shared/authGuard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Practice Squad Standings</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/franchise-command-center.css">
  <link rel="stylesheet" href="/resource-pages.css">
  <style>
    .ps-page-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-bottom: 16px;
    }

    .ps-page-header .brand-back-link {
      justify-self: start;
    }

    .ps-page-title {
      margin: 0 !important;
      text-align: center;
    }

    .ps-top-links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .ps-standings-layout {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 32px;
    }

    .ps-standings-layout .fcc-standings-card {
      flex: none;
      max-width: 100%;
      width: 100%;
    }

    .ps-standings-layout .fcc-standings-row {
      grid-template-columns: minmax(180px, 2fr) 44px 44px 58px;
    }

    .ps-standings-layout .fcc-standings-col-team a {
      color: #4a90e2;
      text-decoration: none;
    }

    .ps-standings-layout .fcc-standings-col-team a:hover {
      text-decoration: underline;
    }

    .ps-schedule-title {
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.06em;
      font-size: 1.4rem;
      margin: 0 0 12px;
    }

    .ps-schedule-week {
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .ps-schedule-week summary {
      cursor: pointer;
      padding: 10px 14px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
    }

    .ps-schedule-game {
      padding: 8px 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 14px;
    }

    .ps-schedule-game a {
      color: #8cb4ff;
      margin-left: 8px;
    }
  </style>
  <link rel="stylesheet" href="/css/fonts.css">
</head>
<body class="fcc-brand-page">
  <div class="resource-page-container fcc-brand-page-shell">
    <div class="ps-page-header">
      <a id="back-btn" class="brand-back-link" href="#">Back</a>
      <h1 class="resource-page-title ps-page-title">Practice Squad Standings</h1>
      <div></div>
    </div>
    <div class="ps-top-links">
      <a id="ps-bracket-link" class="fcc-standings-full-link" href="#" style="display:none;">Tournament Brackets</a>
    </div>
    <div id="ps-standings-root" class="ps-standings-layout"></div>
    <h2 class="ps-schedule-title">Schedule</h2>
    <div id="ps-schedule-root"></div>
  </div>
  <script src="/js/config/api-config.js"></script>
  <script src="/common.js"></script>
  <script src="/practice-squad-standings.js"></script>
</body>
</html>
