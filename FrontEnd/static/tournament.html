<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Mode Command Center</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/tournament.css">
</head>
<body>

  <div id="tournament-container">

  <div id="tournament-top">
    <div id="top-left">
      <img id="user-team-logo" src="" alt="Team Logo" class="team-logo">
      <div class="left-info">
        <span class="username">Username</span>
      </div>
    </div>

    <div id="top-center">
      <div class="chemistry-label">Team Chemistry</div>
      <div class="chemistry-bar">14 / 25</div>
      <div class="team-stats">
        <div>Offense: A</div>
        <div>Athleticism: B+</div>
        <div>Prestige: A+</div>
        <div>Defense: B</div>
        <div>Intangibles: C</div>
        <div>Seed: 1</div>
      </div>
    </div>

      <div id="top-right" class="right-controls">
        <div id="top-right-coach1" class="coach-info">
          <img id="coach-sammy" src="" alt="Coach Sammy" class="coach-img">
          <div class="coach-bonus">+SH / +SC</div>
        </div>
        <div id="top-right-coach2" class="coach-info">
          <img id="coach-duke" src="" alt="Coach Duke" class="coach-img">
          <div class="coach-bonus">+ID / +OD</div>
        </div>
        <div class="play-now-container" style="margin-left: auto;">
          <button id="play-now" class="play-now-btn">
            <span class="play-now-main">Play Next Game</span>
            <span id="play-now-opponent" class="play-now-opponent"></span>
          </button>
          <button id="set-gameplan-tournament" class="gameplan-btn" style="background: #4a90e2; color: white; padding: 8px 16px; margin-top: 8px; border-radius: 4px; border: none; cursor: pointer; font-size: 14px;">Set Game Plan</button>
          <button id="sim-remaining" class="play-now-btn" style="display: none;">Sim Remaining Games</button>
        </div>
        <button id="exit-tournament" class="play-now-btn" style="display: none; margin-left: auto;">Exit</button>
      </div>
  </div>

  <div id="tournament-tabs">
    <div class="tab-buttons">
      <button data-tab="bracket-tab" class="active">Bracket</button>
      <button data-tab="team-tab">Team</button>
      <button data-tab="leaders-tab">Leaders</button>
    </div>
    <div id="bracket-tab" class="tab-content active">
      <div class="scroll-x">
        <div id="bracket" class="bracket">
        </div>
      </div>
    </div>
    <div id="team-tab" class="tab-content">
      <div class="scroll-x">
        <table class="roster-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>POS</th>
              <th>Year</th>
              <th>Height</th>
              <th>Weight</th>
              <th>SC</th>
              <th>SH</th>
              <th>ID</th>
              <th>OD</th>
              <th>PS</th>
              <th>BH</th>
              <th>RB</th>
              <th>AG</th>
              <th>ST</th>
              <th>ND</th>
              <th>IQ</th>
              <th>FT</th>
              <th>RT</th>
            </tr>
          </thead>
          <tbody id="roster-body"></tbody>
        </table>
      </div>

      <div class="scroll-x" style="margin-top: 20px;">
        <table class="stats-table">
          <thead>
            <tr>
              <th>Player</th>
              <th>PTS</th>
              <th>FGM/FGA</th>
              <th>3PTM/3PTA</th>
              <th>FTM/FTA</th>
              <th>REB</th>
              <th>AST</th>
              <th>STL</th>
              <th>BLK</th>
              <th>F</th>
              <th>MIN</th>
              <th>TO</th>
            </tr>
          </thead>
          <tbody id="stats-body"></tbody>
        </table>
      </div>
    </div>
    <div id="leaders-tab" class="tab-content">
      <div id="leaderboards"></div>
    </div>
  </div>

  </div> <!-- end tournament-container -->

  <script src="/static/common.js"></script>
  <script src="/static/tournament.js"></script>
  <script>
    const tabButtons = document.querySelectorAll('.tab-buttons button');
    const tabContents = document.querySelectorAll('.tab-content');
    tabButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        tabButtons.forEach(b => b.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        const target = document.getElementById(btn.dataset.tab);
        if (target) target.classList.add('active');
      });
    });
  </script>

</body>
</html>
