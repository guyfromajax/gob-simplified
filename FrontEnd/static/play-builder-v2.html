    function handleDrop(newLocation) {
      if (!draggedPlayer || !newLocation) return;
      
      // Check if we're in review mode and user is making a change
      checkForDivergence();
      
      // Check if location is occupied
      const occupyingPlayer = findPlayerAtLocation(newLocation);
      
      console.log('handleDrop:', {
        draggedPlayer,
        newLocation,
        occupyingPlayer,
        currentAssignments: currentStepAssignments
      });
      
      // Update assignment FIRST (before checking offsets)
      if (!currentStepAssignments[draggedPlayer]) {
        currentStepAssignments[draggedPlayer] = {};
      }
      currentStepAssignments[draggedPlayer].location = newLocation;
      
      if (occupyingPlayer && occupyingPlayer !== draggedPlayer) {
        // Location occupied - mark for offset positioning
        positionOffsets[draggedPlayer] = true;
        newOffsets[draggedPlayer] = true; // Mark as NEW offset (created this step)
        console.log(`✓ Setting offset for ${draggedPlayer} at ${newLocation} (occupied by ${occupyingPlayer})`, positionOffsets);
      } else {
        // Clear offset for this player
        delete positionOffsets[draggedPlayer];
        delete newOffsets[draggedPlayer];
        console.log(`✗ Clearing offset for ${draggedPlayer} (location free at ${newLocation})`);
      }
      
      // If dragged player was occupying a spot, check if anyone was waiting
      // (Now that location is updated, checkAndResolveOffsets won't find this player at the old location)
      if (draggedPlayerOriginalLocation) {
        checkAndResolveOffsets(draggedPlayerOriginalLocation);
      }
      
      // Rule 4: Auto-assign cut if player moved (not offset, not ball handler)
      const isOffset = positionOffsets[draggedPlayer];
      const prevLocation = draggedPlayerOriginalLocation;
      const movedLocation = newLocation !== prevLocation;
      
      console.log(`Rule 4 check:`, { 
        draggedPlayer, 
        movedLocation, 
        isOffset, 
        currentBallHandler, 
        positionOffsets 
      });
      
      if (movedLocation && !isOffset && draggedPlayer !== currentBallHandler) {
        currentStepAssignments[draggedPlayer].action = 'cut';
        console.log(`Auto-assigned ${draggedPlayer}: cut (dragged to ${newLocation})`);
        
        // Update visualization without inline dropdown
        renderPositionDashboard();
        renderCourtVisualization();
        validateActionButton();
      } else {
        // Show inline action dropdown for manual selection
        console.log('Showing inline dropdown, position offsets:', positionOffsets);
        
        // Update visualization
        renderCourtVisualization();
        
        // Show inline action dropdown
        showInlineActionDropdown(draggedPlayer, newLocation);
      }
    }

    function findPlayerAtLocation(location) {
      // Find any player currently at this location by checking currentStepAssignments
      console.log(`findPlayerAtLocation(${location}), currentStepAssignments:`, currentStepAssignments);
      
      for (const pos of POSITIONS) {
        if (pos === draggedPlayer) continue; // Skip the player being dragged
        
        const assignment = currentStepAssignments[pos];
        console.log(`  Checking ${pos}:`, assignment);
        
        if (assignment && assignment.location === location) {
          console.log(`✓ Found player ${pos} at ${location}`);
          return pos;
        }
      }
      
      console.log(`✗ No player found at ${location}`);
      return null;
    }

    function checkAndResolveOffsets(location) {
      console.log(`checkAndResolveOffsets(${location}), positionOffsets:`, positionOffsets);
      // Find first non-screen player with offset at this location
      for (const [pos, assignment] of Object.entries(currentStepAssignments)) {
        if (assignment && assignment.location === location && 
            positionOffsets[pos] && assignment.action !== 'screen') {
          // Move this player to actual position
          console.log(`Clearing offset for ${pos} at ${location}`);
          delete positionOffsets[pos];
          renderCourtVisualization();
          return; // Only move first one
        }
      }
      console.log(`No offsets to resolve at ${location}`);
    }

    function showInlineActionDropdown(player, location) {
      // Remove any existing dropdown
      document.querySelectorAll('.inline-action-dropdown').forEach(d => d.remove());
      
      const container = document.getElementById('player-icons-container');
      const coords = HCO_STRING_SPOTS[location];
      if (!coords) return;
      
      const dropdown = document.createElement('div');
      dropdown.className = 'inline-action-dropdown';
      
      // Position near the player icon (use offset coords if player is offset)
      const isOffset = positionOffsets[player];
      let dropdownX, dropdownY;
      
      if (isOffset) {
        const offsetCoords = OFFSET_SPOTS[location];
        dropdownX = offsetCoords ? offsetCoords.x + 5 : coords.x + 5;
        dropdownY = offsetCoords ? offsetCoords.y : coords.y;
      } else {
        dropdownX = coords.x + 5;
        dropdownY = coords.y;
      }
      
      dropdown.style.left = `${dropdownX}%`;
      dropdown.style.top = `${(50 - dropdownY) * 2}%`;
      
      // Build dropdown HTML
      dropdown.innerHTML = `
        <select id="inline-action-${player}">
          <option value="">-- Select Action --</option>
        </select>
        <button onclick="applyInlineAction('${player}')">Confirm</button>
        <button onclick="cancelInlineAction('${player}')" style="background: rgba(255,255,255,0.2); margin-top: 5px;">Cancel</button>
      `;
      
      container.appendChild(dropdown);
      
      // Populate actions
      const select = dropdown.querySelector('select');
      updateInlineActionOptions(select, player);
    }

    function updateInlineActionOptions(select, player) {
      const ballHandlerAssigned = Object.entries(currentStepAssignments).some(([pos, assignment]) => 
        pos !== player && assignment && assignment.action && BALL_HANDLING_ACTIONS.includes(assignment.action)
      );
      
      // Check if player is at a NEW offset position (Rule 1)
      const isNewOffset = newOffsets[player];
      
      Object.entries(ACTIONS).forEach(([value, label]) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = label;
        
        // Rule 1: If at NEW offset position (created this step), only allow screen or cut
        if (isNewOffset && value !== 'screen' && value !== 'cut') {
          option.disabled = true;
        }
        // Disable ball-handling actions if one is already assigned
        else if (ballHandlerAssigned && BALL_HANDLING_ACTIONS.includes(value)) {
          option.disabled = true;
        }
        
        select.appendChild(option);
      });
    }

    function applyInlineAction(player) {
      const select = document.getElementById(`inline-action-${player}`);
      const action = select.value;
      
      if (!action) {
        alert('Please select an action');
        return;
      }
      
      // Check for divergence before applying action
      checkForDivergence();
      
      // Apply action
      currentStepAssignments[player].action = action;
      
      // Remove dropdown
      document.querySelectorAll('.inline-action-dropdown').forEach(d => d.remove());
      
      // Update visualization
      renderPositionDashboard();
      renderCourtVisualization();
      validateActionButton();
    }

    function cancelInlineAction(player) {
      // Remove assignment
      if (currentStepAssignments[player]) {
        delete currentStepAssignments[player].location;
        delete currentStepAssignments[player].action;
        if (Object.keys(currentStepAssignments[player]).length === 0) {
          delete currentStepAssignments[player];
        }
      }
      
      // Clear offset
      delete positionOffsets[player];
      
      // Remove dropdown
      document.querySelectorAll('.inline-action-dropdown').forEach(d => d.remove());
      
      // Update visualization
      renderPositionDashboard();
      renderCourtVisualization();
      validateActionButton();
    }

    function renderPositionDashboard() {
      const dashboard = document.getElementById('position-dashboard');
      
      // Only render if we're in step 2
      if (document.getElementById('step2').classList.contains('hidden')) {
        dashboard.innerHTML = '';
        return;
      }

      dashboard.innerHTML = '';

      // Header row
      const headerRow = document.createElement('div');
      headerRow.className = 'dashboard-row header';
      headerRow.innerHTML = `
        <div>Pos</div>
        <div>Location</div>
        <div>Action</div>
      `;
      dashboard.appendChild(headerRow);

      // Position rows
      POSITIONS.forEach(pos => {
        const row = document.createElement('div');
        row.className = 'dashboard-row';
        row.id = `dashboard-${pos}`;

        // Position label
        const posLabel = document.createElement('div');
        posLabel.className = 'pos-label';
        posLabel.textContent = pos;
        row.appendChild(posLabel);

        // Location dropdown
        const locationSelect = document.createElement('select');
        locationSelect.id = `dashboard-location-${pos}`;
        locationSelect.innerHTML = '<option value="">--</option>';
        LOCATIONS.forEach(loc => {
          const option = document.createElement('option');
          option.value = loc;
          option.textContent = loc;
          locationSelect.appendChild(option);
        });
        
        // Pre-populate location from current or previous step
        const assignment = currentStepAssignments[pos];
        const prevAssignment = previousStepAssignments[pos];
        
        if (assignment && assignment.location) {
          locationSelect.value = assignment.location;
        } else if (playState.currentStep > 1 && prevAssignment && prevAssignment.location) {
          // Step 2+: Pre-populate with previous step's location (just UI, don't modify data)
          locationSelect.value = prevAssignment.location;
        }
        
        // Handle location change
        locationSelect.addEventListener('change', (e) => {
          handleDashboardLocationChange(pos, e.target.value);
        });
        row.appendChild(locationSelect);

        // Action dropdown
        const actionSelect = document.createElement('select');
        actionSelect.id = `dashboard-action-${pos}`;
        actionSelect.innerHTML = '<option value="">--</option>';
        
        // Check if this position is at a NEW offset (Rule 1: only screen or cut allowed)
        const isNewOffset = newOffsets[pos];
        
        Object.entries(ACTIONS).forEach(([value, label]) => {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = label;
          
          // Rule 1: If at NEW offset position (created this step), only allow screen or cut
          if (isNewOffset && value !== 'screen' && value !== 'cut') {
            option.disabled = true;
            option.style.color = 'rgba(255, 255, 255, 0.3)';
          }
          
          actionSelect.appendChild(option);
        });
        
        // Pre-populate action from current step or default for Step 2+
        if (assignment && assignment.action) {
          actionSelect.value = assignment.action;
        } else if (playState.currentStep > 1 && prevAssignment && prevAssignment.location) {
          // Step 2+: Pre-populate with smart defaults (just UI, don't modify data)
          let defaultAction = 'stationary';
          
          // Ball handler gets "handle_ball"
          if (pos === currentBallHandler) {
            defaultAction = 'handle_ball';
          }
          // Players at post positions get "post_up"
          else if (prevAssignment.location === 'upper lowPost' || prevAssignment.location === 'lower lowPost') {
            defaultAction = 'post_up';
          }
          
          actionSelect.value = defaultAction;
        }
        
        // Handle action change
        actionSelect.addEventListener('change', (e) => {
          handleDashboardActionChange(pos, e.target.value);
        });
        row.appendChild(actionSelect);

        dashboard.appendChild(row);
      });
    }

    function handleDashboardLocationChange(pos, newLocation) {
      if (!newLocation) return;

      // Check if we're in review mode and user is making a change
      checkForDivergence();

      // Check if location is occupied
      const occupyingPlayer = findPlayerAtLocation(newLocation);
      
      if (occupyingPlayer && occupyingPlayer !== pos) {
        // Location occupied - mark for offset positioning
        positionOffsets[pos] = true;
        newOffsets[pos] = true; // Mark as NEW offset
      } else {
        // Clear offset for this player
        delete positionOffsets[pos];
        delete newOffsets[pos];
      }
      
      // Update assignment
      if (!currentStepAssignments[pos]) {
        currentStepAssignments[pos] = {};
      }
      currentStepAssignments[pos].location = newLocation;
      
      // Update dashboard and court visualization
      renderPositionDashboard();
      renderCourtVisualization();
      validateActionButton();
    }

    function handleDashboardActionChange(pos, newAction) {
      if (!newAction) return;

      // Check if we're in review mode and user is making a change
      checkForDivergence();

      // Update assignment
      if (!currentStepAssignments[pos]) {
        currentStepAssignments[pos] = {};
      }
      currentStepAssignments[pos].action = newAction;
      
      // Update ball handler if ball-handling action
      if (BALL_HANDLING_ACTIONS.includes(newAction)) {
        currentBallHandler = pos;
      }
      
      // Update court visualization
      renderCourtVisualization();
      validateActionButton();
    }

    function renderCourtVisualization() {
      const container = document.getElementById('player-icons-container');

      // Only render if we're in step 2
      if (document.getElementById('step2').classList.contains('hidden')) {
        container.innerHTML = '';
        return;
      }
      
      // Update dashboard to reflect current state
      POSITIONS.forEach(pos => {
        const locationSelect = document.getElementById(`dashboard-location-${pos}`);
        const actionSelect = document.getElementById(`dashboard-action-${pos}`);
        const assignment = currentStepAssignments[pos];
        
        if (locationSelect && assignment) {
          locationSelect.value = assignment.location || '';
        }
        if (actionSelect && assignment) {
          actionSelect.value = assignment.action || '';
        }
      });

      // Remove old offset indicators
      container.querySelectorAll('.offset-indicator').forEach(ind => ind.remove());

      // Get existing icons to reuse for animation
      const existingIcons = {};
      container.querySelectorAll('.player-icon').forEach(icon => {
        const pos = icon.textContent;
        existingIcons[pos] = icon;
      });

      // Find ball handler for current step
      let ballHandlerPos = null;
      let ballHandlerCoords = null;
      let ballLocation = null; // Could be player location or basket

      // Update or create player icons
      POSITIONS.forEach(pos => {
        const assignment = currentStepAssignments[pos];
        const prevAssignment = previousStepAssignments[pos];
        
        if (assignment && assignment.location) {
          const coords = HCO_STRING_SPOTS[assignment.location];
          if (!coords) return;

          // Apply offset if exists (use OFFSET_SPOTS coordinates)
          const isOffset = positionOffsets[pos];
          let targetLeft, targetTop;
          
          console.log(`Rendering ${pos}:`, {
            location: assignment.location,
            isOffset: isOffset,
            positionOffsets: positionOffsets,
            hasOffsetCoords: !!OFFSET_SPOTS[assignment.location]
          });
          
          if (isOffset) {
            const offsetCoords = OFFSET_SPOTS[assignment.location];
            if (offsetCoords) {
              targetLeft = `${offsetCoords.x}%`;
              targetTop = `${(50 - offsetCoords.y) * 2}%`;
              console.log(`✓ USING OFFSET COORDS for ${pos} at ${assignment.location}`, {
                original: coords,
                offset: offsetCoords,
                targetLeft,
                targetTop
              });
            } else {
              // Fallback if offset coords don't exist
              targetLeft = `${coords.x}%`;
              targetTop = `${(50 - coords.y) * 2}%`;
              console.log(`✗ NO OFFSET_SPOTS for ${assignment.location}, using original`);
            }
          } else {
            targetLeft = `${coords.x}%`;
            targetTop = `${(50 - coords.y) * 2}%`;
          }

          let icon = existingIcons[pos];
          
          if (!icon) {
            // Create new icon
            icon = document.createElement('div');
            icon.className = `player-icon ${pos}`;
            icon.textContent = pos;
            icon.dataset.position = pos;
            icon.dataset.location = assignment.location; // Store location on element
            
            // If there was a previous position, start there for animation
            if (prevAssignment && prevAssignment.location) {
              const prevCoords = HCO_STRING_SPOTS[prevAssignment.location];
              if (prevCoords) {
                icon.style.left = `${prevCoords.x}%`;
                icon.style.top = `${(50 - prevCoords.y) * 2}%`;
              }
            } else {
              icon.style.left = targetLeft;
              icon.style.top = targetTop;
            }
            
            container.appendChild(icon);
            
            // Setup drag handlers
            setupDragHandlers(icon, pos);
            
            // Trigger animation on next frame
            if (prevAssignment && prevAssignment.location) {
              requestAnimationFrame(() => {
                icon.style.left = targetLeft;
                icon.style.top = targetTop;
              });
            }
          } else {
            // Update existing icon position (will animate via CSS transition)
            icon.style.left = targetLeft;
            icon.style.top = targetTop;
            icon.dataset.location = assignment.location; // Update location on element
            delete existingIcons[pos]; // Mark as handled
          }

          // Add offset indicator if offset exists
          if (isOffset) {
            const offsetCoords = OFFSET_SPOTS[assignment.location];
            if (offsetCoords) {
              const indicator = document.createElement('div');
              indicator.className = 'offset-indicator';
              // Line from actual position to offset position
              indicator.style.left = `${coords.x}%`;
              indicator.style.top = `${(50 - coords.y) * 2}%`;
              indicator.style.width = `${Math.abs(offsetCoords.x - coords.x)}%`;
              container.appendChild(indicator);
            }
          }

          // Check if this player has the ball or is shooting/passing
          if (assignment.action) {
            if (BALL_HANDLING_ACTIONS.includes(assignment.action)) {
              ballHandlerPos = pos;
              ballHandlerCoords = { left: targetLeft, top: targetTop };
              currentBallHandler = pos;
              ballLocation = 'player';
            } else if (assignment.action === 'pass') {
              // Ball should go to receiver (will be found later)
              ballLocation = 'in_transit_pass';
            } else if (assignment.action === 'shoot') {
              // Ball should go to basket
              ballLocation = 'basket';
            }
          }
        } else if (existingIcons[pos]) {
          // Position no longer has assignment but icon exists from previous step
          // Keep it visible but mark as handled
          delete existingIcons[pos];
        }
      });

      // Remove icons for positions that no longer exist
      Object.values(existingIcons).forEach(icon => icon.remove());

      // Handle ball sprite positioning
      let ballIcon = container.querySelector('.ball-icon');
      
      // Determine ball position
      let finalBallLeft = null;
      let finalBallTop = null;
      
      if (ballLocation === 'player' && ballHandlerPos && ballHandlerCoords) {
        // Ball with current ball handler
        finalBallLeft = ballHandlerCoords.left;
        finalBallTop = ballHandlerCoords.top;
      } else if (ballLocation === 'in_transit_pass') {
        // Find receiver
        const receiver = Object.entries(currentStepAssignments).find(([pos, assignment]) => 
          assignment && assignment.action === 'receive'
        );
        if (receiver) {
          const [receiverPos, receiverAssignment] = receiver;
          const receiverCoords = HCO_STRING_SPOTS[receiverAssignment.location];
          const receiverOffset = positionOffsets[receiverPos];
          const receiverActualCoords = receiverOffset ? OFFSET_SPOTS[receiverAssignment.location] : receiverCoords;
          
          if (receiverActualCoords) {
            finalBallLeft = `${receiverActualCoords.x}%`;
            finalBallTop = `${(50 - receiverActualCoords.y) * 2}%`;
            currentBallHandler = receiverPos;
          }
        }
      } else if (ballLocation === 'basket') {
        // Ball at basket (rim coordinates from constants)
        const rimCoords = HCO_STRING_SPOTS['key']; // Using key as approximate rim location
        if (rimCoords) {
          finalBallLeft = '90%'; // HOME_RIM_COORDS x = 90
          finalBallTop = '50%'; // HOME_RIM_COORDS y = 25 → (50-25)*2 = 50%
        }
      } else if (currentBallHandler) {
        // No ball-handling action this step, keep ball with previous handler
        // Check current step first, then fall back to previous step
        const handlerAssignment = currentStepAssignments[currentBallHandler] || previousStepAssignments[currentBallHandler];
        
        if (handlerAssignment && handlerAssignment.location) {
          const handlerCoords = HCO_STRING_SPOTS[handlerAssignment.location];
          const handlerOffset = positionOffsets[currentBallHandler];
          const handlerActualCoords = handlerOffset ? OFFSET_SPOTS[handlerAssignment.location] : handlerCoords;
          
          if (handlerActualCoords) {
            finalBallLeft = `${handlerActualCoords.x}%`;
            finalBallTop = `${(50 - handlerActualCoords.y) * 2}%`;
          }
        }
      }
      
      // Render or remove ball
      if (finalBallLeft && finalBallTop) {
        if (!ballIcon) {
          ballIcon = document.createElement('div');
          ballIcon.className = 'ball-icon';
          container.appendChild(ballIcon);
          
          // Setup ball drag handlers
          setupBallDragHandlers(ballIcon);
        }
        ballIcon.style.left = finalBallLeft;
        ballIcon.style.top = finalBallTop;
      } else if (ballIcon) {
        ballIcon.remove();
      }
      
      // Render basket target (always visible when in step 2)
      let basketTarget = container.querySelector('.basket-target');
      if (!basketTarget) {
        basketTarget = document.createElement('div');
        basketTarget.className = 'basket-target';
        basketTarget.style.left = '90%'; // HOME_RIM_COORDS x = 90
        basketTarget.style.top = '50%'; // HOME_RIM_COORDS y = 25 → (50-25)*2 = 50%
        container.appendChild(basketTarget);
        
        // Setup basket drop handlers
        setupBasketDropHandlers(basketTarget);
      }
    }

    function setupBasketDropHandlers(basketTarget) {
      basketTarget.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.stopPropagation();
        
        // Only accept ball drags, not player drags
        if (ballDragActive) {
          e.dataTransfer.dropEffect = 'move';
          ballDragToBasket = true;
          basketTarget.classList.add('drag-hover');
          console.log('Ball over basket - ballDragToBasket set to true');
        } else {
          e.dataTransfer.dropEffect = 'none';
        }
      });

      basketTarget.addEventListener('dragleave', (e) => {
        console.log('Ball left basket area');
        basketTarget.classList.remove('drag-hover');
        ballDragToBasket = false;
      });

      basketTarget.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        console.log('Drop event on basket');
        basketTarget.classList.remove('drag-hover');
        
        if (ballDragActive && currentBallHandler) {
          handleBallShoot(currentBallHandler);
        }
      });
    }

    function handleBallShoot(shooter) {
      console.log(`Ball shoot by: ${shooter}`);
      
      // Check for divergence before assigning shoot
      checkForDivergence();
      
      // Assign Shoot action to shooter
      if (currentStepAssignments[shooter] && currentStepAssignments[shooter].location) {
        currentStepAssignments[shooter].action = 'shoot';
      } else if (previousStepAssignments[shooter] && previousStepAssignments[shooter].location) {
        // Shooter hasn't been moved yet, use previous location
        currentStepAssignments[shooter] = {
          location: previousStepAssignments[shooter].location,
          action: 'shoot'
        };
      }
      
      console.log('Shoot assigned to', shooter, currentStepAssignments[shooter]);
      
      // Update visualization (this will move ball to basket)
      renderPositionDashboard();
      renderCourtVisualization();
      validateActionButton();
    }

    function setupBallDragHandlers(ballIcon) {
      ballIcon.draggable = true;
      
      ballIcon.addEventListener('dragstart', (e) => {
        ballDragActive = true;
        ballIcon.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        console.log('Ball drag started from:', currentBallHandler);
      });

      ballIcon.addEventListener('dragend', (e) => {
        ballIcon.classList.remove('dragging');
        
        // Clear any hover effects
        document.querySelectorAll('.player-icon.drag-hover').forEach(i => i.classList.remove('drag-hover'));
        document.querySelectorAll('.basket-target.drag-hover').forEach(b => b.classList.remove('drag-hover'));
        
        console.log('Ball drag ended - target:', ballDragTarget, 'toBasket:', ballDragToBasket);
        
        if (ballDragToBasket && currentBallHandler) {
          // Ball dragged to basket - assign shoot
          handleBallShoot(currentBallHandler);
        } else if (ballDragTarget && currentBallHandler && ballDragTarget !== currentBallHandler) {
          // Ball dragged to player - assign pass/receive
          handleBallPass(currentBallHandler, ballDragTarget);
        }
        
        ballDragActive = false;
        ballDragTarget = null;
        ballDragToBasket = false;
      });
    }

    function handleBallPass(passer, receiver) {
      console.log(`Ball pass: ${passer} → ${receiver}`);
      
      // Check for divergence before assigning pass
      checkForDivergence();
      
      // Assign Pass action to passer (if they have a location)
      if (currentStepAssignments[passer] && currentStepAssignments[passer].location) {
        currentStepAssignments[passer].action = 'pass';
      } else if (previousStepAssignments[passer] && previousStepAssignments[passer].location) {
        // Passer hasn't been moved yet, use previous location
        currentStepAssignments[passer] = {
          location: previousStepAssignments[passer].location,
          action: 'pass'
        };
      }
      
      // Assign Receive action to receiver (if they have a location)
      if (currentStepAssignments[receiver] && currentStepAssignments[receiver].location) {
        currentStepAssignments[receiver].action = 'receive';
      } else if (previousStepAssignments[receiver] && previousStepAssignments[receiver].location) {
        // Receiver hasn't been moved yet, use previous location
        currentStepAssignments[receiver] = {
          location: previousStepAssignments[receiver].location,
          action: 'receive'
        };
      }
      
      // Update ball handler
      currentBallHandler = receiver;
      
      // Update visualization
      renderPositionDashboard();
      renderCourtVisualization();
      validateActionButton();
    }

    function validateStep1() {
      const name = document.getElementById('play-name').value.trim();
      const type = document.getElementById('play-type').value;
      const playFocusSelect = document.getElementById('play-focus');
      const focus = playFocusSelect.disabled ? '' : playFocusSelect.value; // Only read focus if dropdown is enabled

      const submitBtn = document.getElementById('submit-play-btn');
      
      // For Set Play, require focus. For Motion, don't require focus
      if (type === 'Set Play') {
        submitBtn.disabled = !(name && type && focus);
      } else if (type === 'Motion') {
        // Motion plays don't require focus - only name and type
        submitBtn.disabled = !(name && type);
      } else {
        // No play type selected yet
        submitBtn.disabled = true;
      }
    }

    function submitPlay() {
      playState.name = document.getElementById('play-name').value.trim();
      playState.type = document.getElementById('play-type').value;
      playState.focus = document.getElementById('play-focus').value;
      playState.playId = null;
      
      // Initialize variants based on play type
      if (playState.type === 'Motion') {
        // Motion: only base_loop
        playState.variants.base_loop = {
          steps: [],
          complete: false,
          currentStep: 1
        };
        currentVariant = 'base_loop';
      } else {
        // Set Play: all variants
        ['successful', 'mid_play_change', 'contested', 'broken'].forEach(variant => {
          playState.variants[variant] = {
            steps: [],
            complete: false,
            currentStep: 1
          };
        });
        currentVariant = 'successful';
      }
      
      // Update variant tabs visibility
      updateVariantTabsVisibility();
      
      // Update variant tabs status
      updateVariantTabs();
      
      // Switch to the appropriate variant
      switchVariant(currentVariant);
      
      // Update page title
      const pageTitle = document.getElementById('page-title');
      pageTitle.textContent = 'Building Step 1';
      pageTitle.classList.add('step2-title');
      
      // Show step 2, hide step 1
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
      
      // Show back button
      showBackButton();
      
      // Update summary
      let summaryText = `${playState.name} | ${playState.type}`;
      if (playState.focus) {
        summaryText += ` | ${playState.focus}`;
      }
      document.getElementById('play-summary').textContent = summaryText;

      // Reset current step assignments
      currentStepAssignments = {};
      previousStepAssignments = {};
      selectedPosition = null;
      currentFormation = null;
      positionOffsets = {};
      newOffsets = {};
      currentBallHandler = null; // Reset ball handler for new play
      
      // Show formation selection, hide build buttons
      document.getElementById('formation-selection').classList.remove('hidden');
      document.getElementById('build-buttons').classList.add('hidden');
      document.getElementById('formation-select').value = '';
      
      // Update variant tabs
      updateVariantTabs();
      updateVariantInfo();

      const animSection = document.getElementById('animation-preview-section');
      if (animSection) {
        animSection.style.display = 'block';
        updateAnimationVariantDropdown();
      }
      
      // Initialize dashboard and court
      renderPositionDashboard();
      renderCourtVisualization();
      
      // Update final step checkbox visibility

    }



    function validateActionButton() {
      const actionBtn = document.getElementById('action-btn');
      const completeVariantBtn = document.getElementById('complete-variant-btn');
      
      // If buttons don't exist (e.g., during animation or when variant is complete), skip validation
      if (!actionBtn || !completeVariantBtn) {
        return;
      }
      
      // Check if any player has shoot action (final step for Set Play only)
      // NOTE: "drive" is NOT a turn-ender - only "shoot" is
      let hasShoot = false;
      for (const pos of POSITIONS) {
        const assignment = currentStepAssignments[pos];
        if (assignment && assignment.action === 'shoot') {
          hasShoot = true;
          break;
        }
      }
      
      // Check if all positions are complete
      let allComplete = true;
      for (const pos of POSITIONS) {
        const assignment = currentStepAssignments[pos];
        if (!assignment || !assignment.location || !assignment.action) {
          allComplete = false;
          break;
        }
      }

      // For Set Play: shoot = final step
      // For Motion: shoot can be at any step, no special handling
      if (playState.type === 'Set Play' && hasShoot) {
        // Shot assigned - this is the final step (Set Play only)
        actionBtn.disabled = true;
        actionBtn.textContent = 'Shot = Final Step';
        completeVariantBtn.disabled = false;
        completeVariantBtn.style.opacity = '1';
        completeVariantBtn.style.boxShadow = '0 0 20px rgba(255, 140, 0, 0.6)';
      } else if (allComplete) {
        // All positions complete - ready to add step
        actionBtn.textContent = 'Add Step';
        actionBtn.disabled = false;
        completeVariantBtn.disabled = false;
        completeVariantBtn.style.opacity = '1';
        completeVariantBtn.style.boxShadow = 'none';
      } else {
        // Still building step
        actionBtn.textContent = 'Add Step (Incomplete)';
        actionBtn.disabled = true;
        completeVariantBtn.disabled = false;
        completeVariantBtn.style.opacity = '1';
        completeVariantBtn.style.boxShadow = 'none';
      }
    }

    function handleActionButton() {
      const actionBtn = document.getElementById('action-btn');
      
      // Only submit step if all positions are complete
      if (actionBtn.textContent === 'Add Step') {
        submitStep();
      }
    }

    function autoAssignActions() {
      // Auto-assign actions for players based on rules
      if (playState.currentStep <= 1) return; // Only for step 2+
      
      POSITIONS.forEach(pos => {
        const currentAssignment = currentStepAssignments[pos];
        const prevAssignment = previousStepAssignments[pos];
        
        // Skip if already has action assigned
        if (currentAssignment && currentAssignment.action) return;
        
        // Player hasn't been updated this step
        if (!currentAssignment || !currentAssignment.location) {
          if (prevAssignment && prevAssignment.location) {
            // Rule 2: Player not updated
            let autoAction = 'stationary';
            
            // Exception: Previous ball handler keeps ball
            if (BALL_HANDLING_ACTIONS.includes(prevAssignment.action)) {
              autoAction = 'handle_ball';
            }
            // Exception: Post positions auto post up
            else if (prevAssignment.location === 'lower lowPost' || prevAssignment.location === 'upper lowPost') {
              autoAction = 'post_up';
            }
            
            currentStepAssignments[pos] = {
              location: prevAssignment.location,
              action: autoAction
            };
            
            console.log(`Auto-assigned ${pos}: ${autoAction} (no movement)`);
          }
        } else if (currentAssignment.location && !currentAssignment.action) {
          // Player moved but no action yet
          const movedLocation = currentAssignment.location !== (prevAssignment?.location);
          const isOffset = positionOffsets[pos];
          
          // Rule 4: Player moved to new spot (not offset, not ball handler)
          if (movedLocation && !isOffset && pos !== currentBallHandler) {
            currentAssignment.action = 'cut';
            console.log(`Auto-assigned ${pos}: cut (moved to ${currentAssignment.location})`);
          }
          // Rule 3: Previous ball handler moved
          else if (prevAssignment && BALL_HANDLING_ACTIONS.includes(prevAssignment.action)) {
            currentAssignment.action = 'handle_ball';
            console.log(`Auto-assigned ${pos}: handle_ball (previous ball handler)`);
          }
        }
      });
    }


    // ✅ AUTO-OPPOSITE: Helper function to flip upper/lower in location strings
    function flipLocation(location) {
      if (!location || typeof location !== 'string') {
        return location;
      }
      
      // Flip upper to lower (case-insensitive, preserve original case)
      if (location.toLowerCase().includes('upper')) {
        if (location.includes('upper')) {
          return location.replace('upper', 'lower');
        } else if (location.includes('Upper')) {
          return location.replace('Upper', 'Lower');
        } else if (location.includes('UPPER')) {
          return location.replace('UPPER', 'LOWER');
        }
      }
      
      // Flip lower to upper
      if (location.toLowerCase().includes('lower')) {
        if (location.includes('lower')) {
          return location.replace('lower', 'upper');
        } else if (location.includes('Lower')) {
          return location.replace('Lower', 'Upper');
        } else if (location.includes('LOWER')) {
          return location.replace('LOWER', 'UPPER');
        }
      }
      
      // No upper/lower found, return unchanged
      return location;
    }

    // ✅ AUTO-OPPOSITE: Create opposite version of steps by flipping upper/lower locations
    function createOppositeSteps(steps) {
      return steps.map(step => {
        const oppositeStep = JSON.parse(JSON.stringify(step)); // Deep clone
        
        // Flip locations in pos_actions
        if (oppositeStep.pos_actions) {
          for (const position in oppositeStep.pos_actions) {
            const actionInfo = oppositeStep.pos_actions[position];
            if (actionInfo && actionInfo.location) {
              actionInfo.location = flipLocation(actionInfo.location);
            }
          }
        }
        
        return oppositeStep;
      });
    }

    // ✅ AUTO-OPPOSITE: Create opposite version when skeleton is marked as complete
    function createOppositeVersionIfNeeded(variantData) {
      // Check if we need to create opposite version
      const steps = variantData.steps || [];
      if (steps.length === 0) {
        return; // No steps to create opposite from
      }
      
      // Check if opposite already exists (don't create duplicate)
      if (currentVariant === 'base_loop' || currentVariant === 'successful') {
        const variant = playState.variants[currentVariant];
        if (variant.versions && Array.isArray(variant.versions)) {
          // Check if v1 (opposite) already exists
          const hasV1 = variant.versions.some(v => v.version === 'v1');
          if (hasV1) {
            console.log(`⏭️ AUTO-OPPOSITE: Opposite version already exists for ${currentVariant}, skipping`);
            return;
          }
        }
      } else {
        const variant = playState.variants[currentVariant];
        if (variant.versions) {
          // Check if opposite already exists by comparing step counts
          // If any version beyond the current one has the same number of steps, it might be the opposite
          const currentVersionNum = parseInt(variant.currentVersion.replace('v', ''));
          const currentStepCount = steps.length;
          
          // Check ALL existing versions (not just v1-v6) to avoid overwriting
          Object.keys(variant.versions).forEach(versionKey => {
            const versionNum = parseInt(versionKey.replace('v', ''));
            if (versionNum > currentVersionNum) {
              const versionData = variant.versions[versionKey];
              if (versionData && versionData.steps && versionData.steps.length === currentStepCount) {
                // Same step count - likely the opposite already exists
                console.log(`⏭️ AUTO-OPPOSITE: Version ${versionKey} already exists with ${currentStepCount} steps for ${currentVariant}, skipping to avoid overwrite`);
                // Don't return here - continue checking, but we'll skip creation if found
              }
            }
          });
        }
      }
      
      // Create opposite steps
      const oppositeSteps = createOppositeSteps(steps);
      
      // Handle different variant types
      if (currentVariant === 'base_loop' || currentVariant === 'successful') {
        // For base_loop and successful: These use direct steps format in the UI
        // Convert to versions array format: v0 = original, v1 = opposite
        const variant = playState.variants[currentVariant];
        
        // Check if already in versions array format (from database)
        if (variant.versions && Array.isArray(variant.versions)) {
          // Find highest version number
          let highestVersion = -1;
          variant.versions.forEach(v => {
            const match = v.version?.match(/v(\d+)/);
            if (match) {
              highestVersion = Math.max(highestVersion, parseInt(match[1]));
            }
          });
          
          // Create next version with opposite steps
          const nextVersionNum = highestVersion + 1;
          variant.versions.push({
            version: `v${nextVersionNum}`,
            steps: oppositeSteps
          });
          
          console.log(`✅ AUTO-OPPOSITE: Created v${nextVersionNum} (opposite) for ${currentVariant}`);
        } else {
          // Convert from direct steps to versions array format
          // Store original steps as v0, opposite as v1
          variant.versions = [
            { version: 'v0', steps: JSON.parse(JSON.stringify(steps)) },
            { version: 'v1', steps: oppositeSteps }
          ];
          
          // Keep direct steps for UI compatibility (UI reads from variantData.steps)
          // The versions array will be used when saving to database
          console.log(`✅ AUTO-OPPOSITE: Created versions array for ${currentVariant} (v0=original, v1=opposite)`);
        }
      } else {
        // For mid_play_change, contested, broken: Create opposite in next available version
        const variant = playState.variants[currentVariant];
        if (!variant.versions) {
          return; // Shouldn't happen, but safety check
        }
        
        // Find highest version number (check ALL versions, not just v1-v6)
        let highestVersion = -1;
        Object.keys(variant.versions).forEach(versionKey => {
          const match = versionKey.match(/v(\d+)/);
          if (match) {
            highestVersion = Math.max(highestVersion, parseInt(match[1]));
          }
        });
        
        // Find next available version (can go beyond v6 if needed: v7, v8, etc.)
        let nextVersionNum = highestVersion + 1;
        
        // Double-check we're not overwriting an existing version
        const nextVersionKey = `v${nextVersionNum}`;
        if (variant.versions[nextVersionKey] && variant.versions[nextVersionKey].steps && variant.versions[nextVersionKey].steps.length > 0) {
          // Version already exists with steps - find next empty one
          let foundEmpty = false;
          for (let i = nextVersionNum + 1; i <= nextVersionNum + 10; i++) { // Check up to 10 more versions
            const checkKey = `v${i}`;
            if (!variant.versions[checkKey] || !variant.versions[checkKey].steps || variant.versions[checkKey].steps.length === 0) {
              nextVersionNum = i;
              foundEmpty = true;
              break;
            }
          }
          if (!foundEmpty) {
            // All versions are used - create new one anyway (v7, v8, etc.)
            nextVersionNum = highestVersion + 1;
            console.warn(`⚠️ AUTO-OPPOSITE: All checked versions have steps, creating v${nextVersionNum} anyway`);
          }
        }
        
        // Create opposite version (will create v7, v8, etc. if needed)
        variant.versions[`v${nextVersionNum}`] = {
          steps: oppositeSteps
        };
        
        console.log(`✅ AUTO-OPPOSITE: Created v${nextVersionNum} (opposite) for ${currentVariant}`);
      }
      
      // Update UI to reflect new version (if version dropdown exists)
      if (currentVariant !== 'base_loop' && currentVariant !== 'successful') {
        updateVersionDropdown();
        updateVersionInfo();
      }
    }

    function submitStep() {
      const variantData = getCurrentVariantData();
      
      // ✅ AUTO-OPPOSITE: Check if skeleton was empty before adding this step
      const wasEmpty = (variantData.steps || []).length === 0;
      
      // Validate step before submitting
      const validation = validateCurrentStep(false); // Not final step
      if (!validation.valid) {
        const errorMsg = "Cannot add step - please fix these errors:\n\n" + 
                        validation.errors.join('\n');
        alert(errorMsg);
        return; // Don't submit invalid step
      }
      
      // Calculate timestamp (300ms increments, 0-indexed)
      const timestamp = (variantData.currentStep - 1) * 300;

      // Build step data structure
      const stepData = {
        timestamp: timestamp,
        pos_actions: {},
        events: []
      };

      // Populate pos_actions
      POSITIONS.forEach(pos => {
        const assignment = currentStepAssignments[pos];
        stepData.pos_actions[pos] = {
          location: assignment.location,
          action: assignment.action
        };
      });

      // Add to current variant's steps
      variantData.steps.push(stepData);

      // Move to next step (no limit check - user decides when done)
      variantData.currentStep++;
      
      // Save current assignments and offsets as previous for animation
      previousStepAssignments = {...currentStepAssignments};
      const previousOffsets = {...positionOffsets}; // Save offset state
      
      // Ball handler carries over to next step (don't reset currentBallHandler)
      
      // Reset current assignments and offsets
      currentStepAssignments = {};
      selectedPosition = null;
      positionOffsets = {}; // Clear for new step, will restore preserved ones
      newOffsets = {}; // Clear new offsets - old offsets become unrestricted
      
      // Pre-populate Step 2+ with previous positions and offsets
      prePopulateStep(previousOffsets);
      
      // Update dashboard and visualization
      renderPositionDashboard();
      renderCourtVisualization();
      validateActionButton();
      
      // Update final step checkbox visibility
      updateFinalStepCheckboxVisibility();
      updateStepCounter();
      updateVariantInfo(); // Update variant step count
      updateVariantTabs(); // Update status if needed
      updateAnimationVariantDropdown(); // Update animation dropdown with new step count
      
      // Update final step checkbox visibility for Motion plays
      updateFinalStepCheckboxVisibility();
    }
    
    function updateFinalStepCheckboxVisibility() {
      /**
       * Show/hide the "Mark as Final Step" checkbox based on play type.
       * Only show for Motion plays when building new steps (not reviewing).
       */
      const checkboxLabel = document.getElementById('final-step-checkbox-label');
      const checkbox = document.getElementById('final-step-checkbox');
      
      if (!checkboxLabel || !checkbox) return;
      
      const variantData = getCurrentVariantData();
      const isBuildingNewStep = variantData.currentStep > variantData.steps.length;
      
      if (playState.type === 'Motion' && isBuildingNewStep) {
        checkboxLabel.style.display = 'block';
      } else {
        checkboxLabel.style.display = 'none';
        checkbox.checked = false; // Reset when hidden
      }
    }
    
    function updateFinalStepCheckboxVisibility() {
      /**
       * Show/hide the "Mark as Final Step" checkbox based on play type.
       * Only show for Motion plays when building new steps (not reviewing).
       */
      const checkboxLabel = document.getElementById('final-step-checkbox-label');
      const checkbox = document.getElementById('final-step-checkbox');
      
      if (!checkboxLabel || !checkbox) return;
      
      const variantData = getCurrentVariantData();
      const isBuildingNewStep = variantData.currentStep > variantData.steps.length;
      
      if (playState.type === 'Motion' && isBuildingNewStep) {
        checkboxLabel.style.display = 'block';
      } else {
        checkboxLabel.style.display = 'none';
        checkbox.checked = false; // Reset when hidden
      }
    }

    function prePopulateStep(previousOffsets = {}) {
      const variantData = getCurrentVariantData();
      // Pre-populate currentStepAssignments with previous step's data for Step 2+
      if (variantData.currentStep > 1 && previousStepAssignments) {
        POSITIONS.forEach(pos => {
          const prevAssignment = previousStepAssignments[pos];
          if (prevAssignment && prevAssignment.location) {
            // Determine default action
            let defaultAction = 'stationary';
            
            // Ball handler gets "handle_ball"
            if (pos === currentBallHandler) {
              defaultAction = 'handle_ball';
            }
            // Players at post positions get "post_up"
            else if (prevAssignment.location === 'upper lowPost' || prevAssignment.location === 'lower lowPost') {
              defaultAction = 'post_up';
            }
            
            currentStepAssignments[pos] = {
              location: prevAssignment.location,
              action: defaultAction
            };
            
            // Preserve offset status from previous step
            if (previousOffsets[pos]) {
              positionOffsets[pos] = true;
              console.log(`Preserving offset for ${pos} at ${prevAssignment.location}`);
            }
          }
        });
      }
    }

    function updateStepCounter() {
      const variantData = getCurrentVariantData();
      console.log('updateStepCounter called, currentStep:', variantData.currentStep);
      const variantNames = {
        successful: 'Successful',
        mid_play_change: 'Mid-Play Change',
        contested: 'Contested',
        broken: 'Broken'
      };
      
      let titleText;
      if (variantData.currentStep <= variantData.steps.length) {
        // Reviewing existing step
        titleText = `Reviewing Step ${variantData.currentStep} of ${variantData.steps.length} (${variantNames[currentVariant]})`;
      } else {
        // Building new step
        titleText = `Building Step ${variantData.currentStep} (${variantNames[currentVariant]})`;
      }
      
      document.getElementById('page-title').textContent = titleText;
    }

    async function completePlay() {
      // Check if current step has all positions assigned
      let allComplete = true;
      for (const pos of POSITIONS) {
        const assignment = currentStepAssignments[pos];
        if (!assignment || !assignment.location || !assignment.action) {
          allComplete = false;
          break;
        }
      }

      if (!allComplete) {
        const confirm = window.confirm(
          'Current step is incomplete. Do you want to:\n\n' +
          '• Click OK to auto-fill remaining positions and complete the play\n' +
          '• Click Cancel to continue building'
        );
        
        if (!confirm) return;
        
        // Auto-fill remaining positions
        if (playState.currentStep > 1 && previousStepAssignments) {
          POSITIONS.forEach(pos => {
            const currentAssignment = currentStepAssignments[pos];
            if (!currentAssignment || !currentAssignment.location || !currentAssignment.action) {
              const prevAssignment = previousStepAssignments[pos];
              if (prevAssignment && prevAssignment.location && prevAssignment.action) {
                currentStepAssignments[pos] = {
                  location: prevAssignment.location,
                  action: prevAssignment.action
                };
              }
            }
          });
        }
      }
      
      // Submit final step if not already submitted
      if (Object.keys(currentStepAssignments).length > 0) {
        // Build final step data
        const timestamp = (playState.currentStep - 1) * 300;
        const stepData = {
          timestamp: timestamp,
          pos_actions: {},
          events: []
        };
        
        POSITIONS.forEach(pos => {
          const assignment = currentStepAssignments[pos];
          if (assignment) {
            stepData.pos_actions[pos] = {
              location: assignment.location,
              action: assignment.action
            };
          }
        });
        
        playState.steps.push(stepData);
      }
      
      // Save to MongoDB
      await savePlayToDatabase();
    }

    function buildVariantVersions(variantName) {
      /**
       * Dynamically build versions array for a variant.
       * Only includes versions that exist in playState.
       * This makes the system flexible - variants can have any number of versions.
       */
      const variant = playState.variants[variantName];
      if (!variant || !variant.versions) {
        return { versions: [] };
      }
      
      // Build array from all versions that exist
      const versionsArray = [];
      for (const versionKey in variant.versions) {
        if (variant.versions.hasOwnProperty(versionKey)) {
          versionsArray.push({
            version: versionKey,
            steps: variant.versions[versionKey].steps || []
          });
        }
      }
      
      // Sort by version name (v1, v2, v3, ...)
      versionsArray.sort((a, b) => {
        const aNum = parseInt(a.version.replace('v', ''));
        const bNum = parseInt(b.version.replace('v', ''));
        return aNum - bNum;
      });
      
      return { versions: versionsArray };
    }

    async function savePlayToDatabase() {
      // Build play data with variants based on play type
      const playData = {
        name: playState.name,
        play_type: playState.type.toLowerCase().replace(' ', '_'),
        play_focus: playState.focus ? playState.focus.toLowerCase() : (playState.type === 'Motion' ? null : 'balanced'),
        skeletons: playState.type === 'Motion' 
          ? {
              // Motion: only base_loop
              base_loop: (() => {
                const baseLoop = playState.variants.base_loop;
                // ✅ AUTO-OPPOSITE: If versions array exists (from auto-opposite), update v0 with current steps and use versions
                if (baseLoop.versions && Array.isArray(baseLoop.versions) && baseLoop.versions.length > 0) {
                  // Update v0 with current steps (in case user added more steps after creating opposite)
                  const v0Index = baseLoop.versions.findIndex(v => v.version === 'v0');
                  if (v0Index >= 0) {
                    baseLoop.versions[v0Index].steps = JSON.parse(JSON.stringify(baseLoop.steps));
                  }
                  return {
                    versions: baseLoop.versions
                  };
                }
                // Otherwise, use direct steps format
                return {
                  steps: baseLoop.steps,
                  complete: baseLoop.complete
                };
              })()
            }
          : {
              // Set Play: all variants
              successful: (() => {
                const successful = playState.variants.successful;
                // ✅ AUTO-OPPOSITE: If versions array exists (from auto-opposite), update v0 with current steps and use versions
                if (successful.versions && Array.isArray(successful.versions) && successful.versions.length > 0) {
                  // Update v0 with current steps (in case user added more steps after creating opposite)
                  const v0Index = successful.versions.findIndex(v => v.version === 'v0');
                  if (v0Index >= 0) {
                    successful.versions[v0Index].steps = JSON.parse(JSON.stringify(successful.steps));
                  }
                  return {
                    versions: successful.versions
                  };
                }
                // Otherwise, use direct steps format
                return {
                  steps: successful.steps,
                  complete: successful.complete
                };
              })(),
              mid_play_change: buildVariantVersions('mid_play_change'),
              contested: buildVariantVersions('contested'),
              broken: buildVariantVersions('broken')
            },
        // Initialize play metrics (all start at 0 for new plays)
        effectiveness: 0,
        cloaking: 0,
        momentum: 0,
        // ✅ Preserve existing copy if editing, otherwise initialize as empty
        // Backend will also preserve copy if not provided, but this is more explicit
        copy: playState.existingCopy || {},
        game_stats: {
          times_run: 0,
          shot_attempts: 0,
          made_shots: 0,
          turnovers: 0,
          offensive_fouls: 0,
          defensive_fouls: 0
        },
        season_stats: {
          times_run: 0,
          shot_attempts: 0,
          made_shots: 0,
          turnovers: 0,
          offensive_fouls: 0,
          defensive_fouls: 0
        }
      };

      try {
        const response = await fetch(API_CONFIG.buildUrl('/api/plays'), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(playData)
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const result = await response.json();
        console.log('Play saved:', result);
        
        // Show notification but stay in editor
        // ✅ FIX: Handle both steps (direct) and versions (array) structures
        const variantsWithSteps = Object.keys(playData.skeletons).filter(v => {
          const variant = playData.skeletons[v];
          // Check if variant has steps directly (Motion base_loop, Set Play successful)
          if (variant.steps && Array.isArray(variant.steps) && variant.steps.length > 0) {
            return true;
          }
          // Check if variant has versions array (Set Play mid_play_change, contested, broken)
          if (variant.versions && Array.isArray(variant.versions)) {
            // Check if any version has steps
            return variant.versions.some(version => version.steps && Array.isArray(version.steps) && version.steps.length > 0);
          }
          return false;
        }).length;
        
        const totalVariants = Object.keys(playData.skeletons).length;
        alert(`✅ Saved to database!\n\nPlay: ${playData.name}\nVariants with steps: ${variantsWithSteps}/${totalVariants}`);
        
        // Reload plays list in case this was a new play
        loadAvailablePlays();
        
      } catch (error) {
        console.error('Error saving play:', error);
        alert('Failed to save play to database. Please check console for details.');
      }
    }

    function showSuccess(playData, wasUpdate = false) {
      // Hide step 2
      document.getElementById('step2').classList.add('hidden');

      // Show success screen
      document.getElementById('success-screen').classList.remove('hidden');
      
      const action = wasUpdate ? 'updated in' : 'saved to';
      const emoji = wasUpdate ? '🔄' : '✅';
      
      document.getElementById('success-play-name').textContent = 
        `${emoji} Play "${playData.name}" has been ${action} the database!`;

      document.getElementById('json-output').textContent = JSON.stringify(playData, null, 2);
    }

    // Start
    window.addEventListener('DOMContentLoaded', init);
  </script>
