<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Tag Manager (production only) -->
  <script src="/js/shared/gtm-loader.js"></script>
  <!-- End Google Tag Manager -->
  <script src="/js/shared/authGuard.js"></script>
  <script src="/js/shared/sentryInit.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Report - GOB</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/resource-pages.css">
  <link rel="stylesheet" href="/training-report.css">
</head>
<body class="training-report-page">
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K69GQK3D"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="training-report-container resource-page-container fcc-brand-page-shell training-report-resource-shell">
    <!-- Header -->
    <header class="report-header">
        <div class="header-left">
        <h1 class="page-title">Training Report</h1>
        <div class="header-meta-row">
          <div class="header-meta-line">
            <span><span id="week-label">Week:</span> <span id="week-number">--</span></span>
            <span class="meta-sep">·</span>
            <span>Upcoming Opponent: <span id="upcoming-opponent">--</span></span>
            <span class="meta-sep">·</span>
            <span>Training Focus: <span id="training-focus">--</span></span>
          </div>
        </div>
      </div>
      <button id="locker-room-btn" class="locker-room-button">Go To Locker Room</button>
    </header>

    <!-- Training Notes (first: Notes → Players → Team → Plays) -->
    <section class="training-notes-section">
      <div class="training-notes-header">
        <div class="training-notes-header-main">
          <div class="training-notes-header-accent" aria-hidden="true"></div>
          <div class="training-notes-header-copy">
            <h2>Notes</h2>
            <div id="training-notes-brief" class="training-notes-brief">Week -- Training Brief · For Coaching Staff Only</div>
          </div>
        </div>
        <div class="training-notes-recruit-block">
          <div id="training-report-recruit-header" class="training-notes-recruit-title is-hidden" aria-live="polite"></div>
          <div id="training-report-recruit-meta-line" class="training-notes-recruit-meta is-hidden" aria-live="polite"></div>
        </div>
      </div>
      <div class="training-notes-rule" aria-hidden="true"></div>
      <div class="training-notes-container" id="training-notes-container">
        <!-- Populated by training-report.js -->
      </div>
    </section>

    <!-- Players Section -->
    <section class="players-section">
      <div class="section-header">
        <h2>Player Report</h2>
        <div class="view-toggle">
          <button class="toggle-btn" data-view="attributes">Attributes</button>
          <button class="toggle-btn active" data-view="changes">Training Changes</button>
        </div>
      </div>
      <div class="scroll-x">
        <table class="players-table" id="players-table">
          <thead id="players-thead"></thead>
          <tbody id="players-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Team Section -->
    <section class="team-section">
      <h2>Team Report</h2>
      <div class="team-attributes-grid" id="team-attributes-grid"></div>
    </section>

    <!-- Projected Starting 5 -->
    <section class="projected-lineup-section">
      <div class="section-header projected-lineup-header">
        <h2>Projected Starting 5</h2>
        <div class="view-toggle projected-lineup-toggle" role="group" aria-label="Projected lineup columns">
          <button type="button" class="toggle-btn active" data-projected-view="attributes">Attributes</button>
          <button type="button" class="toggle-btn" data-projected-view="stats">Stats</button>
        </div>
      </div>
      <div class="scroll-x">
        <div id="training-projected-lineup" class="training-projected-lineup-wrap"></div>
      </div>
    </section>

    <!-- Playbook Summary Section -->
    <section class="playbook-summary-section">
      <h2>Playbook Summary</h2>
      <div class="playbook-summary-container" id="playbook-summary-container">
        <!-- Plays will be populated here -->
      </div>
    </section>
  </div>

  <script src="/js/config/api-config.js"></script>
  <script src="/common.js"></script>
  <script src="/js/shared/scoutingReport.js"></script>
  <script src="/defense-display.js"></script>
  <script src="/training-report.js"></script>
  <script type="module">
    import { resumeFranchiseTrack } from '/js/musicController.js';
    resumeFranchiseTrack();
  </script>
</body>
</html>
