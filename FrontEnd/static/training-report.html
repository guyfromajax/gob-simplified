<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Tag Manager (production only) -->
  <script src="/js/shared/gtm-loader.js"></script>
  <!-- End Google Tag Manager -->
  <script src="/js/shared/authGuard.js"></script>
  <script src="/js/shared/sentryInit.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Training Report - GOB</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
  <link rel="stylesheet" href="/training-report.css">
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K69GQK3D"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="training-report-container">
    <!-- Header -->
    <header class="report-header">
      <div class="header-left">
        <h1 class="page-title">TRAINING REPORT</h1>
        <div class="header-info">
          <div class="info-item">
            <span class="info-label" id="week-label">Week:</span>
            <span id="week-number" class="info-value">--</span>
          </div>
          <div class="info-item">
            <span class="info-label">Upcoming Opponent:</span>
            <span id="upcoming-opponent" class="info-value">--</span>
          </div>
          <div class="info-item">
            <span class="info-label">Training Focus:</span>
            <span id="training-focus" class="info-value">--</span>
          </div>
        </div>
      </div>
      <button id="locker-room-btn" class="locker-room-button">Go To Locker Room</button>
    </header>

    <!-- Players Section -->
    <section class="players-section">
      <div class="section-header">
        <h2>Player Report</h2>
        <div class="view-toggle">
          <button class="toggle-btn active" data-view="attributes">Attributes</button>
          <button class="toggle-btn" data-view="changes">Training Changes</button>
        </div>
      </div>
      <div class="scroll-x">
        <table class="players-table" id="players-table">
          <thead id="players-thead"></thead>
          <tbody id="players-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Team Section -->
    <section class="team-section">
      <h2>Team Report</h2>
      <div class="team-attributes-grid" id="team-attributes-grid"></div>
    </section>

    <!-- Playbook Summary Section -->
    <section class="playbook-summary-section">
      <h2>Playbook Summary</h2>
      <div class="playbook-summary-container" id="playbook-summary-container">
        <!-- Plays will be populated here -->
      </div>
    </section>

    <!-- Training Notes Section -->
    <section class="training-notes-section">
      <h2>Training Notes</h2>
      <div class="training-notes-container" id="training-notes-container">
        <!-- Notes will be populated here in the future -->
      </div>
    </section>
  </div>

  <script src="/js/config/api-config.js"></script>
  <script src="/training-report.js"></script>
</body>
</html>
