<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/shared/authGuard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Standings</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/franchise-command-center.css">
  <link rel="stylesheet" href="/resource-pages.css">
  <style>
    .standings-all-regions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .standings-all-regions .fcc-standings-card {
      flex: none;
      max-width: none;
      min-width: 0;
    }

    .standings-all-regions .fcc-standings-card-title {
      padding: 10px 12px 8px;
      font-size: 18px;
    }

    .standings-all-regions .fcc-standings-card-body {
      padding: 4px 8px 8px;
    }

    .standings-all-regions .fcc-standings-row {
      grid-template-columns: minmax(132px, 1.9fr) 38px 38px 48px 48px;
      gap: 4px;
      min-height: 30px;
      padding: 0 1px;
    }

    .standings-all-regions .fcc-standings-row-header {
      min-height: 28px;
      padding: 0 10px;
      font-size: 10px;
      letter-spacing: 0.04em;
    }

    .standings-all-regions .fcc-standings-col-team {
      font-size: 11px;
    }

    .standings-all-regions .fcc-standings-col-stat {
      font-size: 11px;
    }

  </style>
</head>
<body>
  <div class="resource-page-container">
    <a id="back-btn" class="back-to-locker-room" href="#">Back To Locker Room</a>
    <h1>Conference Standings</h1>
    <div id="standings-by-region" class="standings-by-region"></div>
  </div>
  <script src="/js/config/api-config.js"></script>
  <script src="/js/shared/resourceCache.js"></script>
  <script src="/common.js"></script>
  <script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const franchiseId = params.get('franchise_id');
  const teamId = params.get('team_id');
  const backBtn = document.getElementById('back-btn');
  if (backBtn && franchiseId && teamId) {
    backBtn.href = resolveFranchiseLockerRoomUrl({ params, franchiseId, teamId });
  }

  let resourceCache = null;

  async function fetchJSON(url) {
    const res = await fetch(url, { headers: window.API_CONFIG ? API_CONFIG.getAuthHeaders() : {} });
    if (!res.ok) throw new Error('Request failed');
    return res.json();
  }

  function buildTeamLink(t) {
    const a = document.createElement('a');
    a.href = `/team-roster-view.html?mode=franchise&franchise_id=${franchiseId}&team_id=${encodeURIComponent(t.team_id)}&team_name=${encodeURIComponent(t.name)}&return_url=${encodeURIComponent(getCurrentRelativeUrl())}`;
    const rank = Number(t?.natl_rank);
    const rankPrefix = Number.isFinite(rank) && rank >= 1 && rank <= 25 ? `#${rank} ` : '';
    a.textContent = `${rankPrefix}${t.name}`;
    a.style.color = '#4a90e2';
    a.style.textDecoration = 'none';
    return a;
  }

  function buildStandingsCard(titleText, teams) {
    const card = document.createElement('section');
    card.className = 'fcc-standings-card';

    const title = document.createElement('div');
    title.className = 'fcc-standings-card-title';
    title.textContent = titleText;
    card.appendChild(title);

    const headerRow = document.createElement('div');
    headerRow.className = 'fcc-standings-row fcc-standings-row-header';
    headerRow.innerHTML = [
      '<span class="fcc-standings-col-team">Team</span>',
      '<span class="fcc-standings-col-stat">W</span>',
      '<span class="fcc-standings-col-stat">L</span>',
      '<span class="fcc-standings-col-stat">PF</span>',
      '<span class="fcc-standings-col-stat">PA</span>'
    ].join('');
    card.appendChild(headerRow);

    const body = document.createElement('div');
    body.className = 'fcc-standings-card-body';

    teams.forEach(function (t) {
      const row = document.createElement('div');
      row.className = 'fcc-standings-row';

      const teamCell = document.createElement('span');
      teamCell.className = 'fcc-standings-col-team';
      teamCell.appendChild(buildTeamLink(t));
      row.appendChild(teamCell);

      const wCell = document.createElement('span');
      wCell.className = 'fcc-standings-col-stat';
      wCell.textContent = t.W;
      row.appendChild(wCell);

      const lCell = document.createElement('span');
      lCell.className = 'fcc-standings-col-stat';
      lCell.textContent = t.L;
      row.appendChild(lCell);

      const pfCell = document.createElement('span');
      pfCell.className = 'fcc-standings-col-stat';
      pfCell.textContent = t.PF;
      row.appendChild(pfCell);

      const paCell = document.createElement('span');
      paCell.className = 'fcc-standings-col-stat';
      paCell.textContent = t.PA;
      row.appendChild(paCell);

      body.appendChild(row);
    });

    card.appendChild(body);
    return card;
  }

  function render(allStandingsByRegion) {
    const container = document.getElementById('standings-by-region');
    if (!container) return;
    container.innerHTML = '';

    const layout = document.createElement('div');
    layout.className = 'standings-all-regions';
    const regionOrder = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

    regionOrder.forEach(function (region) {
      const list = allStandingsByRegion[region] || [];
      const byConference = {};
      list.forEach(function (t) {
        const c = t.conference != null ? t.conference : 0;
        if (!byConference[c]) byConference[c] = [];
        byConference[c].push(t);
      });
      const confNumbers = Object.keys(byConference).map(Number).sort(function (a, b) { return a - b; });

      confNumbers.forEach(function (confNum) {
        const teams = byConference[confNum];
        teams.sort(function (a, b) { return (b.W - a.W) || (b.differential - a.differential); });
        layout.appendChild(buildStandingsCard('Conference ' + region + confNum, teams));
      });
    });

    container.appendChild(layout);
  }

  async function loadRegion(region) {
    const cached = resourceCache && resourceCache.get(region);
    if (cached) return cached;
    const payload = await fetchJSON(
      API_CONFIG.buildUrl('/franchise/standings')
      + '?franchise_id=' + encodeURIComponent(franchiseId)
      + '&region=' + encodeURIComponent(region)
    );
    return resourceCache ? resourceCache.set(region, payload) : payload;
  }

  if (!franchiseId) {
    document.getElementById('standings-by-region').innerHTML = '<p>Missing franchise_id in URL.</p>';
    return;
  }
  Promise.all([
    fetchJSON(API_CONFIG.buildUrl('/franchise/command-center/data') + '?franchise_id=' + encodeURIComponent(franchiseId)),
  ]).then(async ([cc]) => {
    resourceCache = window.ResourceCache.createResourceCache('standings', franchiseId, cc.current_season, cc.week);
    const regionOrder = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    document.getElementById('standings-by-region').innerHTML = '<p>Loading standings...</p>';
    const regionPayloads = await Promise.all(regionOrder.map(async function (region) {
      const data = await loadRegion(region);
      return [region, data.standings || []];
    }));
    const allStandingsByRegion = Object.fromEntries(regionPayloads);
    render(allStandingsByRegion);
  })
    .catch(err => {
      document.getElementById('standings-by-region').innerHTML = '<p>Failed to load standings.</p>';
      console.error(err);
    });
})();
  </script>
</body>
</html>
