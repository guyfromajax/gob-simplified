<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Tag Manager (production only) -->
  <script src="/js/shared/gtm-loader.js"></script>
  <!-- End Google Tag Manager -->
  <script src="/js/shared/authGuard.js"></script>
  <script src="/js/shared/sentryInit.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Scrimmage - Choose Teams</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f3f3f3;
      margin: 0;
      padding: 20px;
    }
    button,
    input[type="button"],
    input[type="submit"],
    input[type="reset"] {
      font-family: 'Bebas Neue', sans-serif;
    }
    #page-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 48px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 20px;
    }
    #team-slots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      margin-bottom: 20px;
    }
    .slot {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .box {
      width: 230px;
      height: 110px;
      border: 2px dashed #9a9a9a;
      margin-bottom: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      overflow: hidden;
    }
    .box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #play-btn {
      position: relative;
      border: none;
      background: none;
      cursor: pointer;
    }
    #play-btn img { width: 200px; display: block; }
    #play-btn span {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-family: 'Bebas Neue', cursive;
      font-size: 24px;
      font-weight: bold;
      pointer-events: none;
    }
    .logo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: calc(100% - 40px);
      margin: 0 20px;
    }
    .logo-btn {
      border: none;
      background: none;
      cursor: pointer;
    }
    .logo-btn img { width: 100%; height: auto; }
  </style>
  <link rel="stylesheet" href="/css/fonts.css">
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K69GQK3D"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <h1 id="page-title">Game Time!</h1>
  <div id="team-slots">
    <div class="slot" id="away-slot">
      <div>Away</div>
      <div class="box" id="away-box" ondragover="event.preventDefault()" ondrop="handleDrop(event, 'away')"></div>
      <label><input type="checkbox" id="away-check" onchange="toggleMyTeam('away')"> My Team</label>
    </div>
    <button id="play-btn" disabled style="opacity:0.5">
      <img src="./images/buttons/orange_button_live.png" alt="Play Now">
      <span>Play Now</span>
    </button>
    <div class="slot" id="home-slot">
      <div>Home</div>
      <div class="box" id="home-box" ondragover="event.preventDefault()" ondrop="handleDrop(event, 'home')"></div>
      <label><input type="checkbox" id="home-check" onchange="toggleMyTeam('home')" checked> My Team</label>
    </div>
  </div>
  <div class="logo-grid" id="logo-grid"></div>
  <script src="/common.js"></script>
  <script src="./team-select.js"></script>
</body>
</html>
