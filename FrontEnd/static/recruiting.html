<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/shared/authGuard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Recruiting Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/rt-buckets.css">
  <link rel="stylesheet" href="/css/attr-tiles.css">
  <link rel="stylesheet" href="/recruiting-spine.css">
  <link rel="stylesheet" href="/recruiting-dock.css">
  <link rel="stylesheet" href="/recruiting-signing.css">
  <link rel="stylesheet" href="/recruiting-results-hub.css">
  <style>
    /* Hub page frame (back link + error). Everything else is spine-styled. */
    .hub-page-header { display: flex; align-items: center; margin-bottom: 4px; }
    .brand-back-link {
      display: inline-flex; align-items: center; gap: 8px; padding: 0; background: none;
      color: rgba(255, 255, 255, 0.76); font-weight: 600; font-size: 14px;
      text-decoration: none; border: 0; transition: color 0.18s ease, transform 0.18s ease;
    }
    .brand-back-link:hover { color: #fff; transform: translateX(-1px); }
    .brand-back-link::before { content: "\2190"; font-size: 16px; line-height: 1; }
    .hub-error {
      margin-top: 40px; padding: 26px; text-align: center; border: 1px solid var(--border);
      border-radius: 14px; background: var(--surf); color: var(--muted); font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="doc">
    <div class="hub-page-header">
      <a id="back-btn" class="brand-back-link" href="#">Back to Locker Room</a>
    </div>
    <div id="hub-root" class="spine"></div>
  </div>

  <script src="/js/config/api-config.js"></script>
  <script src="/common.js"></script>
  <script src="/js/shared/attributeTooltips.js"></script>
  <script src="/js/shared/attrTiles.js"></script>
  <script src="/js/shared/rtBucket.js"></script>
  <script src="/js/shared/playerYear.js"></script>
  <script src="/recruiting-common.js"></script>
  <script src="/recruiting-spine.js"></script>
  <script src="/recruiting-hub.js"></script>
  <script type="module">
    import { resumeFranchiseTrack } from '/js/musicController.js';
    resumeFranchiseTrack();
  </script>
</body>
</html>
