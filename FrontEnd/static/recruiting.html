<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/shared/authGuard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Recruiting</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/franchise-command-center.css">
  <link rel="stylesheet" href="/resource-pages.css">
  <style>
    .recruiting-page-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-bottom: 16px;
    }

    .recruiting-page-header .brand-back-link {
      justify-self: start;
    }

    .brand-back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      height: auto;
      padding: 0;
      background: none;
      color: rgba(255, 255, 255, 0.76);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.01em;
      text-decoration: none;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
      transition: color 0.18s ease, transform 0.18s ease;
    }

    .brand-back-link:hover {
      background: none;
      color: #ffffff;
      transform: translateX(-1px);
    }

    .brand-back-link::before {
      content: "←";
      font-size: 16px;
      line-height: 1;
    }

    .recruiting-page-title {
      margin: 0 !important;
      text-align: center;
    }

    .recruiting-regions-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .recruiting-region-card {
      min-width: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 18%),
        linear-gradient(180deg, rgba(42, 48, 58, 0.92), rgba(30, 35, 44, 0.95));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 14px 28px rgba(7, 10, 16, 0.28);
      overflow: hidden;
    }

    .recruiting-region-title {
      padding: 10px 12px 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 0.03em;
      color: #f7f9ff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
    }

    .recruiting-region-body {
      padding: 8px 10px 10px;
    }

    .recruiting-region-body .scroll-x {
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.34) rgba(255, 255, 255, 0.08);
    }

    .recruiting-region-body .scroll-x::-webkit-scrollbar {
      height: 9px;
    }

    .recruiting-region-body .scroll-x::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
    }

    .recruiting-region-body .scroll-x::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.34);
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.08);
    }

    .recruiting-region-table {
      width: max(100%, 1120px);
    }

    .recruiting-region-table thead th[data-sort-key] {
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .recruiting-region-table thead th.sorted-asc::after {
      content: ' ▲';
    }

    .recruiting-region-table thead th.sorted-desc::after {
      content: ' ▼';
    }

    .recruiting-region-empty {
      padding: 18px 10px;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.68);
    }

    .recruiting-status-note {
      margin: 0 0 12px;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.72);
    }

    @media (max-width: 1200px) {
      .recruiting-regions-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="resource-page-container fcc-brand-page-shell">
    <div class="recruiting-page-header">
      <a id="back-btn" class="brand-back-link" href="#">Back to Locker Room</a>
      <h1 id="recruiting-page-title" class="recruiting-page-title">Recruiting</h1>
      <div></div>
    </div>
    <p id="recruiting-status-note" class="recruiting-status-note"></p>
    <div id="recruiting-regions" class="recruiting-regions-grid"></div>
  </div>
  <script src="/js/config/api-config.js"></script>
  <script src="/common.js"></script>
  <script src="/js/shared/attributeTooltips.js"></script>
  <script src="/recruiting-common.js"></script>
  <script src="/recruiting.js"></script>
</body>
</html>
