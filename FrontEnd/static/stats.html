<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/shared/authGuard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Stats</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@400;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/stats.css">
  <style>
    .stats-page .stats-team-filter-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.78);
      border-radius: 999px;
      padding: 7px 14px;
      font: 600 12px/1 'Bebas Neue', sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }

    .stats-page .stats-team-filter-btn:hover {
      border-color: rgba(255, 255, 255, 0.34);
      color: #fff;
    }

    .stats-page .stats-team-filter-btn.active {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.36);
      color: #fff;
    }
  </style>
  <link rel="stylesheet" href="/css/fonts.css">
</head>
<body class="stats-page">
  <header class="stats-topbar">
    <a id="back-btn" class="stats-topbar-back" href="#">← Back to Locker Room</a>
    <h1 class="stats-topbar-title">GOB <span class="dot">·</span> Season Hub</h1>
  </header>
  <div class="resource-page-container">
    <div class="section-label">Team Overview</div>
    <div class="stats-scope-toggle-wrap">
      <button type="button" class="stats-scope-btn active" data-scope="conference">Conference</button>
      <button type="button" class="stats-scope-btn" data-scope="region">Region</button>
      <button type="button" class="stats-scope-btn" data-scope="national">National</button>
    </div>
    <div id="national-team-filter-wrap" class="stats-scope-toggle-wrap" style="display:none; margin-top: 12px;">
      <button type="button" class="stats-team-filter-btn active" data-team-filter="top25">Top 25</button>
      <button type="button" class="stats-team-filter-btn" data-team-filter="all">All Teams</button>
    </div>
    <div class="stats-table-wrap">
      <table class="stats-table">
        <thead>
          <tr class="group-row">
            <th colspan="6"></th>
            <th colspan="3">Shooting</th>
            <th colspan="3">3-Point</th>
            <th colspan="3">Free Throws</th>
            <th colspan="3">Rebounding</th>
            <th colspan="5">Other</th>
            <th colspan="4">Defense</th>
          </tr>
          <tr class="col-row">
            <th class="sortable col-group-start" data-stat="team">Team <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="rank">Rank <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="W">W <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="L">L <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="PF">PF <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="PA">PA <span class="sort-arrow"></span></th>
            <th class="sortable col-group-start" data-stat="FGM">FGM <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="FGA">FGA <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="FG%">FG% <span class="sort-arrow"></span></th>
            <th class="sortable col-group-start" data-stat="3PTM">3PTM <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="3PTA">3PTA <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="3PT%">3PT% <span class="sort-arrow"></span></th>
            <th class="sortable col-group-start" data-stat="FTM">FTM <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="FTA">FTA <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="FT%">FT% <span class="sort-arrow"></span></th>
            <th class="sortable col-group-start" data-stat="DREB">DREB <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="OREB">OREB <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="TREB">TREB <span class="sort-arrow"></span></th>
            <th class="sortable col-group-start" data-stat="AST">AST <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="F">F <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="TO">TO <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="SCR_A">SCRA <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="SCR%">SCR% <span class="sort-arrow"></span></th>
            <th class="sortable col-group-start" data-stat="STL">STL <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="BLK">BLK <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="DEF_A">DEFA <span class="sort-arrow"></span></th>
            <th class="sortable" data-stat="DEF%">DEF% <span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="teamstats-body"></tbody>
      </table>
    </div>
    <div class="section-label">Individual Leaders</div>
    <div id="leaders-container"></div>
  </div>
  <script src="/js/config/api-config.js"></script>
  <script src="/js/shared/resourceCache.js"></script>
  <script src="/common.js"></script>
  <script>
(function() {
  const params = new URLSearchParams(window.location.search);
  const franchiseId = params.get('franchise_id');
  const teamId = params.get('team_id');
  const backBtn = document.getElementById('back-btn');
  if (backBtn && franchiseId && teamId) {
    backBtn.href = resolveFranchiseLockerRoomUrl({ params, franchiseId, teamId });
  }

  async function fetchJSON(url) {
    const res = await fetch(url, { headers: window.API_CONFIG ? API_CONFIG.getAuthHeaders() : {} });
    if (!res.ok) throw new Error('Request failed');
    return res.json();
  }

  let userConference = null, userRegion = null;
  let scope = 'conference';
  let nationalTeamFilter = 'top25';
  let leadersData = null, teamStatsData = null;
  let resourceCache = null;
  let defaultOrderTeams = null;
  let sortColumn = 'rank';
  let sortDirection = 'asc';

  const COLUMN_ORDER = ['team','rank','W','L','PF','PA','FGM','FGA','FG%','3PTM','3PTA','3PT%','FTM','FTA','FT%','DREB','OREB','TREB','AST','F','TO','SCR_A','SCR%','STL','BLK','DEF_A','DEF%'];
  const COL_GROUP_START_INDEX = { 0:1, 6:1, 9:1, 12:1, 15:1, 18:1, 23:1 };
  const STAT_MAP = { 'team':'team', 'rank':'rank', 'W':'W', 'L':'L', 'PF':'PF', 'PA':'PA', 'FGM':'FGM', 'FGA':'FGA', 'FG%':'FG%', '3PTM':'3PTM', '3PTA':'3PTA', '3PT%':'3PT%', 'FTM':'FTM', 'FTA':'FTA', 'FT%':'FT%', 'DREB':'DREB', 'OREB':'OREB', 'TREB':'TREB', 'AST':'AST', 'F':'F', 'TO':'TO', 'SCR_A':'SCR_A', 'SCR%':'SCR%', 'STL':'STL', 'BLK':'BLK', 'DEF_A':'DEF_A', 'DEF%':'DEF%' };

  function cloneTeams(teams) {
    return (teams || []).map(t => ({ ...t, stats: { ...(t.stats || {}) } }));
  }

  function getNumericNationalRank(team) {
    const rankValue = team?.natl_rank;
    const parsed = Number(rankValue);
    return Number.isFinite(parsed) && parsed > 0 ? parsed : null;
  }

  function getFilteredTeamsForDisplay(teams) {
    const cloned = cloneTeams(teams);
    if (scope !== 'national' || nationalTeamFilter !== 'top25') return cloned;
    return cloned.filter((team) => {
      const nationalRank = getNumericNationalRank(team);
      return nationalRank != null && nationalRank <= 25;
    });
  }

  function renderTeamStatsBody(teams) {
    const tbody = document.getElementById('teamstats-body');
    if (!tbody) return;
    tbody.innerHTML = '';
    const totals = { W:0, L:0, PF:0, PA:0, FGM:0, FGA:0, '3PTM':0, '3PTA':0, FTM:0, FTA:0, DREB:0, OREB:0, TREB:0, AST:0, STL:0, BLK:0, F:0, TO:0, DEF_A:0, DEF_S:0, SCR_A:0, SCR_S:0 };
    const formatWholeDefPercent = (successes, attempts) => attempts > 0 ? Math.round(((successes || 0) / attempts) * 100) + '%' : '0%';
    teams.forEach(t => {
      const s = t.stats || {};
      const tr = document.createElement('tr');
      let html = '';
      COLUMN_ORDER.forEach((key, i) => {
        const groupStart = COL_GROUP_START_INDEX[i] ? ' col-group-start' : '';
        if (key === 'team') {
          html += '<td class="col-group-start">' + (t.team || '') + '</td>';
          return;
        }
        if (key === 'rank') {
          html += '<td>' + (getNumericNationalRank(t) ?? '--') + '</td>';
          return;
        }
        const cls = (key === 'W' ? 'col-w' : key === 'L' ? 'col-l' : '') + groupStart;
        let val;
        if (key === 'FG%') val = s.FGA > 0 ? ((s.FGM||0)/s.FGA*100).toFixed(1)+'%' : '0.0%';
        else if (key === '3PT%') val = s['3PTA'] > 0 ? ((s['3PTM']||0)/s['3PTA']*100).toFixed(1)+'%' : '0.0%';
        else if (key === 'FT%') val = s.FTA > 0 ? ((s.FTM||0)/s.FTA*100).toFixed(1)+'%' : '0.0%';
        else if (key === 'DEF%') val = formatWholeDefPercent(s.DEF_S, s.DEF_A);
        else if (key === 'SCR%') val = s.SCR_A > 0 ? ((s.SCR_S||0)/s.SCR_A*100).toFixed(1)+'%' : '0.0%';
        else val = s[key] ?? 0;
        if (key === 'W') totals.W += (s.W||0);
        else if (key === 'L') totals.L += (s.L||0);
        else if (key === 'PF') totals.PF += (s.PF||0);
        else if (key === 'PA') totals.PA += (s.PA||0);
        else if (key === 'FGM') totals.FGM += (s.FGM||0);
        else if (key === 'FGA') totals.FGA += (s.FGA||0);
        else if (key === '3PTM') totals['3PTM'] += (s['3PTM']||0);
        else if (key === '3PTA') totals['3PTA'] += (s['3PTA']||0);
        else if (key === 'FTM') totals.FTM += (s.FTM||0);
        else if (key === 'FTA') totals.FTA += (s.FTA||0);
        else if (key === 'DREB') totals.DREB += (s.DREB||0);
        else if (key === 'OREB') totals.OREB += (s.OREB||0);
        else if (key === 'TREB') totals.TREB += (s.TREB||0);
        else if (key === 'AST') totals.AST += (s.AST||0);
        else if (key === 'STL') totals.STL += (s.STL||0);
        else if (key === 'BLK') totals.BLK += (s.BLK||0);
        else if (key === 'F') totals.F += (s.F||0);
        else if (key === 'TO') totals.TO += (s.TO||0);
        else if (key === 'DEF_A') totals.DEF_A += (s.DEF_A||0);
        else if (key === 'SCR_A') totals.SCR_A += (s.SCR_A||0);
        if (key === 'DEF%') totals.DEF_S += (s.DEF_S||0);
        if (key === 'SCR%') totals.SCR_S += (s.SCR_S||0);
        html += '<td class="' + cls + '">' + val + '</td>';
      });
      tr.innerHTML = html;
      tbody.appendChild(tr);
    });
    const totTr = document.createElement('tr');
    totTr.className = 'totals-row';
    let totHtml = '<td class="col-group-start">TOTALS</td><td>--</td><td class="col-w">' + totals.W + '</td><td class="col-l">' + totals.L + '</td><td>' + totals.PF + '</td><td>' + totals.PA + '</td>';
    totHtml += '<td class="col-group-start">' + totals.FGM + '</td><td>' + totals.FGA + '</td><td>' + (totals.FGA > 0 ? (totals.FGM/totals.FGA*100).toFixed(1)+'%' : '0.0%') + '</td>';
    totHtml += '<td class="col-group-start">' + totals['3PTM'] + '</td><td>' + totals['3PTA'] + '</td><td>' + (totals['3PTA'] > 0 ? (totals['3PTM']/totals['3PTA']*100).toFixed(1)+'%' : '0.0%') + '</td>';
    totHtml += '<td class="col-group-start">' + totals.FTM + '</td><td>' + totals.FTA + '</td><td>' + (totals.FTA > 0 ? (totals.FTM/totals.FTA*100).toFixed(1)+'%' : '0.0%') + '</td>';
    totHtml += '<td class="col-group-start">' + totals.DREB + '</td><td>' + totals.OREB + '</td><td>' + totals.TREB + '</td>';
    totHtml += '<td class="col-group-start">' + totals.AST + '</td><td>' + totals.F + '</td><td>' + totals.TO + '</td><td>' + totals.SCR_A + '</td><td>' + (totals.SCR_A > 0 ? (totals.SCR_S/totals.SCR_A*100).toFixed(1)+'%' : '0.0%') + '</td>';
    totHtml += '<td class="col-group-start">' + totals.STL + '</td><td>' + totals.BLK + '</td><td>' + totals.DEF_A + '</td><td>' + formatWholeDefPercent(totals.DEF_S, totals.DEF_A) + '</td>';
    totTr.innerHTML = totHtml;
    tbody.appendChild(totTr);
  }

  function sortTeams(teams, statKey, direction) {
    const key = STAT_MAP[statKey] || statKey;
    const copy = cloneTeams(teams);
    copy.sort((a, b) => {
      const s1 = a.stats || {}, s2 = b.stats || {};
      let v1, v2;
      if (key === 'team') { v1 = a.team||''; v2 = b.team||''; return direction === 'asc' ? v1.localeCompare(v2) : v2.localeCompare(v1); }
      if (key === 'rank') {
        v1 = getNumericNationalRank(a) ?? Number.MAX_SAFE_INTEGER;
        v2 = getNumericNationalRank(b) ?? Number.MAX_SAFE_INTEGER;
        return direction === 'asc' ? v1 - v2 : v2 - v1;
      }
      if (key === 'FG%') { v1 = s1.FGA>0 ? (s1.FGM||0)/s1.FGA : 0; v2 = s2.FGA>0 ? (s2.FGM||0)/s2.FGA : 0; }
      else if (key === '3PT%') { v1 = s1['3PTA']>0 ? (s1['3PTM']||0)/s1['3PTA'] : 0; v2 = s2['3PTA']>0 ? (s2['3PTM']||0)/s2['3PTA'] : 0; }
      else if (key === 'FT%') { v1 = s1.FTA>0 ? (s1.FTM||0)/s1.FTA : 0; v2 = s2.FTA>0 ? (s2.FTM||0)/s2.FTA : 0; }
      else if (key === 'DEF%') { v1 = s1.DEF_A>0 ? (s1.DEF_S||0)/s1.DEF_A : 0; v2 = s2.DEF_A>0 ? (s2.DEF_S||0)/s2.DEF_A : 0; }
      else if (key === 'SCR%') { v1 = s1.SCR_A>0 ? (s1.SCR_S||0)/s1.SCR_A : 0; v2 = s2.SCR_A>0 ? (s2.SCR_S||0)/s2.SCR_A : 0; }
      else { v1 = s1[key]||0; v2 = s2[key]||0; }
      return direction === 'asc' ? v1 - v2 : v2 - v1;
    });
    return copy;
  }

  function updateSortHeaders() {
    document.querySelectorAll('.stats-table thead tr.col-row th.sortable').forEach(th => {
      const stat = th.getAttribute('data-stat');
      const arrow = th.querySelector('.sort-arrow');
      th.classList.remove('active');
      if (arrow) arrow.textContent = '';
      if (stat === sortColumn && sortDirection) {
        th.classList.add('active');
        if (arrow) arrow.textContent = sortDirection === 'desc' ? '↓' : '↑';
      }
    });
  }

  function bindSortHeaders() {
    const wrap = document.querySelector('.stats-table-wrap');
    if (!wrap || wrap.dataset.sortBound) return;
    wrap.dataset.sortBound = '1';
    wrap.addEventListener('click', (e) => {
      const th = e.target.closest('th.sortable');
      if (!th) return;
      const stat = th.getAttribute('data-stat');
      if (sortColumn === stat) {
        if (sortDirection === 'desc') sortDirection = 'asc';
        else if (sortDirection === 'asc') { sortColumn = null; sortDirection = null; }
      } else {
        sortColumn = stat;
        sortDirection = 'desc';
        if (stat === 'rank') sortDirection = 'asc';
      }
      let dataToRender = getFilteredTeamsForDisplay(defaultOrderTeams);
      if (sortColumn && sortDirection) {
        dataToRender = sortTeams(dataToRender, sortColumn, sortDirection);
      }
      renderTeamStatsBody(dataToRender);
      updateSortHeaders();
    });
  }

  function getLeadersLimit() {
    return 10;
  }

  function render() {
    if (!teamStatsData) return;
    const filtered = cloneTeams(teamStatsData.teams || []);
    defaultOrderTeams = filtered;
    let dataToRender = getFilteredTeamsForDisplay(defaultOrderTeams);
    if (sortColumn && sortDirection) {
      dataToRender = sortTeams(dataToRender, sortColumn, sortDirection);
    }
    renderTeamStatsBody(dataToRender);
    updateSortHeaders();
    bindSortHeaders();

    const nationalFilterWrap = document.getElementById('national-team-filter-wrap');
    if (nationalFilterWrap) {
      nationalFilterWrap.style.display = scope === 'national' ? 'flex' : 'none';
      nationalFilterWrap.querySelectorAll('.stats-team-filter-btn').forEach((btn) => {
        btn.classList.toggle('active', btn.getAttribute('data-team-filter') === nationalTeamFilter);
      });
    }

    const container = document.getElementById('leaders-container');
    if (!container) return;
    container.innerHTML = '';
    const filteredLeaders = leadersData || {};
    const categories = ['PTS', '3PTM', 'REB', 'AST', 'STL', 'BLK'];
    const names = { PTS: 'Points', '3PTM': '3PT Made', REB: 'Rebounds', AST: 'Assists', STL: 'Steals', BLK: 'Blocks' };
    const limit = getLeadersLimit();
    categories.forEach(cat => {
      const list = (filteredLeaders[cat] || []).slice(0, 10);
      if (list.length === 0) return;
      const card = document.createElement('div');
      card.className = 'leader-card';
      card.innerHTML = '<div class="leader-card-header">' + (names[cat] || cat) + '</div>';
      const listEl = document.createElement('div');
      listEl.className = 'leader-card-list';
      list.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'leader-row' + (idx === 0 ? ' rank-1' : '') + (idx >= limit ? ' beyond-limit' : '');
        row.innerHTML = '<span class="leader-rank">' + (idx + 1) + '</span><div class="leader-name-team"><span class="name">' + (p.name || '') + '</span><span class="team">' + (p.team || '') + '</span></div><span class="leader-value">' + (p.value ?? '') + '</span>';
        listEl.appendChild(row);
      });
      card.appendChild(listEl);
      container.appendChild(card);
    });
  }

  async function loadScope(targetScope) {
    const cached = resourceCache && resourceCache.get(targetScope);
    if (cached) return cached;
    const [leaders, teamStats] = await Promise.all([
      fetchJSON(
        API_CONFIG.buildUrl('/franchise/leaders')
        + '?franchise_id=' + encodeURIComponent(franchiseId)
        + '&scope=season&view_scope=' + encodeURIComponent(targetScope)
      ),
      fetchJSON(
        API_CONFIG.buildUrl('/franchise/team-stats')
        + '?franchise_id=' + encodeURIComponent(franchiseId)
        + '&scope=' + encodeURIComponent(targetScope)
      )
    ]);
    const payload = { leaders, teamStats };
    return resourceCache ? resourceCache.set(targetScope, payload) : payload;
  }

  if (!franchiseId) {
    document.getElementById('teamstats-body').innerHTML = '<tr><td colspan="27">Missing franchise_id in URL.</td></tr>';
    return;
  }
  Promise.all([
    fetchJSON(API_CONFIG.buildUrl('/franchise/command-center/data') + '?franchise_id=' + encodeURIComponent(franchiseId))
  ]).then(async ([cc]) => {
    userConference = cc.user_conference;
    userRegion = cc.user_region || '';
    resourceCache = window.ResourceCache.createResourceCache('stats', franchiseId, cc.current_season, cc.week);
    const payload = await loadScope(scope);
    leadersData = payload.leaders;
    teamStatsData = payload.teamStats;
    render();
    document.querySelectorAll('.stats-team-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const nextFilter = btn.getAttribute('data-team-filter') || 'top25';
        if (nationalTeamFilter === nextFilter) return;
        nationalTeamFilter = nextFilter;
        render();
      });
    });
    document.querySelectorAll('.stats-scope-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        scope = btn.getAttribute('data-scope') || 'conference';
        sortColumn = 'rank';
        sortDirection = 'asc';
        if (scope === 'national') {
          nationalTeamFilter = 'top25';
        }
        document.querySelectorAll('.stats-scope-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-scope') === scope));
        document.getElementById('teamstats-body').innerHTML = '<tr><td colspan="27">Loading stats...</td></tr>';
        const nextPayload = await loadScope(scope);
        leadersData = nextPayload.leaders;
        teamStatsData = nextPayload.teamStats;
        render();
      });
    });
  }).catch(err => {
    document.getElementById('teamstats-body').innerHTML = '<tr><td colspan="27">Failed to load stats.</td></tr>';
    console.error(err);
  });
})();
  </script>
</body>
</html>
