<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Tag Manager (production only) -->
  <script src="/js/shared/gtm-loader.js"></script>
  <!-- End Google Tag Manager -->
  <script src="/js/shared/authGuard.js"></script>
  <script src="/js/shared/sentryInit.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Player Profile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #ffffff;
      min-height: 100vh;
      padding: 20px;
    }

    .page-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      margin-bottom: 30px;
      backdrop-filter: blur(10px);
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(-4px);
    }

    .header-info {
      flex: 1;
      text-align: center;
    }

    .player-name-header {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 4px;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .team-info-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 1.1rem;
      color: #FFD700;
    }

    .team-logo-header {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    /* Main Content Grid */
    .content-grid {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }

    /* Portrait Panel */
    .portrait-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .portrait-container {
      position: relative;
      width: 100%;
      padding-top: 133.33%; /* 3:4 aspect ratio */
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .player-headshot {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .vitals-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .vitals-name {
      font-size: 1.3rem;
      font-weight: bold;
    }

    .vitals-physical {
      font-size: 1.1rem;
      color: #FFD700;
      font-weight: 600;
    }

    /* Attributes Panel */
    .attributes-panel {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 30px;
      backdrop-filter: blur(10px);
    }

    .attributes-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
    }

    .attribute-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: #FFD700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      border-bottom: 2px solid #FFD700;
      padding-bottom: 4px;
    }

    .attribute-row {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }

    .attribute-bar-container {
      flex: 1;
      height: 28px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }

    .attribute-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #FFD700 0%, #FFA500 100%);
      transition: width 0.6s ease-out;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
    }

    .attribute-label {
      font-size: 0.85rem;
      font-weight: bold;
      color: #1a1a1a;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
      white-space: nowrap;
    }

    .attribute-value {
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      min-width: 30px;
      text-align: right;
    }

    /* Abilities Panel (inside attributes) */
    .abilities-panel {
      grid-column: 1 / -1; /* Span all columns */
      margin-top: 20px;
    }

    /* Scouting Report Panel (full width) */
    .scouting-report-panel {
      margin-top: 30px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 40px;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }

    .panel-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #FFD700;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* Responsive Design */
    @media (max-width: 1200px) {
      .content-grid {
        grid-template-columns: 350px 1fr;
      }

      .attributes-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 968px) {
      .content-grid {
        grid-template-columns: 1fr;
      }

      .portrait-container {
        padding-top: 100%; /* Square on smaller screens */
      }

      .player-name-header {
        font-size: 1.5rem;
      }

      .team-info-header {
        font-size: 1rem;
      }
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .header {
        padding: 15px;
        flex-direction: column;
        gap: 15px;
      }

      .header-info {
        order: -1;
      }

      .back-button {
        width: 100%;
        justify-content: center;
      }

      .attributes-panel {
        padding: 20px;
      }

      .panel {
        padding: 30px 20px;
      }
    }

    /* Loading State */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
      font-size: 1.5rem;
      color: #FFD700;
    }

    /* Error State */
    .error {
      background: rgba(255, 0, 0, 0.1);
      border: 2px solid rgba(255, 0, 0, 0.3);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      color: #ff6b6b;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K69GQK3D"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <div class="page-container">
    <div id="content">
      <div class="loading">Loading player data...</div>
    </div>
  </div>

  <script src="/js/config/api-config.js"></script>
  <script src="/common.js"></script>
  <script>
    const ATTRIBUTE_GROUPS = {
      OFFENSE: ['SC', 'SH'],
      SKILLS: ['PS', 'BH'],
      PHYSICAL: ['AG', 'ND'],
      DEFENSE: ['ID', 'OD'],
      'DIRTY WORK': ['RB', 'ST'],
      MIND: ['IQ', 'FT']
    };

    const ATTRIBUTE_NAMES = {
      SC: 'Scoring',
      SH: 'Shooting',
      PS: 'Passing',
      BH: 'Ball Handling',
      AG: 'Agility',
      ND: 'Endurance',
      ID: 'Interior Defense',
      OD: 'Outside Defense',
      RB: 'Rebounding',
      ST: 'Steal',
      IQ: 'Basketball IQ',
      FT: 'Free Throw'
    };

    async function loadPlayerData() {
      const params = new URLSearchParams(window.location.search);
      const playerId = params.get('id');
      const mode = params.get('mode');
      const franchiseId = params.get('franchise_id');
      const tournamentId = params.get('tournament_id');
      const gameId = params.get('game_id');
      
      if (!playerId) {
        showError('No player ID provided');
        return;
      }

      try {
        const qs = new URLSearchParams();
        if (mode) qs.set('mode', mode);
        if (franchiseId) qs.set('franchise_id', franchiseId);
        if (tournamentId) qs.set('tournament_id', tournamentId);
        if (gameId) qs.set('game_id', gameId);

        const apiUrl = API_CONFIG.buildUrl(`/player/${encodeURIComponent(playerId)}`);
        const response = await fetch(qs.toString() ? `${apiUrl}?${qs.toString()}` : apiUrl);
        
        if (!response.ok) {
          throw new Error(`Failed to load player: ${response.statusText}`);
        }

        const player = await response.json();
        console.log('Player data loaded:', player);
        
        renderPlayerPage(player);
      } catch (error) {
        console.error('Error loading player:', error);
        showError(`Failed to load player data: ${error.message}`);
      }
    }

    function renderPlayerPage(player) {
      const content = document.getElementById('content');
      const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const staticPrefix = isLocalhost ? '/static' : '';
      
      // Extract data with fallbacks
      const firstName = player.first_name || '';
      const lastName = player.last_name || '';
      const fullName = `${firstName} ${lastName}`.trim() || 'Unknown Player';
      const rawTeam = player.team || 'Free Agent';
      const team = normalizeTeamName(rawTeam);
      const height = formatHeight(player.height || player.HT || 75);
      const weight = `${player.weight || player.WT || 200} lbs`;
      // ✅ FIX: Handle jersey number 0 - use explicit check to preserve 0
      const jersey = (typeof player.jersey === 'number') ? player.jersey : (player.jersey !== undefined && player.jersey !== null && player.jersey !== '' ? player.jersey : '');
      const fallbackPhoto = `${staticPrefix}/images/players/${player._id}.png`;
      const genericPhoto = `${staticPrefix}/images/players/generic_headshot.png`;
      const photo = normalizePhotoUrl(player.photo, staticPrefix) || fallbackPhoto;
      const attributes = player.attributes || {};
      const year = formatYear(player.year);
      
      // Get team info
      const teamId = getTeamId(team);
      const teamBackground = getTeamBackground(team, staticPrefix);
      const teamLogo = getTeamLogo(team, staticPrefix);
      
      content.innerHTML = `
        <div class="header">
          <button class="back-button" onclick="goBack()">
            ← Back
          </button>
          <div class="header-info">
            <div class="player-name-header">${fullName}</div>
            <div class="team-info-header">
              ${teamLogo ? `<img src="${teamLogo}" alt="${team}" class="team-logo-header">` : ''}
              <span>${team}</span>
              ${(jersey !== undefined && jersey !== null && jersey !== '') ? `<span>#${jersey}</span>` : ''}
            </div>
          </div>
          <div style="width: 100px;"></div>
        </div>

        <div class="content-grid">
          <div class="portrait-panel">
            <div class="portrait-container" style="background-image: url('${teamBackground}');">
              ${photo ? `<img src="${photo}" alt="${fullName}" class="player-headshot" onerror="this.onerror=null;this.src='${genericPhoto}'">` : ''}
            </div>
            <div class="vitals-bar">
              <div class="vitals-name">${year}</div>
              <div class="vitals-physical">${height} • ${weight}</div>
            </div>
          </div>

          <div class="attributes-panel">
            <div class="attributes-grid">
              ${renderAttributeGroups(attributes)}
            </div>
            
            <div class="panel abilities-panel">
              <div class="panel-title">Abilities</div>
            </div>
          </div>
        </div>

        <div class="scouting-report-panel">
          <div class="panel">
            <div class="panel-title">Scouting Report</div>
          </div>
        </div>
      `;

      // Animate bars after render
      setTimeout(() => animateAttributeBars(), 50);
    }

    function renderAttributeGroups(attributes) {
      return Object.entries(ATTRIBUTE_GROUPS)
        .map(([groupName, attrCodes]) => `
          <div class="attribute-section">
            <div class="section-title">${groupName}</div>
            ${attrCodes.map(code => renderAttributeRow(code, attributes)).join('')}
          </div>
        `).join('');
    }

    function renderAttributeRow(code, attributes) {
      // Get anchor attribute for display (not affected by energy)
      const rawValue = attributes[`anchor_${code}`] ?? attributes[code] ?? 0;
      
      // Convert to display scale (divide by 10, floor, minimum 1)
      // Allows 11, 12, etc. for attributes 110+, 120+
      const scaledValue = Math.max(1, Math.floor(rawValue / 10));
      
      // Cap fill percentage at 100% for visual consistency
      const fillPercentage = Math.min(100, scaledValue * 10);
      
      // Add tooltip using data attribute (will be applied by initAttributeTooltips)
      return `
        <div class="attribute-row">
          <div class="attribute-bar-container">
            <div class="attribute-bar-fill" data-width="${fillPercentage}" style="width: 0%;">
              <span class="attribute-label" data-attr="${code}">${code}</span>
            </div>
          </div>
          <div class="attribute-value">${scaledValue}</div>
        </div>
      `;
    }

    function animateAttributeBars() {
      const bars = document.querySelectorAll('.attribute-bar-fill');
      bars.forEach((bar, index) => {
        setTimeout(() => {
          const targetWidth = bar.getAttribute('data-width');
          bar.style.width = `${targetWidth}%`;
        }, index * 50);
      });
    }

    function formatHeight(inches) {
      const feet = Math.floor(inches / 12);
      const remainingInches = inches % 12;
      return `${feet}'${remainingInches}"`;
    }

    function formatYear(year) {
      if (!year) return 'N/A';
      const yearStr = String(year).toLowerCase();
      const yearMap = {
        'senior': 'Senior',
        'junior': 'Junior',
        'sophomore': 'Sophomore',
        'freshman': 'Freshman',
        'sr': 'Senior',
        'jr': 'Junior',
        'so': 'Sophomore',
        'fr': 'Freshman'
      };
      return yearMap[yearStr] || year;
    }

    function normalizePhotoUrl(photoUrl, staticPrefix = '') {
      if (!photoUrl || typeof photoUrl !== 'string') return '';
      const trimmed = photoUrl.trim();
      if (!trimmed) return '';

      // Normalize legacy local paths to current runtime path strategy.
      if (trimmed.startsWith('/static/images/')) {
        return `${staticPrefix}${trimmed.replace(/^\/static/, '')}`;
      }
      if (trimmed.startsWith('/images/')) {
        return `${staticPrefix}${trimmed}`;
      }
      return trimmed;
    }

    function getTeamId(teamName) {
      const teamMap = {
        'Bentley-Truman': 'BENTLEY_TRUMAN',
        'Four Corners': 'FOUR_CORNERS',
        'Lancaster': 'LANCASTER',
        'Little York': 'LITTLE_YORK',
        'Morristown': 'MORRISTOWN',
        'Ocean City': 'OCEAN_CITY',
        'South Lancaster': 'SOUTH_LANCASTER',
        'Xavien': 'XAVIEN'
      };
      return teamMap[teamName] || teamName.toUpperCase().replace(/\s+/g, '_');
    }

    function normalizeTeamName(teamName) {
      if (!teamName) return 'Free Agent';
      if (teamName.includes('_')) {
        const byId = {
          BENTLEY_TRUMAN: 'Bentley-Truman',
          FOUR_CORNERS: 'Four Corners',
          LANCASTER: 'Lancaster',
          LITTLE_YORK: 'Little York',
          MORRISTOWN: 'Morristown',
          OCEAN_CITY: 'Ocean City',
          SOUTH_LANCASTER: 'South Lancaster',
          XAVIEN: 'Xavien',
        };
        return byId[teamName] || teamName.replace(/_/g, ' ');
      }
      return teamName;
    }

    function getTeamBackground(teamName, staticPrefix = '') {
      if (typeof getTeamAssetPath === 'function') return staticPrefix + getTeamAssetPath(teamName, 'background');
      return staticPrefix + '/images/teams/general/general_background.png';
    }

    function getTeamLogo(teamName, staticPrefix = '') {
      if (typeof getTeamAssetPath === 'function') return staticPrefix + getTeamAssetPath(teamName, 'logo_square');
      return staticPrefix + '/images/teams/general/general_logo_square.png';
    }

    function goBack() {
      const params = new URLSearchParams(window.location.search);
      const returnUrl = params.get('return_url');
      if (returnUrl) {
        window.location.href = returnUrl;
        return;
      }

      // Try to go back in history, otherwise redirect to homepage
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = '/static/homepage.html';
      }
    }

    function showError(message) {
      const content = document.getElementById('content');
      content.innerHTML = `
        <div class="error">
          <h2>❌ Error</h2>
          <p>${message}</p>
          <br>
          <button class="back-button" onclick="goBack()">Go Back</button>
        </div>
      `;
    }

    // Load player on page load
    window.addEventListener('DOMContentLoaded', () => {
      loadPlayerData();
      
      // Initialize tooltips after player data is loaded
      // Use a small delay to ensure DOM is updated
      setTimeout(() => {
        if (typeof initAttributeTooltips !== 'undefined') {
          initAttributeTooltips(document, ['.attribute-label']);
        }
      }, 500);
    });
  </script>
  <script src="/js/shared/attributeTooltips.js"></script>
</body>
</html>
