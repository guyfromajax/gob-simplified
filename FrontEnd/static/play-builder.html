<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Builder - GOB</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #FFD700;
      margin-bottom: 20px;
      font-size: 2.5rem;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .step-container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 15px;
      border: 1px solid rgba(255, 215, 0, 0.2);
    }

    #step2 {
      padding: 20px 30px;
    }

    .step-subheader {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 0;
      text-align: center;
      opacity: 0.8;
    }

    .step1-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      align-items: end;
      margin-bottom: 20px;
    }

    .step1-button-wrapper {
      grid-column: 2;
      display: flex;
      justify-content: center;
    }

    .step1-button-wrapper button {
      width: 50%;
    }

    .step2-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .step2-controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      align-items: start;
    }

    .control-column {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .center-button-wrapper {
      grid-column: 1 / -1;
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .center-button-wrapper button {
      width: 36%;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #FFD700;
      font-weight: 600;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: #FFD700;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    }

    select option {
      background: #1a1a2e;
      color: #fff;
    }

    button {
      padding: 14px 28px;
      background: linear-gradient(135deg, #FF8C00, #FF6500);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      width: 100%;
      margin-top: 10px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 140, 0, 0.4);
      background: linear-gradient(135deg, #FF7700, #FF5500);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .position-chips {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .chip {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #FFD700, #FFC700);
      color: #000;
      border-radius: 50%;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      padding: 0;
    }

    .chip:hover:not(.completed) {
      transform: scale(1.1);
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.5);
    }

    .chip.completed {
      background: rgba(128, 128, 128, 0.4);
      color: rgba(255, 255, 255, 0.5);
      cursor: not-allowed;
    }

    .chip.selected {
      background: linear-gradient(135deg, #FF8C00, #FF6500);
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 140, 0, 0.6);
      transform: scale(1.1);
    }

    .step-counter {
      text-align: right;
      color: #FFD700;
      font-size: 1.1rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .court-container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 15px;
      border: 1px solid rgba(255, 215, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 200px;
      position: relative;
    }

    .court-visualization {
      position: relative;
      max-width: 60%;
    }

    .court-image {
      width: 100%;
      height: auto;
      border-radius: 8px;
      opacity: 0.8;
      display: block;
    }

    .player-icon {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.75rem;
      color: #fff;
      transform: translate(-50%, -50%);
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    .player-icon.PG { background: #ff6b6b; }
    .player-icon.SG { background: #4ecdc4; }
    .player-icon.SF { background: #45b7d1; }
    .player-icon.PF { background: #f9ca24; }
    .player-icon.C { background: #6c5ce7; }

    .hidden {
      display: none !important;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .success-message {
      background: rgba(76, 175, 80, 0.2);
      border: 1px solid rgba(76, 175, 80, 0.5);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-top: 20px;
    }

    .success-message h2 {
      color: #4CAF50;
      margin-bottom: 10px;
    }

    .json-output {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-all;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.8rem;
      }

      .step-container {
        padding: 20px;
      }

      .step1-row {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .step1-button-wrapper {
        grid-column: 1;
      }

      .step1-button-wrapper button {
        width: 100%;
      }

      .center-button-wrapper button {
        width: 80%;
      }

      .step2-header-row {
        flex-direction: column;
        gap: 10px;
        align-items: center;
      }

      .step-counter {
        text-align: center;
      }

      .step2-controls-row {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .position-chips {
        gap: 8px;
      }

      .chip {
        width: 45px;
        height: 45px;
        font-size: 0.75rem;
      }

      .court-image {
        max-width: 90%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="page-title">Create Your Play</h1>

    <!-- Step 1: Create Play -->
    <div id="step1" class="step-container">
      
      <div class="step1-row">
        <div class="form-group">
          <label for="play-name">Play Name</label>
          <input type="text" id="play-name" placeholder="Enter play name...">
        </div>

        <div class="form-group">
          <label for="play-type">Play Type</label>
          <select id="play-type">
            <option value="">-- Select Play Type --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tempo-variant">Tempo Variation</label>
          <select id="tempo-variant">
            <option value="">-- Select Tempo --</option>
          </select>
        </div>
      </div>

      <div class="step1-button-wrapper">
        <button id="submit-play-btn" disabled>Create Play</button>
      </div>
    </div>

    <!-- Step 2: Build Steps -->
    <div id="step2" class="step-container hidden">
      <div class="step2-header-row">
        <div class="step-subheader" id="play-summary" style="margin: 0;"></div>
        <div class="step-counter" id="step-counter">Step 1/6</div>
      </div>

      <div class="step2-controls-row">
        <div class="control-column">
          <div style="height: 44px; display: flex; align-items: center; justify-content: center;">
            <div class="position-chips" id="position-chips">
              <!-- Chips will be dynamically generated -->
            </div>
          </div>
        </div>

        <div class="control-column">
          <div class="form-group" style="margin-bottom: 0;">
            <label for="location-select">Location</label>
            <select id="location-select">
              <option value="">-- Select Location --</option>
            </select>
          </div>
        </div>

        <div class="control-column">
          <div class="form-group" style="margin-bottom: 0;">
            <label for="action-select">Action</label>
            <select id="action-select">
              <option value="">-- Select Action --</option>
            </select>
          </div>
        </div>

        <div class="center-button-wrapper">
          <button id="action-btn" disabled>Add Assignment</button>
        </div>
      </div>
    </div>

    <!-- Success Screen -->
    <div id="success-screen" class="step-container hidden">
      <div class="success-message">
        <h2>✅ Play Created Successfully!</h2>
        <p id="success-play-name"></p>
        <div class="json-output" id="json-output"></div>
        <button onclick="location.reload()">Create Another Play</button>
      </div>
    </div>

    <!-- Court Container (always visible below forms) -->
    <div class="court-container">
      <div class="court-visualization" id="court-visualization">
        <img src="/static/images/courts/bentley_truman.jpg" alt="Basketball Court" class="court-image">
        <div id="player-icons-container"></div>
      </div>
    </div>
  </div>

  <script>
    // Constants from backend
    const PLAYCALLS = ["Base", "Freelance", "Inside", "Attack", "Outside", "Set"];
    const POSITIONS = ["PG", "SG", "SF", "PF", "C"];
    const TEMPO_VARIANTS = {
      "fast": 3,
      "normal": 6,
      "slow": 9
    };

    // Court locations from constants.py HCO_STRING_SPOTS
    const LOCATIONS = [
      "key", "upper midWing", "lower midWing", "upper wing", "lower wing",
      "upper midCorner", "lower midCorner", "upper corner", "lower corner",
      "upper highPost", "lower highPost", "upper midPost", "lower midPost",
      "upper lowPost", "lower lowPost", "topLane", "midLane",
      "upper apex", "lower apex", "upper midBaseline", "lower midBaseline",
      "deep key", "deep lower wing", "deep lower baseline", "deep upper wing", "deep upper baseline"
    ];

    // Court coordinates (from HCO_STRING_SPOTS in constants.py)
    const HCO_STRING_SPOTS = {
      "key": {"x": 64, "y": 25},
      "upper midWing": {"x": 68, "y": 36},
      "lower midWing": {"x": 68, "y": 14},
      "upper wing": {"x": 73, "y": 40},
      "lower wing": {"x": 73, "y": 10},
      "upper midCorner": {"x": 81, "y": 43},
      "lower midCorner": {"x": 81, "y": 7},
      "upper corner": {"x": 88, "y": 44},
      "lower corner": {"x": 88, "y": 6},
      "upper highPost": {"x": 74, "y": 32},
      "lower highPost": {"x": 74, "y": 19},
      "upper midPost": {"x": 80, "y": 32},
      "lower midPost": {"x": 80, "y": 19},
      "upper lowPost": {"x": 86, "y": 32},
      "lower lowPost": {"x": 86, "y": 19},
      "topLane": {"x": 74, "y": 25},
      "midLane": {"x": 80, "y": 25},
      "upper apex": {"x": 80, "y": 36},
      "lower apex": {"x": 80, "y": 15},
      "upper midBaseline": {"x": 89, "y": 36},
      "lower midBaseline": {"x": 89, "y": 15},
      "deep key": {"x": 57, "y": 25},
      "deep lower wing": {"x": 57, "y": 15},
      "deep lower baseline": {"x": 57, "y": 5},
      "deep upper wing": {"x": 57, "y": 35},
      "deep upper baseline": {"x": 57, "y": 45}
    };

    // Actions from constants.py ACTIONS
    const ACTIONS = {
      "handle_ball": "Handle Ball",
      "pass": "Pass",
      "receive": "Receive",
      "post_up": "Post Up",
      "shoot": "Shoot",
      "screen": "Screen",
      "cut": "Cut",
      "get_open": "Get Open",
      "drift": "Drift",
      "stationary": "Stationary/Hold"
    };

    // Play state
    let playState = {
      name: "",
      type: "",
      tempo: "",
      totalSteps: 0,
      currentStep: 1,
      steps: []
    };

    // Current step assignments (position -> {location, action})
    let currentStepAssignments = {};
    
    // Currently selected position
    let selectedPosition = null;

    // Initialize
    function init() {
      populateDropdowns();
      attachEventListeners();
    }

    function populateDropdowns() {
      // Play Type
      const playTypeSelect = document.getElementById('play-type');
      PLAYCALLS.forEach(type => {
        const option = document.createElement('option');
        option.value = type;
        option.textContent = type;
        playTypeSelect.appendChild(option);
      });

      // Tempo Variant
      const tempoSelect = document.getElementById('tempo-variant');
      Object.entries(TEMPO_VARIANTS).forEach(([tempo, steps]) => {
        const option = document.createElement('option');
        option.value = tempo;
        option.textContent = `${tempo.charAt(0).toUpperCase() + tempo.slice(1)} (${steps} steps)`;
        tempoSelect.appendChild(option);
      });

      // Location
      const locationSelect = document.getElementById('location-select');
      LOCATIONS.forEach(loc => {
        const option = document.createElement('option');
        option.value = loc;
        option.textContent = loc;
        locationSelect.appendChild(option);
      });

      // Action
      const actionSelect = document.getElementById('action-select');
      Object.entries(ACTIONS).forEach(([value, label]) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = label;
        actionSelect.appendChild(option);
      });
    }

    function attachEventListeners() {
      // Step 1 form inputs
      document.getElementById('play-name').addEventListener('input', validateStep1);
      document.getElementById('play-type').addEventListener('change', validateStep1);
      document.getElementById('tempo-variant').addEventListener('change', validateStep1);
      document.getElementById('submit-play-btn').addEventListener('click', submitPlay);

      // Step 2 controls
      document.getElementById('location-select').addEventListener('change', validateActionButton);
      document.getElementById('action-select').addEventListener('change', validateActionButton);
      document.getElementById('action-btn').addEventListener('click', handleActionButton);
    }

    function renderCourtVisualization() {
      const container = document.getElementById('player-icons-container');
      container.innerHTML = '';

      // Only render if we're in step 2
      if (document.getElementById('step2').classList.contains('hidden')) {
        return;
      }

      Object.entries(currentStepAssignments).forEach(([pos, assignment]) => {
        if (!assignment || !assignment.location) return;

        const coords = HCO_STRING_SPOTS[assignment.location];
        if (!coords) return;

        const icon = document.createElement('div');
        icon.className = `player-icon ${pos}`;
        icon.textContent = pos;
        
        // Convert court coordinates (0-100 x, 0-50 y) to percentage
        // Note: Y axis - higher values are at top of court (upper), lower values at bottom (lower)
        icon.style.left = `${coords.x}%`;
        icon.style.top = `${(50 - coords.y) * 2}%`; // Invert Y so higher y values go up
        
        container.appendChild(icon);
      });
    }

    function validateStep1() {
      const name = document.getElementById('play-name').value.trim();
      const type = document.getElementById('play-type').value;
      const tempo = document.getElementById('tempo-variant').value;

      const submitBtn = document.getElementById('submit-play-btn');
      submitBtn.disabled = !(name && type && tempo);
    }

    function submitPlay() {
      playState.name = document.getElementById('play-name').value.trim();
      playState.type = document.getElementById('play-type').value;
      playState.tempo = document.getElementById('tempo-variant').value;
      playState.totalSteps = TEMPO_VARIANTS[playState.tempo];
      playState.currentStep = 1;
      playState.steps = [];

      // Update page title
      document.getElementById('page-title').textContent = 'Build Steps';

      // Show step 2, hide step 1
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');

      // Update summary
      document.getElementById('play-summary').textContent = 
        `${playState.name} | ${playState.type} | ${playState.tempo.charAt(0).toUpperCase() + playState.tempo.slice(1)}`;

      // Update step counter
      updateStepCounter();

      // Initialize position chips
      renderPositionChips();
      renderCourtVisualization();

      // Reset current step assignments
      currentStepAssignments = {};
      selectedPosition = null;
    }

    function renderPositionChips() {
      const container = document.getElementById('position-chips');
      container.innerHTML = '';

      POSITIONS.forEach(pos => {
        const chip = document.createElement('button');
        chip.className = 'chip';
        chip.id = `chip-${pos}`;
        chip.textContent = pos;
        chip.type = 'button';

        // Check if this position has both location and action
        const assignment = currentStepAssignments[pos];
        if (assignment && assignment.location && assignment.action) {
          chip.classList.add('completed');
        }

        // Highlight selected position
        if (selectedPosition === pos) {
          chip.classList.add('selected');
        }

        // Click handler
        chip.addEventListener('click', () => selectPosition(pos));

        container.appendChild(chip);
      });
    }

    function selectPosition(pos) {
      // Don't select completed positions
      const assignment = currentStepAssignments[pos];
      if (assignment && assignment.location && assignment.action) {
        return;
      }

      selectedPosition = pos;
      renderPositionChips();
      validateActionButton();
    }

    function validateActionButton() {
      const location = document.getElementById('location-select').value;
      const action = document.getElementById('action-select').value;
      const actionBtn = document.getElementById('action-btn');
      
      // Check if all positions are complete
      let allComplete = true;
      for (const pos of POSITIONS) {
        const assignment = currentStepAssignments[pos];
        if (!assignment || !assignment.location || !assignment.action) {
          allComplete = false;
          break;
        }
      }

      if (allComplete) {
        // All positions complete - show Submit Step
        actionBtn.textContent = 'Submit Step';
        actionBtn.disabled = false;
      } else {
        // Still adding assignments
        actionBtn.textContent = 'Add Assignment';
        actionBtn.disabled = !(selectedPosition && location && action);
      }
    }

    function handleActionButton() {
      const actionBtn = document.getElementById('action-btn');
      
      // Check if button is in Submit Step mode
      if (actionBtn.textContent === 'Submit Step') {
        submitStep();
      } else {
        addAssignment();
      }
    }

    function addAssignment() {
      const location = document.getElementById('location-select').value;
      const action = document.getElementById('action-select').value;

      if (!selectedPosition) {
        alert('Please select a position chip.');
        return;
      }

      if (!location) {
        alert('Please select a location.');
        return;
      }

      if (!action) {
        alert('Please select an action.');
        return;
      }

      // Store assignment
      if (!currentStepAssignments[selectedPosition]) {
        currentStepAssignments[selectedPosition] = {};
      }
      currentStepAssignments[selectedPosition].location = location;
      currentStepAssignments[selectedPosition].action = action;

      // Update chips and court
      renderPositionChips();
      renderCourtVisualization();

      // Reset state
      selectedPosition = null;
      document.getElementById('location-select').value = '';
      document.getElementById('action-select').value = '';

      // Update button state
      validateActionButton();
    }

    function submitStep() {
      // Calculate timestamp (300ms increments, 0-indexed)
      const timestamp = (playState.currentStep - 1) * 300;

      // Build step data structure
      const stepData = {
        timestamp: timestamp,
        pos_actions: {},
        events: []
      };

      // Populate pos_actions
      POSITIONS.forEach(pos => {
        const assignment = currentStepAssignments[pos];
        stepData.pos_actions[pos] = {
          location: assignment.location,
          action: assignment.action
        };
      });

      // Add to play steps
      playState.steps.push(stepData);

      // Check if we're done
      if (playState.currentStep >= playState.totalSteps) {
        showSuccess();
        return;
      }

      // Move to next step
      playState.currentStep++;
      currentStepAssignments = {};
      selectedPosition = null;
      renderPositionChips();
      renderCourtVisualization();
      validateActionButton();
      updateStepCounter();

      // Reset dropdowns
      document.getElementById('location-select').value = '';
      document.getElementById('action-select').value = '';
    }

    function updateStepCounter() {
      document.getElementById('step-counter').textContent = 
        `Step ${playState.currentStep}/${playState.totalSteps}`;
    }

    function showSuccess() {
      // Hide step 2
      document.getElementById('step2').classList.add('hidden');

      // Show success screen
      document.getElementById('success-screen').classList.remove('hidden');
      document.getElementById('success-play-name').textContent = 
        `Play "${playState.name}" has been created successfully!`;

      // Build final JSON structure
      const playJSON = {
        name: playState.name,
        type: playState.type,
        skeletons: {
          [playState.tempo]: {
            steps: playState.steps
          }
        }
      };

      document.getElementById('json-output').textContent = JSON.stringify(playJSON, null, 2);
    }

    // Start
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
