<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Builder - GOB</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #FFD700;
      margin-bottom: 30px;
      font-size: 2.5rem;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .step-container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 30px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 215, 0, 0.2);
    }

    .step-header {
      font-size: 1.8rem;
      color: #FFD700;
      margin-bottom: 20px;
      text-align: center;
    }

    .step-subheader {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 20px;
      text-align: center;
      opacity: 0.8;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #FFD700;
      font-weight: 600;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus,
    select:focus {
      outline: none;
      border-color: #FFD700;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    }

    select option {
      background: #1a1a2e;
      color: #fff;
    }

    button {
      padding: 14px 28px;
      background: linear-gradient(135deg, #FFD700, #FFC700);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      width: 100%;
      margin-top: 10px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .position-chips {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .chip {
      padding: 10px 20px;
      background: linear-gradient(135deg, #FFD700, #FFC700);
      color: #000;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      min-width: 60px;
      text-align: center;
    }

    .chip.completed {
      background: rgba(128, 128, 128, 0.4);
      color: rgba(255, 255, 255, 0.5);
    }

    .step-counter {
      text-align: right;
      color: #FFD700;
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 20px;
    }

    .court-container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 20px;
      border: 1px solid rgba(255, 215, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
    }

    .court-image {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      opacity: 0.8;
    }

    .hidden {
      display: none !important;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .success-message {
      background: rgba(76, 175, 80, 0.2);
      border: 1px solid rgba(76, 175, 80, 0.5);
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-top: 20px;
    }

    .success-message h2 {
      color: #4CAF50;
      margin-bottom: 10px;
    }

    .json-output {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-break: break-all;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.8rem;
      }

      .step-container {
        padding: 20px;
      }

      .position-chips {
        gap: 8px;
      }

      .chip {
        padding: 8px 16px;
        font-size: 0.85rem;
        min-width: 50px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏀 Play Builder</h1>

    <!-- Step 1: Create Play -->
    <div id="step1" class="step-container">
      <div class="step-header">Create Play</div>
      
      <div class="form-group">
        <label for="play-name">Play Name</label>
        <input type="text" id="play-name" placeholder="Enter play name...">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="play-type">Play Type</label>
          <select id="play-type">
            <option value="">-- Select Play Type --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="tempo-variant">Tempo Variation</label>
          <select id="tempo-variant">
            <option value="">-- Select Tempo --</option>
          </select>
        </div>
      </div>

      <button id="submit-play-btn" disabled>Create Play</button>
    </div>

    <!-- Step 2: Build Steps -->
    <div id="step2" class="step-container hidden">
      <div class="step-header">Build Steps</div>
      <div class="step-subheader" id="play-summary"></div>

      <div class="position-chips" id="position-chips">
        <!-- Chips will be dynamically generated -->
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="position-select">Position</label>
          <select id="position-select">
            <option value="">-- Select Position --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="location-select">Location</label>
          <select id="location-select">
            <option value="">-- Select Location --</option>
          </select>
        </div>

        <div class="form-group">
          <label for="action-select">Action</label>
          <select id="action-select">
            <option value="">-- Select Action --</option>
          </select>
        </div>
      </div>

      <button id="add-assignment-btn">Add Assignment</button>
      <button id="submit-step-btn" disabled>Submit Step</button>

      <div class="step-counter" id="step-counter">Step 1/6</div>
    </div>

    <!-- Success Screen -->
    <div id="success-screen" class="step-container hidden">
      <div class="success-message">
        <h2>✅ Play Created Successfully!</h2>
        <p id="success-play-name"></p>
        <div class="json-output" id="json-output"></div>
        <button onclick="location.reload()">Create Another Play</button>
      </div>
    </div>

    <!-- Court Container (always visible below forms) -->
    <div class="court-container">
      <img src="/static/images/courts/bentley_truman.jpg" alt="Basketball Court" class="court-image">
    </div>
  </div>

  <script>
    // Constants from backend
    const PLAYCALLS = ["Base", "Freelance", "Inside", "Attack", "Outside", "Set"];
    const POSITIONS = ["PG", "SG", "SF", "PF", "C"];
    const TEMPO_VARIANTS = {
      "fast": 3,
      "normal": 6,
      "slow": 9
    };

    // Court locations from constants.py HCO_STRING_SPOTS
    const LOCATIONS = [
      "key", "upper midWing", "lower midWing", "upper wing", "lower wing",
      "upper midCorner", "lower midCorner", "upper corner", "lower corner",
      "upper highPost", "lower highPost", "upper midPost", "lower midPost",
      "upper lowPost", "lower lowPost", "topLane", "midLane",
      "upper apex", "lower apex", "upper midBaseline", "lower midBaseline",
      "deep key", "deep lower wing", "deep lower baseline", "deep upper wing", "deep upper baseline"
    ];

    // Actions from constants.py ACTIONS
    const ACTIONS = {
      "handle_ball": "Handle Ball",
      "pass": "Pass",
      "receive": "Receive",
      "post_up": "Post Up",
      "shoot": "Shoot",
      "screen": "Screen",
      "cut": "Cut",
      "get_open": "Get Open",
      "drift": "Drift",
      "stationary": "Stationary/Hold"
    };

    // Play state
    let playState = {
      name: "",
      type: "",
      tempo: "",
      totalSteps: 0,
      currentStep: 1,
      steps: []
    };

    // Current step assignments (position -> {location, action})
    let currentStepAssignments = {};

    // Initialize
    function init() {
      populateDropdowns();
      attachEventListeners();
    }

    function populateDropdowns() {
      // Play Type
      const playTypeSelect = document.getElementById('play-type');
      PLAYCALLS.forEach(type => {
        const option = document.createElement('option');
        option.value = type;
        option.textContent = type;
        playTypeSelect.appendChild(option);
      });

      // Tempo Variant
      const tempoSelect = document.getElementById('tempo-variant');
      Object.entries(TEMPO_VARIANTS).forEach(([tempo, steps]) => {
        const option = document.createElement('option');
        option.value = tempo;
        option.textContent = `${tempo.charAt(0).toUpperCase() + tempo.slice(1)} (${steps} steps)`;
        tempoSelect.appendChild(option);
      });

      // Position
      const positionSelect = document.getElementById('position-select');
      POSITIONS.forEach(pos => {
        const option = document.createElement('option');
        option.value = pos;
        option.textContent = pos;
        positionSelect.appendChild(option);
      });

      // Location
      const locationSelect = document.getElementById('location-select');
      LOCATIONS.forEach(loc => {
        const option = document.createElement('option');
        option.value = loc;
        option.textContent = loc;
        locationSelect.appendChild(option);
      });

      // Action
      const actionSelect = document.getElementById('action-select');
      Object.entries(ACTIONS).forEach(([value, label]) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = label;
        actionSelect.appendChild(option);
      });
    }

    function attachEventListeners() {
      // Step 1 form inputs
      document.getElementById('play-name').addEventListener('input', validateStep1);
      document.getElementById('play-type').addEventListener('change', validateStep1);
      document.getElementById('tempo-variant').addEventListener('change', validateStep1);
      document.getElementById('submit-play-btn').addEventListener('click', submitPlay);

      // Step 2 controls
      document.getElementById('add-assignment-btn').addEventListener('click', addAssignment);
      document.getElementById('submit-step-btn').addEventListener('click', submitStep);
    }

    function validateStep1() {
      const name = document.getElementById('play-name').value.trim();
      const type = document.getElementById('play-type').value;
      const tempo = document.getElementById('tempo-variant').value;

      const submitBtn = document.getElementById('submit-play-btn');
      submitBtn.disabled = !(name && type && tempo);
    }

    function submitPlay() {
      playState.name = document.getElementById('play-name').value.trim();
      playState.type = document.getElementById('play-type').value;
      playState.tempo = document.getElementById('tempo-variant').value;
      playState.totalSteps = TEMPO_VARIANTS[playState.tempo];
      playState.currentStep = 1;
      playState.steps = [];

      // Show step 2, hide step 1
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');

      // Update summary
      document.getElementById('play-summary').textContent = 
        `${playState.name} | ${playState.type} | ${playState.tempo.charAt(0).toUpperCase() + playState.tempo.slice(1)}`;

      // Update step counter
      updateStepCounter();

      // Initialize position chips
      renderPositionChips();

      // Reset current step assignments
      currentStepAssignments = {};
    }

    function renderPositionChips() {
      const container = document.getElementById('position-chips');
      container.innerHTML = '';

      POSITIONS.forEach(pos => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.id = `chip-${pos}`;
        chip.textContent = pos;

        // Check if this position has both location and action
        const assignment = currentStepAssignments[pos];
        if (assignment && assignment.location && assignment.action) {
          chip.classList.add('completed');
        }

        container.appendChild(chip);
      });
    }

    function addAssignment() {
      const position = document.getElementById('position-select').value;
      const location = document.getElementById('location-select').value;
      const action = document.getElementById('action-select').value;

      if (!position) {
        alert('Please select a position.');
        return;
      }

      if (!location) {
        alert('Please select a location.');
        return;
      }

      if (!action) {
        alert('Please select an action.');
        return;
      }

      // Store assignment
      if (!currentStepAssignments[position]) {
        currentStepAssignments[position] = {};
      }
      currentStepAssignments[position].location = location;
      currentStepAssignments[position].action = action;

      // Update chips
      renderPositionChips();

      // Reset dropdowns
      document.getElementById('position-select').value = '';
      document.getElementById('location-select').value = '';
      document.getElementById('action-select').value = '';

      // Check if all positions are assigned
      validateStep2();
    }

    function validateStep2() {
      let allAssigned = true;

      for (const pos of POSITIONS) {
        const assignment = currentStepAssignments[pos];
        if (!assignment || !assignment.location || !assignment.action) {
          allAssigned = false;
          break;
        }
      }

      document.getElementById('submit-step-btn').disabled = !allAssigned;
    }

    function submitStep() {
      // Calculate timestamp (300ms increments, 0-indexed)
      const timestamp = (playState.currentStep - 1) * 300;

      // Build step data structure
      const stepData = {
        timestamp: timestamp,
        pos_actions: {},
        events: []
      };

      // Populate pos_actions
      POSITIONS.forEach(pos => {
        const assignment = currentStepAssignments[pos];
        stepData.pos_actions[pos] = {
          location: assignment.location,
          action: assignment.action
        };
      });

      // Add to play steps
      playState.steps.push(stepData);

      // Check if we're done
      if (playState.currentStep >= playState.totalSteps) {
        showSuccess();
        return;
      }

      // Move to next step
      playState.currentStep++;
      currentStepAssignments = {};
      renderPositionChips();
      validateStep2();
      updateStepCounter();

      // Reset dropdowns
      document.getElementById('position-select').value = '';
      document.getElementById('location-select').value = '';
      document.getElementById('action-select').value = '';
    }

    function updateStepCounter() {
      document.getElementById('step-counter').textContent = 
        `Step ${playState.currentStep}/${playState.totalSteps}`;
    }

    function showSuccess() {
      // Hide step 2
      document.getElementById('step2').classList.add('hidden');

      // Show success screen
      document.getElementById('success-screen').classList.remove('hidden');
      document.getElementById('success-play-name').textContent = 
        `Play "${playState.name}" has been created successfully!`;

      // Build final JSON structure
      const playJSON = {
        name: playState.name,
        type: playState.type,
        skeletons: {
          [playState.tempo]: {
            steps: playState.steps
          }
        }
      };

      document.getElementById('json-output').textContent = JSON.stringify(playJSON, null, 2);
    }

    // Start
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
