<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/shared/authGuard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>News</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/franchise-command-center.css">
  <link rel="stylesheet" href="/resource-pages.css">
  <style>
    .news-page-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-bottom: 16px;
    }

    .news-page-header .brand-back-link {
      justify-self: start;
    }

    .brand-back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      height: auto;
      padding: 0;
      background: none;
      color: rgba(255, 255, 255, 0.76);
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.01em;
      text-decoration: none;
      border: 0;
      box-shadow: none;
      backdrop-filter: none;
      transition: color 0.18s ease, transform 0.18s ease;
    }

    .brand-back-link:hover {
      background: none;
      color: #ffffff;
      transform: translateX(-1px);
    }

    .brand-back-link::before {
      content: "←";
      font-size: 16px;
      line-height: 1;
    }

    .news-page-title {
      margin: 0 !important;
      text-align: center;
    }

    .news-feed {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      max-width: 860px;
      margin: 0 auto;
    }

    .news-week-card,
    .news-story-card {
      min-width: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 18%),
        linear-gradient(180deg, rgba(42, 48, 58, 0.92), rgba(30, 35, 44, 0.95));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 14px 28px rgba(7, 10, 16, 0.28);
      overflow: hidden;
    }

    .news-week-title {
      padding: 10px 14px 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 0.03em;
      color: #f7f9ff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
    }

    .news-week-body {
      padding: 6px 14px 10px;
    }

    .news-headline-link {
      display: block;
      padding: 9px 2px;
      color: rgba(255, 255, 255, 0.9);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      transition: color 0.15s ease;
    }

    .news-headline-link:last-child {
      border-bottom: 0;
    }

    .news-headline-link:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    .news-story-headline {
      padding: 14px 16px 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: 0.03em;
      color: #f7f9ff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
    }

    .news-story-meta {
      padding: 10px 16px 0;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
    }

    .news-story-body {
      padding: 8px 16px 16px;
    }

    .news-story-line {
      margin: 0 0 10px;
      color: rgba(255, 255, 255, 0.9);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.55;
    }

    .news-story-line:last-child {
      margin-bottom: 0;
    }

    .news-empty {
      padding: 24px 12px;
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.68);
    }

    .news-back-to-list {
      display: inline-block;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="resource-page-container fcc-brand-page-shell">
    <div class="news-page-header">
      <a id="back-btn" class="brand-back-link" href="#">Back to Locker Room</a>
      <h1 id="news-page-title" class="news-page-title">News</h1>
      <div></div>
    </div>
    <div id="news-container" class="news-feed"></div>
  </div>
  <script src="/js/config/api-config.js"></script>
  <script src="/common.js"></script>
  <script src="/news.js"></script>
  <script type="module">
    import { resumeFranchiseTrack } from '/js/musicController.js';
    resumeFranchiseTrack();
  </script>
</body>
</html>
