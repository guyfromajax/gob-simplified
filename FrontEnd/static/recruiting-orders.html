<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/shared/authGuard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Recruiting Orders</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/franchise-command-center.css">
  <link rel="stylesheet" href="/resource-pages.css">
  <link rel="stylesheet" href="/recruiting.css">
</head>
<body>
  <div class="resource-page-container fcc-brand-page-shell recruiting-page recruiting-orders-shell">
    <div class="gob-page-header recruiting-header">
      <button id="back-btn" class="brand-back-link" type="button">Back To Locker Room</button>
      <h1 id="orders-title">Recruiting Orders</h1>
      <div class="gob-page-header-actions recruiting-actions">
        <button id="save-btn" class="gob-action-btn is-dead" type="button" disabled>Save Orders</button>
        <button id="run-btn" class="gob-action-btn is-green is-dead" type="button" disabled style="display:none;">Run Recruiting</button>
      </div>
    </div>

    <div class="recruiting-orders-sticky-scope">
    <div id="visits-dock-section" class="recruiting-visits-dock-contents recruiting-v2-dock-section" hidden>
      <div id="invite-dock" class="invite-dock" role="region" aria-label="Your invite list">
        <div class="invite-dock-header">
          <div class="invite-dock-title-wrap">
            <h2>Your Invite List</h2>
            <div class="invite-dock-meta">
              <div id="position-breakdown" class="position-breakdown" aria-label="Position breakdown"></div>
              <span id="meta-first-divider" class="invite-dock-divider" aria-hidden="true" hidden></span>
              <div id="leaning-badge" class="leaning-badge" hidden></div>
              <span id="leaning-divider" class="invite-dock-divider" aria-hidden="true" hidden></span>
              <button id="fill-more-link" class="fill-more-link" type="button" hidden></button>
            </div>
          </div>
          <div class="invite-counter" aria-label="Invite list count">
            <span id="invite-count">0</span><span class="invite-counter-total">/ 20</span>
          </div>
        </div>
        <div id="invite-slot-grid" class="invite-slot-grid" aria-label="Invite list slots"></div>
      </div>
    </div>

    <section id="orders-table-section" class="gob-page-panel recruiting-section">
      <p id="orders-help" class="gob-page-help recruiting-help">Rank up to 20 recruits. Drag and drop rows or use the up/down buttons to adjust priority.</p>
      <p id="orders-status" class="gob-page-status recruiting-status-text"></p>
      <div class="gob-data-grid-shell">
        <div class="gob-data-grid-scroll scroll-x">
        <table class="gob-data-grid orders-grid-table" id="orders-grid-table">
          <thead id="orders-grid-head"></thead>
          <tbody id="orders-grid-body"></tbody>
        </table>
      </div>
      </div>
    </section>

    <section class="gob-page-panel recruiting-section">
      <div class="gob-page-panel-header recruiting-pool-header">
        <h2 id="recruit-pool-title">All Recruits</h2>
        <button id="show-only-picks-toggle" class="recruiting-pill-toggle" type="button" aria-pressed="false" hidden>Show only my picks</button>
      </div>
      <div id="recruit-pool-filters" class="recruit-pool-filters" hidden>
        <div class="region-chip-group" aria-label="Region filter">
          <button class="region-chip is-active" type="button" data-region="all">All</button>
          <button class="region-chip" type="button" data-region="A">A</button>
          <button class="region-chip" type="button" data-region="B">B</button>
          <button class="region-chip" type="button" data-region="C">C</button>
          <button class="region-chip" type="button" data-region="D">D</button>
          <button class="region-chip" type="button" data-region="E">E</button>
          <button class="region-chip" type="button" data-region="F">F</button>
          <button class="region-chip" type="button" data-region="G">G</button>
          <button class="region-chip" type="button" data-region="H">H</button>
        </div>
        <label class="recruit-search-wrap">
          <span>Search</span>
          <input id="recruit-search" type="search" autocomplete="off">
        </label>
        <label class="rt-min-wrap">
          <span>RT Min <strong id="rt-min-value">35</strong></span>
          <input id="rt-min-slider" type="range" min="0" max="100" step="1" value="35">
        </label>
        <label class="leans-only-wrap">
          <input id="leans-only-checkbox" type="checkbox">
          <span>Leaning toward you only</span>
        </label>
      </div>
      <div class="gob-data-grid-shell">
        <div class="gob-data-grid-scroll scroll-x">
        <table id="recruits-table" class="gob-data-grid recruiting-table">
          <thead>
            <tr>
              <th data-sort-key="name">Recruit</th>
              <th data-sort-key="homeRegion">Home Region</th>
              <th data-sort-key="archetype">Archetype</th>
              <th data-sort-key="height">HT</th>
              <th data-sort-key="weight">WT</th>
              <th data-sort-key="pos">POS</th>
              <th data-sort-key="SC">SC</th>
              <th data-sort-key="SH">SH</th>
              <th data-sort-key="ID">ID</th>
              <th data-sort-key="OD">OD</th>
              <th data-sort-key="PS">PS</th>
              <th data-sort-key="BH">BH</th>
              <th data-sort-key="RB">RB</th>
              <th data-sort-key="AG">AG</th>
              <th data-sort-key="ST">ST</th>
              <th data-sort-key="ND">ND</th>
              <th data-sort-key="IQ">IQ</th>
              <th data-sort-key="FT">FT</th>
              <th data-sort-key="rt">RT</th>
              <th data-sort-key="lean">Current Lean</th>
              <th>Add</th>
            </tr>
          </thead>
          <tbody id="recruits-body"></tbody>
        </table>
      </div>
      </div>
    </section>
    </div>

  </div>

  <div id="recruiting-modal-backdrop" class="gob-modal-overlay recruiting-modal-backdrop" aria-hidden="true">
    <div class="gob-modal-backdrop"></div>
    <div class="gob-modal-box recruiting-modal" role="dialog" aria-modal="true" aria-labelledby="recruiting-modal-title">
      <div id="recruiting-modal-accent" class="gob-modal-accent"></div>
      <div class="gob-modal-body">
        <h3 id="recruiting-modal-title" class="gob-modal-title">Recruiting</h3>
        <p id="recruiting-modal-message" class="gob-modal-subtitle"></p>
      </div>
      <div id="recruiting-modal-actions" class="gob-modal-actions recruiting-modal-actions"></div>
    </div>
  </div>

  <script src="/js/config/api-config.js"></script>
  <script src="/common.js"></script>
  <script src="/js/shared/attributeTooltips.js"></script>
  <script src="/recruiting-common.js"></script>
  <script src="/recruiting-orders.js"></script>
</body>
</html>
