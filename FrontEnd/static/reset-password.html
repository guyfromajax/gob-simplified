<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/shared/gtm-loader.js"></script>
  <script src="/js/shared/authGuard.js"></script>
  <script src="/js/shared/sentryInit.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>Reset Password - Geeked Out Basketball</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/auth.css">
</head>
<body>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K69GQK3D" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <img id="alpha-badge" class="alpha-badge" src="/images/alpha_badge_gold.png" alt="Alpha">

  <img class="auth-logo" src="/images/geekedout_logo.png" alt="Geeked Out Basketball">
  <div class="auth-container">
    <!-- Request reset (no token in URL) -->
    <div id="request-section">
      <h1 class="auth-title">FORGOT PASSWORD</h1>
      <p class="auth-subtitle">Enter your email and we’ll send you a link to reset your password.</p>
      <form id="request-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="you@example.com">
        </div>
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message" style="display: none;"></div>
        <button type="submit" class="auth-button">
          <span id="request-button-text">SEND RESET LINK</span>
          <span id="request-button-loading" style="display: none;">Sending...</span>
        </button>
      </form>
    </div>

    <!-- Set new password (token in URL) -->
    <div id="set-section" style="display: none;">
      <h1 class="auth-title">SET NEW PASSWORD</h1>
      <form id="set-form" class="auth-form">
        <div class="form-group">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" name="new_password" required minlength="8" maxlength="128" placeholder="At least 8 characters">
          <div class="form-hint">8–128 characters with at least one letter and one number</div>
        </div>
        <div class="form-group">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirm_password" required placeholder="Confirm your password">
        </div>
        <div id="set-error-message" class="error-message"></div>
        <div id="set-success-message" class="success-message" style="display: none;"></div>
        <button type="submit" class="auth-button">
          <span id="set-button-text">UPDATE PASSWORD</span>
          <span id="set-button-loading" style="display: none;">Updating...</span>
        </button>
      </form>
    </div>

    <div class="auth-footer">
      <a href="/login.html">Back to log in</a>
    </div>
    <a href="/mode-select.html" class="back-link">← Back to Game</a>
  </div>

  <script src="/js/config/api-config.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    async function initPage() {
      try {
        const config = await API_CONFIG.loadAppConfig();
        if (config.isAlpha) document.getElementById('alpha-badge').classList.add('visible');
      } catch (e) { console.error('Config load failed:', e); }

      if (token) {
        document.getElementById('request-section').style.display = 'none';
        document.getElementById('set-section').style.display = 'block';
      }
    }

    // Request reset link
    document.getElementById('request-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const errorEl = document.getElementById('error-message');
      const successEl = document.getElementById('success-message');
      const btnText = document.getElementById('request-button-text');
      const btnLoading = document.getElementById('request-button-loading');
      const submitBtn = document.querySelector('#request-form button[type="submit"]');

      errorEl.textContent = '';
      errorEl.style.display = 'none';
      successEl.style.display = 'none';
      btnText.style.display = 'none';
      btnLoading.style.display = 'inline';
      submitBtn.disabled = true;

      try {
        const res = await fetch(API_CONFIG.buildUrl('/api/auth/reset-request'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Request failed');
        }
        successEl.textContent = data.message || 'If an account exists with that email, you will receive a reset link shortly.';
        successEl.style.display = 'block';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      } finally {
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';
        submitBtn.disabled = false;
      }
    });

    // Set new password
    document.getElementById('set-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const errorEl = document.getElementById('set-error-message');
      const successEl = document.getElementById('set-success-message');
      const btnText = document.getElementById('set-button-text');
      const btnLoading = document.getElementById('set-button-loading');
      const submitBtn = document.querySelector('#set-form button[type="submit"]');

      errorEl.textContent = '';
      errorEl.style.display = 'none';
      successEl.style.display = 'none';

      if (newPassword !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match';
        errorEl.style.display = 'block';
        return;
      }

      btnText.style.display = 'none';
      btnLoading.style.display = 'inline';
      submitBtn.disabled = true;

      try {
        const res = await fetch(API_CONFIG.buildUrl('/api/auth/reset-password'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: newPassword })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || 'Update failed');
        }
        successEl.textContent = data.message + ' ';
        successEl.innerHTML += '<a href="/login.html">Log in</a>';
        successEl.style.display = 'block';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      } finally {
        btnText.style.display = 'inline';
        btnLoading.style.display = 'none';
        submitBtn.disabled = false;
      }
    });

    initPage();
  </script>
</body>
</html>
