<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recruiting Orders v2 — Polished Dock</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="recruiting.css" />
  <link rel="stylesheet" href="recruiting-v2.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script src="recruiting-data.js"></script>
  <script type="text/babel" src="recruiting-shared.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="recruiting-variant-b-v2.jsx"></script>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "preFill": 19,
      "leansDefaultOn": false
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
      const recruits = window.MOCK_RECRUITS;

      const initialPicks = useMemo(() => {
        const sorted = window.RecShared.sortRecruits(recruits, 'rt', 'desc');
        return sorted.slice(0, tweaks.preFill);
      }, []); // eslint-disable-line

      const [picks, setPicks] = useState(initialPicks);

      // Reset when preFill changes via tweaks
      useEffect(() => {
        const sorted = window.RecShared.sortRecruits(recruits, 'rt', 'desc');
        setPicks(sorted.slice(0, tweaks.preFill));
      }, [tweaks.preFill]); // eslint-disable-line

      const [filters, setFilters] = useState({
        regions: [],
        rtMin: 35,
        search: '',
        leansOnly: tweaks.leansDefaultOn
      });

      // If user toggles the default-on tweak, reflect it in current filters
      useEffect(() => {
        setFilters(f => ({ ...f, leansOnly: tweaks.leansDefaultOn }));
      }, [tweaks.leansDefaultOn]);

      const [sort, setSort] = useState({ key: 'rt', dir: 'desc' });
      const [showOnlyMine, setShowOnlyMine] = useState(false);

      return (
        <div className="proto-shell">
          <header className="proto-header">
            <button type="button" className="proto-header-back">Back to Locker Room</button>
            <h1>RECRUITING ORDERS</h1>
            <div className="proto-header-actions">
              <span className="proto-week-badge">Week 22 · 5 of 7 weeks</span>
              <button type="button" className="proto-action-btn" disabled={picks.length === 0}>
                Save Orders
              </button>
            </div>
          </header>

          <p className="proto-help">
            Add up to <strong>20 recruits</strong> to your invite list and stack-rank them. Coaches with full lists land more recruits — there's no reason not to fill all 20.
          </p>

          <window.VariantBV2
            recruits={recruits}
            picks={picks}
            setPicks={setPicks}
            filters={filters}
            setFilters={setFilters}
            sort={sort}
            setSort={setSort}
            showOnlyMine={showOnlyMine}
            setShowOnlyMine={setShowOnlyMine}
          />

          <window.TweaksPanel title="Tweaks">
            <window.TweakSection title="Demo state">
              <window.TweakSlider
                label="Pre-filled picks"
                value={tweaks.preFill}
                onChange={(v) => setTweak('preFill', v)}
                min={0} max={20} step={1}
              />
              <window.TweakToggle
                label="Default 'Leaning to me' filter on"
                value={tweaks.leansDefaultOn}
                onChange={(v) => setTweak('leansDefaultOn', v)}
              />
            </window.TweakSection>
          </window.TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
