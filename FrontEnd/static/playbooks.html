<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playbooks - GOB</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
  <link rel="stylesheet" href="playbooks.css">
</head>
<body>
  <div class="playbooks-container">
    <!-- Header Row -->
    <header class="playbooks-header">
      <h1 class="page-title">Playbooks</h1>
      <div class="header-actions">
        <p class="helper-text" id="submit-helper" style="display: none;">All sections must total 100% to submit.</p>
        <button id="submit-btn" class="submit-button" disabled>
          Save Playbooks
        </button>
        <button id="back-btn" class="back-button">
          Back
        </button>
      </div>
    </header>

    <!-- Position Filter Buttons -->
    <div class="position-filter-row">
      <button class="position-filter-btn" data-position="standard">Standard</button>
      <button class="position-filter-btn" data-position="PG">PG</button>
      <button class="position-filter-btn" data-position="SG">SG</button>
      <button class="position-filter-btn" data-position="SF">SF</button>
      <button class="position-filter-btn" data-position="PF">PF</button>
      <button class="position-filter-btn" data-position="C">C</button>
    </div>

    <!-- Main 3-Column Grid (Offense spans 2 columns) -->
    <div class="playbooks-grid">
      <!-- Column 1-2: Offense Play Calls (spans 2 columns) -->
      <div class="column offense-column offense-column-wide">
        <div class="column-title-container">
          <h2 class="column-title">Offense</h2>
          <button id="even-distribution-all-btn" class="even-distribution-all-btn">Even Distribution - All</button>
        </div>
        
        <!-- Motion Offense Section -->
        <div class="section" data-section="motion">
          <div class="section-header">
            <h3 class="section-title">Motion Offense</h3>
            <button class="even-distribution-btn" data-section="motion">Even Distribution</button>
          </div>
          <div id="motion-rows" class="rows-container"></div>
          <div class="section-footer">
            <span class="total-label">Total: <span class="total-value" id="motion-total">100</span>%</span>
            <span class="error-message" id="motion-error"></span>
          </div>
        </div>

        <!-- Set Play Inside Section -->
        <div class="section" data-section="set-play-inside">
          <div class="section-header">
            <h3 class="section-title">Set Play Inside Offense</h3>
            <button class="even-distribution-btn" data-section="set-play-inside">Even Distribution</button>
          </div>
          <div id="set-play-inside-rows" class="rows-container"></div>
          <div class="section-footer">
            <span class="total-label">Total: <span class="total-value" id="set-play-inside-total">100</span>%</span>
            <span class="error-message" id="set-play-inside-error"></span>
          </div>
        </div>

        <!-- Set Play Attack Section -->
        <div class="section" data-section="set-play-attack">
          <div class="section-header">
            <h3 class="section-title">Set Play Attack Offense</h3>
            <button class="even-distribution-btn" data-section="set-play-attack">Even Distribution</button>
          </div>
          <div id="set-play-attack-rows" class="rows-container"></div>
          <div class="section-footer">
            <span class="total-label">Total: <span class="total-value" id="set-play-attack-total">100</span>%</span>
            <span class="error-message" id="set-play-attack-error"></span>
          </div>
        </div>

        <!-- Set Play Outside Section -->
        <div class="section" data-section="set-play-outside">
          <div class="section-header">
            <h3 class="section-title">Set Play Outside Offense</h3>
            <button class="even-distribution-btn" data-section="set-play-outside">Even Distribution</button>
          </div>
          <div id="set-play-outside-rows" class="rows-container"></div>
          <div class="section-footer">
            <span class="total-label">Total: <span class="total-value" id="set-play-outside-total">100</span>%</span>
            <span class="error-message" id="set-play-outside-error"></span>
          </div>
        </div>

        <!-- Assigned Plays List -->
        <div class="assigned-plays-section">
          <h3 class="section-title">Assigned Plays 1-6</h3>
          <div id="assigned-plays-list" class="assigned-plays-list"></div>
        </div>
      </div>

      <!-- Column 3-4: Defense Play Calls (spans 2 columns) -->
      <div class="column defense-column defense-column-wide">
        <h2 class="column-title">Defense</h2>
        
        <!-- Man Defense Section -->
        <div class="section" data-section="man-defense">
          <div class="section-header">
            <h3 class="section-title">Man Defense</h3>
            <button class="even-distribution-btn" data-section="man-defense">Even Distribution</button>
          </div>
          <div id="man-defense-rows" class="rows-container"></div>
          <div class="section-footer">
            <span class="total-label">Total: <span class="total-value" id="man-defense-total">100</span>%</span>
            <span class="error-message" id="man-defense-error"></span>
          </div>
        </div>

        <!-- Zone Defense Section -->
        <div class="section" data-section="zone-defense">
          <div class="section-header">
            <h3 class="section-title">Zone Defense</h3>
            <button class="even-distribution-btn" data-section="zone-defense">Even Distribution</button>
          </div>
          <div id="zone-defense-rows" class="rows-container"></div>
          <div class="section-footer">
            <span class="total-label">Total: <span class="total-value" id="zone-defense-total">100</span>%</span>
            <span class="error-message" id="zone-defense-error"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script src="/js/shared/timeoutNavigationHelper.js"></script>
  <script src="/js/config/api-config.js"></script>
  <script src="playbooks.js"></script>
</body>
</html>
