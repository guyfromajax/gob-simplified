<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/js/shared/authGuard.js"></script>
  <script src="/js/config/api-config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jamie's CC - GOB</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
  <link rel="stylesheet" href="/jamies-cc.css">
</head>
<body>
  <div class="jcc-container">
    <header class="jcc-header">
      <h1>Jamie's Command Center</h1>
      <p class="jcc-subtitle">Config overrides (admin only). Changes are permanent until you change them again.</p>
      <div id="jcc-message" class="jcc-message" role="alert" aria-live="polite"></div>
      <button type="button" id="jcc-save" class="jcc-btn jcc-btn-primary">Save changes</button>
    </header>

    <main id="jcc-main">
      <div id="jcc-loading">Loading config…</div>
      <div id="jcc-denied" class="jcc-denied" style="display: none;">Admin access required.</div>
      <div id="jcc-content" style="display: none;"></div>
    </main>
  </div>
  <script src="/jamies-cc.js"></script>
</body>
</html>
